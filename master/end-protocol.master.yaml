  Claude Code session is active there (deliver as a PR if yes or unknown).
  Rules of the write: the companion's own governing document (its
  PROTOCOL.md, or the doc it declares) is authoritative for its mechanics and
  wins over anything here; SURGICAL operations only, applied to files read
