# >>> block E-020 | relay_assessment_and_write | reader: cw | render_when: companion_repos non-empty
relay_assessment_and_write: |
  STEP 8d — COMPANION REPO ASSESSMENT AND WRITE. This repo declares companion
  repos: {{companion_repos}}. At EVERY wrap, assess whether anything crossed a
  repo seam this session: a cross-repo contract created or changed; a new
  obligation placed on another repo; an inbound ripple resolved (with
  evidence); a question raised or answered; the companion's state snapshot
  gone stale. A wrap that is silent on the companion is defective.

  If NOTHING crossed a seam, the wrap report and the handoff status carry the
