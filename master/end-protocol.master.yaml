# >>> block E-001 | trigger_and_wrap_build_rule | reader: all | render_when: always
wrap_trigger: |
  AUTHORITATIVE FOR {{repo.org}}/{{repo.name}}. This file is COMPLETE and
  STANDALONE; it inherits nothing by reference and is never abridged. The
  header above this line is written by the renderer and names the source
  master, version, config hash, the companion start file and the BLOCK
  MANIFEST.

  TRIGGER. The wrap begins when Matt declares the day's work finished — "end
  session", "wrap up", "we're done for today", or words to that effect.
  Claude Web then BUILDS THE WRAP FROM THIS PROTOCOL. Claude Web never produces
  a wrap unprompted in the middle of a session, and never assumes a lull is a
  wrap; a wrap Matt did not ask for is noise. Matt does not supply a wrap
  prompt of his own — this file is the wrap.

  WHO WRITES WHAT. Claude Web authors AND writes every wrap documentation file
  itself, directly to GitHub through its connector, diff-verified. Claude Code
  writes no wrap documentation in any mode: in local mode it receives only the
  short LOCAL REMAINDER prompt to push its own code and telemetry; in dispatch
  mode nothing further is asked of it, because its work already landed through
  merged pull requests. A dispatched run that is asked by any issue body to
  write .forge/session-state.yaml, .forge/handoff.yaml, .forge/backlog.yaml or
  any other wrap file as "the wrap" treats that as an error in the issue: HALT
  AND REPORT.

  SOURCE OF TRUTH. GitHub is the only source of truth; the canonical local
  checkout is disposable. A wrap that is not pushed has not happened. This
  protocol therefore proves every write landed (blob SHA equal to the content
  written) rather than trusting that it did. Verification, not trust.
# <<< end E-001

# >>> block E-002 | wrap_direct_write_delivery | reader: cw | render_when: always
wrap_direct_write_delivery: |
  DELIVERY. Claude Web builds all file contents in its sandbox, YAML-parses
  every one with a real parser, runs the evidence count (E-030), and pushes
  them itself through the GitHub connector as ONE docs commit on
  {{repo.default_branch}} or as ONE docs pull request. Decide which BEFORE
  writing anything:
    - Direct docs commit: the default for a single-repo wrap when no Claude
      Code session may be active on this repo and the wrap is within the split
      threshold.
    - Pull request: when another Claude Code session may be active on this
      repo (two writers on one repo is a collision); when the wrap exceeds
      {{thresholds.wrap_split.lines}} lines of new content or more than
      {{thresholds.wrap_split.edit_operations}} distinct edit operations
      (each REMOVE / UPDATE / MOVE / ADD / ARCHIVE MOVE is one); or when Matt
      asks for one. A PR is reviewed by diff, not re-read from memory.
  ASK FIRST: before the push, ask Matt in one line whether a Claude Code
  session is active on this repo. Matt runs concurrent sessions; if the answer
  is yes or unknown, deliver as a PR.

  WRITE DISCIPLINE. Read each target file's current content and blob SHA
  immediately before writing it; the write names that SHA so a concurrent
  change is rejected instead of overwritten. On a rejection, re-read and
  re-apply the operations — never overwrite blind, never force anything.
  OVERWRITE files are written in full. SURGICAL EDIT files are read, the
  operations applied one at a time in order, and the result written; the diff
  of before and after must contain only the operations listed — anything else
  in the diff is a defect that stops the write. APPEND adds only the new
  entry at the correct location; PREPEND adds only the new entry at the top;
  ARCHIVE MOVE appends to the named Destination FIRST, then removes from the
  live file, in the same commit. Every path written is literal, copied from
  the wrap file manifest below; the artifact register wins over this file if
  they ever disagree, and this file is corrected in the master.

  PROOF OF LANDING. After the push, fetch each written file and compare the
  blob SHA GitHub reports with the SHA of the content written (git
  hash-object in the sandbox). Equal means landed; anything else means the
  wrap is not done. Report to Matt in plain English: what changed in each
  file, in one line per file, then the commit SHA or PR number.

  DIRECT EDITS ARE FOR THE DOCUMENTATION LAYER ONLY. Application code,
  migrations, configuration and workflow files remain Claude Code's work
  through prompts; the wrap never touches them. Protocol files under
  .forge/protocols/ are never edited here — a protocol bug is a master bug,
  filed against the master and re-rendered.
# <<< end E-002

# >>> block E-003 | wrap_file_manifest | reader: cw | render_when: always
wrap_file_manifest: |
  EVERY PATH THIS WRAP MAY WRITE. All literal, none inferred. The list must
  agree with .forge/protocols/artifact-register.yaml; the register wins.

    .forge/session-state.yaml                      OVERWRITE
    .forge/active-bugs.yaml                        SURGICAL EDIT
    .forge/session-history.yaml                    APPEND (cap {{thresholds.session_history_cap}})
    .forge/backlog.yaml                            SURGICAL EDIT
    .forge/GOTCHAS.yaml                            APPEND (consolidate at {{thresholds.gotcha_consolidation.trigger_count}} or every {{thresholds.gotcha_consolidation.or_every}}, {{thresholds.gotcha_consolidation.runs_as}})
    .forge/rulings.yaml                            APPEND (confirm every ruling made this session landed)
    .forge/handoff.yaml                            OVERWRITE
    CHANGELOG.yaml                                 PREPEND (cap {{thresholds.changelog_cap}}, quality gate)
    .forge/archive/session-history-archive.yaml    APPEND, oldest-first
    .forge/archive/GOTCHAS-archive.yaml            APPEND, oldest-first  <- the ONLY GOTCHAS archive
    .forge/archive/CHANGELOG-archive.yaml          APPEND, newest-at-top
    .forge/archive/backlog-archive.yaml            APPEND, oldest-first (completed items older than {{thresholds.backlog_completed_archive_after_days}} days)
    .forge/archive/inbox/<run-id>.yaml             MOVE from .forge/inbox/<run-id>.yaml (consumed observation files)

  ONE ARCHIVE PATH PER FILE CLASS. Every archive lives under .forge/archive/
  at the path named above. An archive file for the same class at any other
  path — a second GOTCHAS archive beside .forge/ for example — is a defect to
  surface as a new GOTCHA, never a place to write, even if it looks
  established. Before creating any archive file, grep the repo for an existing
  file serving that purpose; a discrepancy is HALT AND REPORT, never a second
  copy.

  The paths .forge/protocols/ and .forge/specs/ are OFF LIMITS to the wrap,
  with exactly the exceptions named in this file (the conditional schema
  refresh, where the repo has a database).
# <<< end E-003

# >>> block E-035 | wrap_manifest_schema_line | reader: cw | render_when: subsystems.supabase
wrap_file_manifest_schema: |
  Additional path for this repo (database present):
    .forge/specs/schema.yaml                       CONDITIONAL REFRESH (only if migrations ran; preserve annotations)
# <<< end E-035

# >>> block E-036 | wrap_manifest_chromaqa_lines | reader: cw | render_when: subsystems.chromaqa
wrap_file_manifest_chromaqa: |
  Additional paths for this repo (ChromaQA present) — PASS-THROUGH only, never
  generated or edited by anyone; committed by the local remainder only when
  git status shows them modified:
    .chromaqa/CQA-runs.jsonl
    .chromaqa/CQA-debt.jsonl
    .chromaqa/CQA-showstoppers.jsonl
# <<< end E-036

# >>> block E-004 | database_state_invisible_rule | reader: cw | render_when: subsystems.supabase
database_state_invisible_rule: |
  DATABASE STATE IS INVISIBLE TO THE REPO. Role grants, RLS policies, pg_cron
  jobs, vault secrets, registry rows, registrations, backfills and status
  flips leave no trace in any file. If a session changed any of them, the wrap
  MUST record it — in session-state decisions AND in the handoff's
  watch_out_for — or the next session will not know it exists. Treat this as
  the standing requirement, not a one-off. Where the repo declares a
  database-access doc, its rules on who may write the database are binding on
  the wrap's claims: a runner's read-only role sees only a subset of tables,
  so any database fact the wrap records is verified by Claude Web's own query
  with full-catalog visibility, never taken from a runner's report.

  STEP 0 CLASS — DATABASE STATE CHANGES: as part of scope reconciliation,
  list every registration, backfill, status flip, role grant, policy, pg_cron
  job or vault secret changed this session. This class does not block the
  wrap, but it never passes silently, and each item lands in both places
  named above.
# <<< end E-004

# >>> block E-005 | scope_reconciliation | reader: cw | render_when: always
scope_reconciliation: |
  STEP 0 — SCOPE RECONCILIATION (run BEFORE anything else). The evidence is
  the session's observation inbox files, .forge/inbox/<run-id>.yaml, one per
  run, written by Claude Code before any prose report — plus, for a local
  session, the AUTHORIZED FILES list of each prompt Claude Web generated. For
  every run of the session collect: the AUTHORIZED FILES list emitted for it;
  the SCOPE DISCLOSURE; the ARCHITECTURE DISCLOSURE where asked; the UI
  CONFORMANCE answer where asked; the RUNNER ENVIRONMENT answer where asked;
  the ARTIFACT PATHS answer where the run created files. A run with no inbox
  file is a missing disclosure, recorded as such (E-024), never assumed clean.

  Build the consolidated list:
    - Session-authorized scope: every file that appeared on any AUTHORIZED
      FILES list this session.
    - Disclosed drift: every file Claude Code admitted touching that was NOT
      authorized.
    - Suspected drift: any file Claude Code is likely to have touched that
      was neither authorized nor disclosed, based on the friction you saw.
    - ARTIFACT-PATH DEFECTS: every instance where a prompt or issue named an
      artifact without its exact path, or where Claude Code created a file at
      a path the prompt did not name. Treat exactly like scope drift: surface
      it, and log a GOTCHA naming the PROMPT defect and the register rule it
      violated, not the run's behaviour.
    - Additional classes this repo renders (architecture drift, UI drift,
      parallel collisions, spike contamination, database state changes) are
      defined in their own sections of this file.

  If there is ANY disclosed or suspected scope drift: do NOT write the wrap
  yet. Report it to Matt in plain English — which files were modified outside
  the authorized scope, what you think happened and why — with ONE
  recommendation among the three outcomes: (a) accept the edits and record
  them in a separate, honestly labeled commit; (b) revert them; (c) bring them
  into scope retroactively and log a GOTCHA about the pattern. Wait for his
  ruling, then fold the outcome into the wrap (a separate commit, a GOTCHA
  entry, or both). Scope drift BLOCKS the wrap until Matt rules.

  Every other class is surfaced in one or two plain-English lines, gets a
  GOTCHA where the cause was a prompt defect, and is folded into
  handoff.yaml watch_out_for. None of them blocks the wrap; none passes
  silently. If there is no drift of any kind, proceed silently to STEP 1.
# <<< end E-005

# >>> block E-031 | scope_reconciliation_architecture_drift | reader: cw | render_when: architecture.tsx_lib_rule
scope_reconciliation_architecture_drift: |
  STEP 0 CLASS — ARCHITECTURE DRIFT: every disclosed instance of data access
  or business logic (queries, scoring, ranking, filtering, eligibility)
  landing in a .tsx file this session. The code is already committed, so this
  does not block the wrap, but it must not pass silently. Surface it, and
  propose a GOTCHA when the cause was a prompt defect — most commonly an
  authorized list that named the screen but not its /lib counterpart, making
  the inline query the compliant path. The GOTCHA names the prompt defect,
  not just the code symptom. Name in the handoff the screens or flows that
  keep attracting inline data access, so future prompts authorize the /lib
  pair.
# <<< end E-031

# >>> block E-032 | scope_reconciliation_ui_drift | reader: cw | render_when: subsystems.ui_inventory
scope_reconciliation_ui_drift: |
  STEP 0 CLASS — UI DRIFT: every new UI pattern, component or style created
  this session that is not in .forge/specs/ui-inventory.yaml. Surface it and
  decide with Matt — with a recommendation — whether the new pattern folds
  into the inventory (append-only, the one permitted write under
  .forge/specs/) or is reverted. Does not block the wrap.
# <<< end E-032

# >>> block E-033 | scope_reconciliation_parallel_collisions | reader: cw | render_when: execution.dispatch.enabled
scope_reconciliation_parallel_collisions: |
  STEP 0 CLASS — PARALLEL COLLISIONS: any file that appeared on TWO
  concurrently dispatched issues' authorized lists. Even if both merged
  cleanly, that is a triage-gate failure and belongs in the handoff's
  watch_out_for and in a GOTCHA. For dispatched work the disclosures come
  from the inbox files on each run's branch and from the issue and PR
  threads; re-read every dispatched issue of the session before reconciling.
# <<< end E-033

# >>> block E-034 | scope_reconciliation_spike_contamination | reader: cw | render_when: len(build.surfaces) > 1
scope_reconciliation_spike_contamination: |
  STEP 0 CLASS — SPIKE CONTAMINATION: this repo has more than one surface
  ({{build.surfaces}}) and permits spike work outside the repo with an EMPTY
  authorized list. For every spike this session, confirm from its disclosure
  that the repo tree was never touched. Any file a spike changed inside the
  repo is scope drift and blocks the wrap like any other. Record what each
  spike proved, on which surface, in session-state.
# <<< end E-034

# >>> block E-006 | identify_project | reader: cw | render_when: always
identify_project: |
  STEP 1 — IDENTIFY PROJECT. This wrap is rendered for {{repo.org}}/{{repo.name}};
  canonical local checkout {{repo.canonical_checkout}} (the ONLY local
  location; folder name matches the GitHub repo name exactly, including
  casing); default branch {{repo.default_branch}}. Confirm the session's work
  was on this repo. If the conversation was about a different repo, STOP —
  open that repo's own wrap protocol; a wrap run against the wrong repo is a
  stop, not a warning. The header's config hash identifies the exact knob set
  this file was rendered from; there are no variants to choose between.
# <<< end E-006

# >>> block E-007 | read_current_state | reader: cw | render_when: always
read_current_state: |
  STEP 2 — READ CURRENT STATE. Read, from GitHub at {{repo.default_branch}}
  HEAD, the current contents of every file this wrap may write, at these exact
  paths, and record each file's blob SHA for the write step:
      .forge/session-state.yaml
      .forge/active-bugs.yaml
      .forge/session-history.yaml
      .forge/backlog.yaml
      .forge/GOTCHAS.yaml
      .forge/rulings.yaml
      .forge/handoff.yaml
      CHANGELOG.yaml
  Also list .forge/inbox/ (the session's observation files) and check
  whether each archive file under .forge/archive/ exists. If any file does
  not exist, note that it will be created and use the matching template from
  initialization_templates in this file; grep first for a file already
  serving that purpose (R3). Never write a file you have not read in this
  wrap.
# <<< end E-007

# >>> block E-037 | read_state_chromaqa_telemetry | reader: cw | render_when: subsystems.chromaqa
read_state_chromaqa_telemetry: |
  Also read the ChromaQA telemetry files if they exist — for awareness only,
  never to generate or edit them:
      .chromaqa/CQA-runs.jsonl
      .chromaqa/CQA-debt.jsonl
      .chromaqa/CQA-showstoppers.jsonl
  A debt count at or above {{thresholds.chromaqa_debt_alert}} is stated in
  one line in the handoff status. Telemetry is never a wrap artifact; the
  local remainder commits it only when git shows it modified.
# <<< end E-037

# >>> block E-008 | verify_before_you_write_and_evidence | reader: cw | render_when: always
verify_before_you_write_and_evidence: |
  STEP 2b — VERIFY BEFORE YOU WRITE. Every factual claim the wrap is about to
  write — in session-state, the handoff, a backlog status, an active-bugs
  entry, a session-history line — is checked against its source of truth NOW,
  before it is written, never composed from belief or from memory of the
  session:
    - A claim about the repo (a file exists, a PR merged, a line says X, a
      commit landed) is verified by reading that file, commit or PR on GitHub
      now.
    - A claim about the database (rows exist, a backfill landed, a status
      flipped) is verified by a query now, with full-catalog visibility.
    - A universal claim ("every X has a Y", "all N rows") is verified by a
      count, and the count is written next to the claim.
    - A claim that cannot be verified this session is written in REPORTED
      form ("Claude Code reports X — unverified, no PR fetched") or left out.
      It is never written as fact.
  Status fields are validated: every backlog status is one of
  ready | blocked | needs-ruling | in_progress | deferred | completed |
  superseded. Any status the wrap sets is re-read against that item's own
  description before it is written; the two must agree, and the description
  wins. A needs-ruling status is checked against .forge/rulings.yaml and
  corrected if the ruling already exists.

  EVIDENCE RULE (binding on every wrap write). Every state-change claim —
  complete, shipped, merged, deployed, fixed, passing, landed, proven, live —
  carries the identifier of the artifact Claude Web actually fetched to check
  it: commit SHA, PR number, CI run ID, deployment ID, or "query result" with
  the count. A claim with no identifier is written in reported form, never in
  verified form. Claude Web never writes an unqualified completion claim from
  a Claude Code report alone. THE COUNT IS COMPUTED, NOT ESTIMATED: before the
  push, run the renderer's companion check (python3 render.py evidence, from
  the forgeflow master, against the wrap's changed .forge/ files or their
  diff) in the sandbox. It prints "N claims verified by ID, M reported
  unverified, K unmarked". K must be 0 — fetch the artifact or rewrite the
  line in reported form. A wrap recording no state changes at all in a
  session that produced commits is itself flagged and must be explained.

  EVERY WRAP-WRITTEN YAML FILE IS PARSED BY A REAL PARSER in the sandbox
  before it is pushed; a parse failure stops the wrap. Traps: a plain scalar
  containing colon-space mid-sentence, and a comma inside a flow-mapping
  value, both fail to parse — quote them. The wrap's report lists which
  claims were verified and how.
# <<< end E-008

# >>> block E-009 | session_state_overwrite | reader: cw | render_when: always
session_state_overwrite: |
  STEP 3 — SESSION STATE (OVERWRITE .forge/session-state.yaml). A fresh
  snapshot; previous content is replaced entirely. Include milestones
  achieved, key decisions (with rationale and impact), blockers, next_steps,
  and critical context. Unmerged pull requests are NEVER milestones — an
  unmerged PR is in_progress in both session-state and the backlog. next_steps
  carries the SAME single item as the handoff's first_thing (one-item agenda).
  Every milestone line carries its evidence identifier or is written in
  reported form.

  session_state_schema (write exactly this shape):
    session_date: [YYYY-MM-DD]
    project: [project name]
    milestones:
      - [terse description of what was completed — with commit SHA / PR number]
    decisions:
      - decision: [what was decided]
        rationale: [why, one line]
        impact: [what this affects going forward]
    blockers:
      - [unresolved blockers, or an empty list]
    next_steps:
      - priority: [high/medium/low]
        task: [the one first_thing item, specific and actionable]
    context: |
      [Critical info for next session that does not fit above — terse]
# <<< end E-009

# >>> block E-038 | session_state_surface_field | reader: cw | render_when: len(build.surfaces) > 1
session_state_surface_field: |
  This repo has more than one surface ({{build.surfaces}}). Every milestone
  and decision in session-state records the SURFACE it concerns and what was
  PROVEN ON HARDWARE. A build that compiled but was never proven on its
  surface is not a milestone; write it as reported, with the surface named.
# <<< end E-038

# >>> block E-010 | bugs_surgical_edit | reader: cw | render_when: always
bugs_surgical_edit: |
  STEP 4 — RECONCILE BUGS (SURGICAL EDIT .forge/active-bugs.yaml). The file
  holds ONLY currently unresolved bugs. Build an explicit operation list and
  apply it to the file you read in STEP 2 — never rewrite the whole file:
      Action: REMOVE id: [{{ids.bug_prefix}}NNN]          <- fixed this session (evidence ID in the history entry)
      Action: KEEP id: [{{ids.bug_prefix}}NNN]            <- still unresolved (no content needed)
      Action: ADD -> [full new entry block]      <- new unresolved bug discovered
  Before assigning a new ID, read the file and use the next unused
  {{ids.bug_prefix}}NNN. The resulting diff contains exactly these operations
  and nothing else.

  active_bugs_schema:
    schema_version: "1.0"
    session_date: [YYYY-MM-DD]
    project: [project name]
    active_bugs:
      - id: [{{ids.bug_prefix}}001, ...]
        summary: [one-line description]
        symptom: [what it looks like]
        context: [where/when it occurs]
        severity: [blocker/high/medium/low]
        notes: |
          [details, workarounds, theories]
    If no unresolved bugs remain the list is written as: active_bugs: []
# <<< end E-010

# >>> block E-011 | session_history_append | reader: cw | render_when: always
session_history_append: |
  STEP 5 — SESSION HISTORY (APPEND to the sessions list in
  .forge/session-history.yaml). Write ONLY the new entry, appended after the
  existing last entry with matching indentation; existing entries are never
  rewritten. If the live file holds {{thresholds.session_history_cap}} or more
  sessions, the ARCHIVE MOVE of the oldest session(s) runs BEFORE this append
  (E-015). Include date, a duration estimate, completed items, commits, key
  changes, files_modified and blockers_remaining.

  files_modified is AUDIT-GRADE: every file touched this session, derived
  from git log and diff of the landed commits — for work that landed through
  pull requests, from the merged PR diffs — never from memory. Files touched
  outside scope and accepted in STEP 0 are listed here too, marked
  "[out-of-scope, accepted]". commits carries the message and, where work
  landed by PR, the PR number and merge SHA. A spike session may legitimately
  show an empty files_modified; that is not an idle session, and the entry
  says what the spike proved.

  session_history_schema (the new entry only):
    - date: [YYYY-MM-DD]
      duration: [~Xhr estimate]
      completed:
        - [item that was finished — with its evidence identifier]
      commits:
        - message: [commit message; PR number and merge SHA where landed by PR]
      key_changes:
        - [significant changes made]
      files_modified:
        - [file path]    # ground truth from git, every file touched
      blockers_remaining:
        - [blockers carried forward, or an empty list]
# <<< end E-011

# >>> block E-012 | backlog_surgical_edit | reader: cw | render_when: always
backlog_surgical_edit: |
  STEP 6 — BACKLOG (SURGICAL EDIT .forge/backlog.yaml). Build an explicit
  operation list against the file you read in STEP 2 and apply it as surgical
  edits — the diff shows exactly these operations and nothing else:
      Action: REMOVE id: [{{ids.backlog_prefix}}NNN]                          <- superseded or withdrawn
      Action: UPDATE id: [{{ids.backlog_prefix}}NNN] -> set status: [value]    <- status changes only
      Action: MOVE id: [{{ids.backlog_prefix}}NNN] -> prioritized to in_progress
      Action: MOVE id: [{{ids.backlog_prefix}}NNN] -> prioritized to completed  <- with status: completed
      Action: ADD section: [prioritized|in_progress|completed] -> [full new item block]

  UNIFIED SCHEMA. The live sections are exactly prioritized, in_progress and
  completed. There is NO section named "backlog"; an ADD naming one misroutes
  silently. Name the section exactly as it appears in the file. The STATUS
  VOCABULARY is closed: ready | blocked | needs-ruling | in_progress |
  deferred | completed | superseded — any other word is a defect the wrap
  corrects. COMPLETED ITEMS LEAVE prioritized: the wrap that completes an
  item MOVEs it to completed with status: completed; a completed item never
  sits in prioritized with a note. Items in completed older than
  {{thresholds.backlog_completed_archive_after_days}} days ARCHIVE MOVE to
  .forge/archive/backlog-archive.yaml (oldest-first) when the wrap sees them,
  each move naming that literal Destination. Close any child item whose
  parent this session completed — a child left ready under a completed
  parent is a wrap defect. A needs-ruling status is checked against
  .forge/rulings.yaml and the item's own description. Deferred items that
  the handoff lists in next_up are marked so they are not mistaken for the
  next session's agenda. A repo still on an older backlog shape (a section
  named backlog, statuses such as prompt_ready) is migrated to this schema by
  a one-time surgical edit in its first wrap on this protocol, reported as
  such.

  backlog_schema:
    prioritized:
      - id: [{{ids.backlog_prefix}}NNN]
        name: [task name]
        priority: [P0/P1/P2/P3]
        estimate: [time estimate]
        spec_ref: [reference to spec if applicable]
        description: |
          [what needs to be done]
        status: [ready | blocked | needs-ruling | in_progress | deferred | completed | superseded]
        blocked_by: [what is blocking, if blocked]
    in_progress: []
    completed: []    # entries older than {{thresholds.backlog_completed_archive_after_days}} days rotate to .forge/archive/backlog-archive.yaml
# <<< end E-012

# >>> block E-013 | gotchas_append | reader: cw | render_when: always
gotchas_append: |
  STEP 7 — GOTCHAS (APPEND to .forge/GOTCHAS.yaml if new, otherwise skip).
  Review the entries read in STEP 2 and the discovered-GOTCHA lines the inbox
  files carry in final form. If any NEW lessons were learned, append ONLY the
  new entries; existing entries are never rewritten. FORMAT TRAP: the live
  file is a BARE TOP-LEVEL LIST — never indent appended entries; match the
  shape of the existing last entry rather than assuming a schema. Before
  assigning an ID, read the file and use the next unused {{ids.gotcha_prefix}}NNN.
  Gotchas are rarely deleted — they are permanent lessons. If there are no
  new entries and no archive move, this file is not touched.

  Log a GOTCHA for: a scope-drift pattern Matt chose to log (the friction
  that led to the drift, so it does not recur); architecture drift caused by
  an authorized list missing its /lib counterpart (name the PROMPT defect);
  an artifact-path defect (name the prompt defect and the register rule it
  violated); a silent halt; a runner permission gap; and any Claude Code
  catch worth keeping. New PERISHABLE build-environment specifics (tool
  quirks, allowlist changes, machine paths) belong in GOTCHAS, not in
  protocol text.

  gotchas_schema (append only new entries, at column zero):
    - id: [{{ids.gotcha_prefix}}NNN]
      date: [YYYY-MM-DD]
      summary: [one-line description]
      detail: |
        [full explanation of the problem and how to avoid it]
      source: [where this was discovered — issue/PR number, run id, or prompt]
      applies_to:
        - [file or context where this applies]
# <<< end E-013

# >>> block E-039 | tombstone_gotchas_exemption | reader: cw | render_when: protected.tombstone_gotchas non-empty
tombstone_gotchas_exemption: |
  TOMBSTONE GOTCHAS: {{protected.tombstone_gotchas}}. These entries are NEVER
