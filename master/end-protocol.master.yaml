# >>> block E-018 | schema_refresh_gate | reader: cw | render_when: subsystems.supabase
schema_refresh_gate: |
  STEP 8b — SCHEMA REFRESH GATE (CONDITIONAL REFRESH of .forge/specs/schema.yaml).
  Ask: did this session CREATE or ALTER any tables, add or remove columns,
  create indexes, or change constraints? If NO: the schema file is not
  touched and not mentioned. If YES: the refresh is CLAUDE WEB'S OWN WORK,
  run now through the Supabase connection with full-catalog visibility, and
  written by the wrap like every other file. Never delegate it to a runner or
  to a local Claude Code session: a runner's read-only role sees only a
  subset of tables, and information_schema FILTERS BY PRIVILEGE, so it would
  write a silently INCOMPLETE schema document that looks complete. A wrong
  schema document is worse than a missing one.

  PRESERVE RULE. schema.yaml is HAND-ANNOTATED and carries its own
  verify-and-carry-forward method. Never blanket-overwrite it. Diff the live
  catalog against the tables already documented, carry EVERY existing
  annotation forward, add only what is genuinely new, and report what was
  added versus preserved. Repo migration filenames do not match Supabase
  version numbers — match migrations by NAME. The wrap commit message gains
  the suffix " + schema refresh".

  The refresh is DISCOVERY-BASED: never assume a fixed set of table names.
  Discover the base tables in the public schema first, then run the six
  detail queries against exactly those tables (enums are schema-wide). If the
  discovered list is empty, write tables: {} and skip queries 1-5. Policy
  queries need a ::text cast on polcmd.

  Discovery query (run FIRST):
    SELECT table_name
    FROM information_schema.tables
    WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
    ORDER BY table_name;
  Let DISCOVERED_TABLES be the list returned and use it in the IN (...)
  clause of queries 1-5.

  Query 1 — All columns:
    SELECT t.table_name, c.column_name, c.ordinal_position, c.data_type,
      c.udt_name, c.is_nullable, c.column_default, c.character_maximum_length
    FROM information_schema.tables t
    JOIN information_schema.columns c
      ON t.table_name = c.table_name AND t.table_schema = c.table_schema
    WHERE t.table_schema = 'public' AND t.table_type = 'BASE TABLE'
      AND t.table_name IN (DISCOVERED_TABLES)
    ORDER BY t.table_name, c.ordinal_position;

  Query 2 — Indexes:
    SELECT tablename, indexname, indexdef FROM pg_indexes
    WHERE schemaname = 'public'
      AND tablename IN (DISCOVERED_TABLES)
    ORDER BY tablename, indexname;

  Query 3 — Check constraints:
    SELECT tc.table_name, tc.constraint_name, tc.constraint_type, cc.check_clause
    FROM information_schema.table_constraints tc
    LEFT JOIN information_schema.check_constraints cc
      ON tc.constraint_name = cc.constraint_name
    WHERE tc.table_schema = 'public'
      AND tc.table_name IN (DISCOVERED_TABLES)
    ORDER BY tc.table_name, tc.constraint_type;

  Query 4 — Foreign keys:
    SELECT tc.table_name, kcu.column_name,
      ccu.table_name AS foreign_table, ccu.column_name AS foreign_column
    FROM information_schema.table_constraints tc
    JOIN information_schema.key_column_usage kcu
      ON tc.constraint_name = kcu.constraint_name
    JOIN information_schema.constraint_column_usage ccu
      ON tc.constraint_name = ccu.constraint_name
    WHERE tc.constraint_type = 'FOREIGN KEY' AND tc.table_schema = 'public'
      AND tc.table_name IN (DISCOVERED_TABLES)
    ORDER BY tc.table_name;

  Query 5 — RLS status:
    SELECT relname AS table_name,
      relrowsecurity AS rls_enabled, relforcerowsecurity AS rls_forced
    FROM pg_class
    WHERE relnamespace = 'public'::regnamespace
      AND relname IN (DISCOVERED_TABLES)
    ORDER BY relname;

  Query 6 — Custom enum types:
    SELECT t.typname AS enum_name, e.enumlabel AS enum_value, e.enumsortorder
    FROM pg_type t JOIN pg_enum e ON t.oid = e.enumtypid
    WHERE t.typnamespace = 'public'::regnamespace
    ORDER BY t.typname, e.enumsortorder;

  schema_structure:
    meta:
      generated: "[YYYY-MM-DD]"
      source: "Supabase live database — information_schema queries"
      tables_documented: [DISCOVERED_TABLES]
    enums:
      [enum_name]:
        values: [list in order]
    tables:
      [table_name]:
        purpose: "[one plain-English sentence inferred from columns; keep the existing annotation]"
        rls_enabled: [true/false]
        columns:
          - name: [column_name]
            type: [data_type]
            nullable: [true/false]
            default: [value or null]
            notes: "[fk reference if applicable]"
        indexes:
          - name: [index_name]
            columns: [columns]
            unique: [true/false]
        constraints:
          - name: [constraint_name]
            type: [CHECK/UNIQUE/FK]
            definition: [clause or reference]
  For purpose: infer from the table name and columns; if genuinely unclear,
  write "# REVIEW: purpose unclear from schema alone".
# <<< end E-018

# >>> block E-019 | rulings_confirm_landed | reader: cw | render_when: always
