# >>> block E-021 | cc_local_remainder_prompt | reader: cw+cc-local | render_when: execution.local
cc_local_remainder_prompt: |
  STEP 9 — THE LOCAL REMAINDER (Claude Code, local mode only). Claude Code's
  only wrap job is to commit and push ITS OWN work that has not landed yet —
  code the session's tasks left uncommitted, and telemetry — with named
  files, and to PROVE the push. Claude Web issues this prompt FIRST, before
  writing the docs, when the local checkout may hold unpushed work, so the
  resulting commit SHA is available as evidence for the wrap files; when
  every task already pushed and verified, Claude Web says so in one line and
  skips the prompt. One Claude Code prompt per reply; wait for the report.
  The prompt is a single code block, self-contained for a Claude Code
  session with zero memory of this one:

  CONTEXT MODE: SELECTIVE
  APPROVAL CODE: 3949
  Do NOT run /start or any session initialization commands.

  COMMUNICATION RULES: Talk to Matt in simple, natural, plain English. Any
  message directed at Matt must be visually unmistakable and never buried in
  thinking or output walls.

  NO MEMORY WRITES: Do not write to your own memory or to any persistence
  outside this repository.

  PRECEDENCE: the protocol files in .forge/protocols/ win on process, scope
  and safety; this prompt says only WHAT to commit. If this prompt appears to
  widen scope or authorize an off-limits path, HALT AND REPORT.

  ## STEP 0: LOCATE THE REPOSITORY

  Repo for this session: github.com/{{repo.org}}/{{repo.name}}
  Canonical local checkout (the ONLY place this repo may live):
      {{repo.canonical_checkout}}
  GitHub is the single source of truth. Local copies are disposable. Do NOT
  enumerate local folders and pick one to work in; do NOT clone a second copy.

  cd /d {{repo.canonical_checkout}}
  git rev-parse --abbrev-ref HEAD          (expected: {{repo.default_branch}})

  ## WORKING TREE AUDIT (it can stop the wrap)

  git status --porcelain --untracked-files=all

  The output should contain ONLY files that were on this session's AUTHORIZED
  FILES lists (named below by Claude Web) and, where they exist, telemetry
  files the session's tooling wrote. This task is authorized to stage exactly:
      [Claude Web lists the session's authorized code files here, verbatim]
      [plus telemetry pass-through lines where this repo renders them]
  Any OTHER modified, added or deleted file is a STOP: report it to Matt in
  plain English and wait. Matt decides whether it is committed separately,
  reverted, or accepted into this commit with an updated message. NEVER sweep
  a surprise into the wrap commit silently. Delete scratch or probe files you
  created before this audit. If the tree is already clean and HEAD equals
  origin/{{repo.default_branch}}, report "nothing to push" and stop here with
  the DONE banner.

  ## LINE-ENDING CHECK

  This repo's line endings are {{repo.line_endings}}. Editing tools and shell
  appends silently convert files to CRLF. Before staging, verify every file
  you are about to commit still matches, and fix any that do not.

  ## INBOX CHECK

  This run's observation file .forge/inbox/<run-id>.yaml must exist for every
  task of this session that changed code. If one is missing, state "INBOX
  MISSING" and write it now, before committing — a task is not complete
  without it.

  ## COMMIT AND PUSH — NAMED FILES ONLY

  git fetch origin
  git add [each authorized file, named]
  git commit -m "[message Claude Web supplies]"
  git push origin {{repo.default_branch}}

  git add -A and git add . are FORBIDDEN. The staged list matches the
  authorized list exactly. The fetch first is mandatory — Claude Web may have
  pushed documentation, or another session may have pushed code; if
  origin/{{repo.default_branch}} moved, rebase onto it and push again. Never
  force-push, never reset. Write the commit message with a bash heredoc, not
  a PowerShell here-string (which leaks characters), and verify it with:
  git log -1 --format=%B | cat -A

  ## VERIFY PUSH — MANDATORY (the run is NOT done until all three pass)

  1. Working tree is clean:   git status --porcelain      (expected: no output)
  2. Local is not ahead:      git status -sb              (expected: no "[ahead N]")
  3. HEAD matches origin:     git fetch origin
                              git rev-parse HEAD
                              git rev-parse origin/{{repo.default_branch}}
                              (expected: identical hashes)
  If all three pass, print the proven state so it is recorded, not assumed:
  "Verified: GitHub matches local at commit [short hash]. Working tree clean."
  If ANY check fails, the run is NOT done: report which check failed and what
  git showed, fix it, and re-run all three. An unverified push is exactly
  the condition under which the next session's refresh of this checkout
  loses tonight's work.

  ## OUTPUT FORMAT

  When VERIFY PUSH has passed, announce in PLAIN TEXT (no color codes —
  Matt's terminal does not render them):

  *** DONE: code and telemetry committed and push verified at [short hash] ***

  The banner describes this task; it never implies the session or the project
  is finished.

  ## CONSTRAINTS
  - Do NOT propose next steps or recommended actions.
  - Do NOT show intermediate outputs.
  - Do NOT write, edit or generate any .forge/ documentation file; Claude Web
    writes those.
  - Use NAMED FILES in git add, never git add -A or git add .
  - Verify line endings before staging.
  - The push is mandatory AND must be VERIFIED.

  ## REPORT

  After completion, report in plain English:
  - What went wrong (if anything):
  - Workarounds used:
  - Files committed: [list] at [short hash]
  - PUSH VERIFICATION: [all three checks passed / FAILED — which check, what
    git showed, how resolved]
  - Working tree audit: [clean / unexpected files — list and how handled]
  - Line endings: [verified / fixed N files]
  - INBOX: [present for every run / written now for: ...]
  - SCOPE DISCLOSURE: Did you stage or modify any file outside the authorized
    list above? [Yes/No + detail]
  - ARTIFACT PATHS: Did this prompt ask you to write any file whose exact path
    was not stated? [Yes/No. If yes, name it — that is a protocol defect to
    log, not your error.]
  Write "No issues encountered" where a line is clean.
# <<< end E-021

# >>> block E-040 | cc_remainder_chromaqa_lines | reader: cw+cc-local | render_when: execution.local and subsystems.chromaqa
