  chromaqa_debt:
    path: .chromaqa/CQA-debt.jsonl
    action: PASS-THROUGH (committed by the local remainder only if modified; never generated or edited)
    note: "read at session start; alert threshold {{thresholds.chromaqa_debt_alert}}"
  chromaqa_showstoppers:
    path: .chromaqa/CQA-showstoppers.jsonl
    action: PASS-THROUGH (committed by the local remainder only if modified; never generated or edited)
# <<< end E-042

