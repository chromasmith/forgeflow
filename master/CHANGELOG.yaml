# Version history of the ForgeFlow MASTER itself (not of any rendered repo).
# The top entry's `version` is the master version render.py stamps into every render.
# Newest first.
entries:
  - version: "v1.2.0"
    date: 2026-09-06
    status: RELEASED — friction-repair change (RULING-013/014/015); rendered on forgeflow only, propagation to the other six registered repos is the next session's first_thing
    changed: >-
      Fifteen findings from the first two days of running v1.1.0 (saas-starter and
      convergible sessions, 2026-09-05 — FF-FRICTION-1..4, FF-101..103, FF-R-001..006) plus this
      repo's own filed items, de-duplicated into ten repairs. WRAP DELIVERY (six findings, one
      root cause): the GitHub connector has no patch, no append and no delete inside a
      multi-file commit, and its multi-file write takes no SHA guard, so E-002's "ONE docs
      commit" was never achievable and the last two large wraps improvised a split. E-002 now
      defines the wrap as a NUMBERED SERIES of single-file SHA-guarded commits ("docs: end
      session DATE (k/N) — file"), handoff written FIRST with wrap_complete: false and LAST with
      wrap_complete: true and the evidence line (E-030); every write is stated to be a whole-file
      write with a mechanical before/after diff and entry/byte counts in the report (FF-R-004);
      S-010 ignores the wrap's own commits when judging staleness (FF-FRICTION-3) and treats
      wrap_complete: false as "finish the previous wrap first" (FF-FRICTION-1, E-014 unfinished-
      wrap rule and schema fields). INBOX (RULING-014): consumed files are DELETED, not moved to
      .forge/archive/inbox/ (E-003, E-015, E-024, E-028, E-029, S-048, house block) —
      FF-FRICTION-4. S-078 Desktop copy RETIRED (RULING-015, FF-101): it contradicted the NO
      MEMORY WRITES clause; the execution.local_report_desktop_copy knob is removed from the
      schema (config_hash changes for every repo). DEAD POINTER (FF-R-005): S-003 now renders
      only when subsystems.artifact_register is true; S-011, S-024, E-002 and E-003 phrase the
      register conditionally and say a repo without one must not be given one. HABIT
      COLLISIONS (FF-103a/b/c): the inbox path is authorized by the protocol in every run
      (S-030 preamble, S-048); the path-scoped "git add -A -- <named path>" is permitted for a
      many-file move after the scope audit while the bare forms stay forbidden (S-043, S-073,
      E-021, house block); NEW block W-005 prompt_writer_self_check (plain-text banners, inbox
      path, add form, no writes outside the tree, ChromaQA rebase lines, PRECEDENCE present).
      CHROMAQA REBASE (FF-R-006): S-087 and E-047 carry the fixed stash-rebase-restore sequence
      and name committing or discarding the ledger as wrong. EVIDENCE CHECK (FF-R-003): E-008
      names the exact clone command — forgeflow is PUBLIC, the report's "private" premise was
      wrong — and requires "(hand-counted — renderer unreachable)" on any hand count. HOUSE
      BLOCK: spawn-window line (FF-102 — a config naming a different repo means not yet
      rendered; do not hand-fix). PROPAGATION (RULING-013): PROPAGATION_PROCEDURE.md rewritten
      around ONE local Claude Code run that renders every registered repo and pushes with
      plain git against Claude Web's sandbox-proven blob SHAs; Blueprint delivery_rule amended
      (v1.6). The pointer-URL alternative (repos hold a link to one master file) was considered
      and declined — network fetch on every session start, silent truncation on runners,
      repeals the standalone rule. Block counts: start 96 (S-078 out, W-005 in), end 51. Tests 54/54 (seven new: real-master
      invariants and a real docs-only render). Ceilings on the real sandbox knob set: start
      1595/1650, dispatch start 588/650, end 1280/1400, dispatch end 95/150 — the start file is
      55 lines from its ceiling; the next start-protocol addition replaces something (P11).
  - version: "v1.1.0"
    date: 2026-09-05
    status: RELEASED — defect-repair change (RULING-009/010/011); every v1.0.0 repo re-renders from this version on Matt's go
    changed: >-
      FFD-001 DISPATCH: v1.0.0 shipped all seven rendered repos dispatch-OFF and silent about it —
      dispatch defaulted false in every profile and .github/workflows/claude.yml existed only in
      convergible-sandbox. Now dispatch defaults ON in standard and docs-only (Matt's switch);
      the harness is a shipped asset (master/assets/claude.yml, generic — Convergible's PG env,
      psql and bunx entries stripped); NEW knob execution.dispatch.harness_installed (detected
      from the tree); NEW renderer-set execution.dispatch.off_reason (harness-not-installed |
      declared-off); the renderer no longer fails on a missing harness — it turns dispatch off
      and SHOUTS (header banner, knobs line dispatch=OFF(reason), NEW block S-092
      dispatch_unavailable_notice, house-block line) so a rendered protocol can never be silent
      about a missing capability. allowed_tools is now READ from the workflow's --allowed-tools
      at render (the v1.0.0 schema promised this and render.py never did it); a declared list
      that differs from the workflow is a hard fail. RULING-011: branch protection is a guard
      against runners with administrators bypassing, not the dispatch switch — dropped from
      dispatch.requires as a precondition, S-072 rewritten, E-002 gains the PR fallback line.
      FFD-002 ROLE BOUNDARY (RULING-010): S-006/S-007 rewritten around RISK (not compiled /
      not a manifest or lockfile / not a workflow / no secrets / not a rendered protocol / one
      spot) — README, LICENSE, docs, .forge/, comments and copy in non-built files are direct
      edits; any compiled file (incl. copy inside a .tsx), manifests, migrations, workflows stay
      prompt-only. E-002's boundary line aligned. FFD-003 START GATE: NEW S-091
      session_start_gate (mandatory, unskippable; capability line reserved as summary line 2;
      re-entry rule; Matt's tell), S-012 reserves three lines, S-075 says what it cannot prove.
      FFD-004: NEW W-004 working_method_offer_rule — never offer a way of working the repo
      cannot do; verify from the header, never memory. FF-001: house-block ChromaQA line no
      longer assumes an installer section exists. FF-003: NEW knobs build.python_interpreter
      (default "python") and build.secondary_validation; S-082 names the interpreter from
      config; S-083 says "no per-task validation step is configured" instead of "no
      interpreter". FF-004: S-014/E-036/E-040 handle a gitignored .chromaqa/ (v6.1) — "not on
      GitHub", never "zero". Tests 47/47 (ten new: shout, S-092, declared-off note, tree
      detection, allowlist read, two hard fails). Ceilings measured on the real sandbox knob
      set: start 1532/1650, dispatch start 574/650, end 1219/1400, dispatch end 95/150.
      Blueprint amended to v1.5. Rollout: master first (this), then per repo — secret,
      claude.yml (Matt, web editor), protection with admin bypass, re-render; saas-starter last.
  - version: "v1.0.0"
    date: 2026-09-04
    status: RELEASED — first repo rendered from this master (chromasmith/seogeo, RULING-002)
    changed: >-
      RENDERER FIX found during the first real render: render.py read the condition literal
      "none" as YAML null, so "build.validation == none" (S-083), "build.deploy == none" (S-085)
      never rendered and "build.deploy != none" (E-023) rendered a deploy step reading "deploys
      via none" for every no-deploy repo. "none" is a legal enum VALUE and now compares as the
      string; only "null"/"None" mean null. Fixture block + two tests added (37/37, seen red
      before the fix). Repos on the standard profile render byte-identical protocol text;
      legacy-local and docs-only shapes gain S-085 (and S-083 for docs-only) and lose the wrong
      E-023. No master protocol text changed. The master leaves BUILD IN PROGRESS: chromasmith/seogeo is the
      first repo rendered from it (docs-only profile; subsystems all off by detection; nothing
      else installed). The housekeeping bundle deferred by RULING-001 lands with this version:
      PROPAGATION_PROCEDURE.md, registered-repos.yaml (written last, seogeo's row first), the
      "superseded by master/" banners on the legacy Forge Flow 10 docs, and the README repointed
      at master/. Every render from here carries "v1.0.0" in its header; the protocol text a
      repo receives is identical to what v0.3.0-build would have produced for the same config.
  - version: "v0.3.0-build"
    date: 2026-09-04
    status: BUILD IN PROGRESS — no repo is rendered from this master yet
    changed: >-
      SEO/GEO 1.0 master change (second tool-driven change; nothing to re-render). New knob
      subsystems.seogeo, detected by .seogeo/config.json (the tool's own "installed" test).
      Start: NEW S-089 seogeo_standard_pointer — the exact conditional pointer text from
      chromasmith/seogeo .forge/protocol-pointer.md, emitted verbatim in code prompts that touch
      a page, route or layout, plus the declare-routes-same-session and never-widen-a-surface
      rules for the prompt writer; NEW S-090 (seogeo AND chromaqa) — .chromaqa/profiles.json is
      GENERATED from .seogeo/config.json by "seogeo chromaqa-profile" (posture-stamped file when a
      posture is declared), narrowing the PROTECTED CONFIG rule to one sanctioned change (edit
      config, re-run, commit both), drift = stamp mismatch fixed by the command, and the plain
      statement that no ChromaQA gate reads the posture stamp yet. End: NEW E-048 local-remainder
      exception to E-040's STOP on a modified profile (three tests: config modified, _generated.by,
      stamp equals sha256 of config); NEW E-049 .seogeo/.report/ is a LOCAL BUILD ARTIFACT
      (never staged, not an audit surprise); NEW E-050 wrap manifest lines and E-051 file
      behaviors for .seogeo/. House block gains two fenced bullets (the pointer's exact
      CLAUDE.md text; the generated-profile rule). No wrap SEO check, per the tool's own rule
      (verification is ChromaQA's). Existing blocks untouched; every new block is fenced, so
      repos without .seogeo/config.json render byte-identically to v0.2.0-build. Source:
      chromasmith/seogeo README, INSTALL.md, .forge/BLUEPRINT.yaml v3.0 (sections 6, 7, 8a),
      .forge/protocol-pointer.md, .forge/handoff.yaml, template/.seogeo/bin/seogeo.mjs,
      template/.seogeo/lib/report.mjs, template/.seogeo/STANDARD.md.
  - version: "v0.2.0-build"
    date: 2026-09-04
    status: BUILD IN PROGRESS — no repo is rendered from this master yet
    changed: >-
      ChromaQA 7.0 master change (first tool-driven change; nothing to re-render). Start:
      S-014 rewritten (debt read from GitHub; profiles.json PROTECTED CONFIG; runs.jsonl
      LOCAL ONLY, gitignored since ChromaQA 6.2; BROKEN GATE lines named separately);
      S-045 gains the captain-review never-fix line; S-071 made repo-neutral (continue-on-error
      aggregator vs hard-fail job); NEW S-087 pre-push gate rule for local code prompts
      (exit 0/1/2, never --no-verify, never touch profiles.json, post-push telemetry is the
      gate working); NEW S-088 reading ChromaQA's quality-gate CI job (hard-fail, merge
      needs it green, runners have no pre-push hook). End: E-036/E-037/E-042 carry the
      three-way file handling (protected config / pass-through / local only); E-040 drops
      runs.jsonl and STOPs on a modified profiles.json; NEW E-047 local-remainder push-gate
      block (exit-code rule; debt and showstoppers ALWAYS PERMITTED modified after a push,
      committed as "chore: chromaqa telemetry"). House block gains one fenced ChromaQA
      bullet. render.py detects ChromaQA by chromaqa-check.sh at the root, not only by a
      .chromaqa/ directory. Source: chromasmith/chromaqa README, .forge/BLUEPRINT.yaml
      (claude_md_section, output_contract.operational_rule_for_agents_and_scope_audits,
      output.files tracking), reference/ install prompt.
  - version: "v0.1.0-build"
    date: 2026-09-04
    status: BUILD IN PROGRESS — no repo is rendered from this master yet
    changed: >-
      Step 3 begins. Renderer machinery landed: render.py, protocol-config.schema.yaml
      (Section 5 fields plus the eight new knobs from LINEAGE_RECONCILIATION), the three
      profiles, and a fixture test proving byte-stable renders and the block-manifest check.
      The master protocol files are not yet written.
