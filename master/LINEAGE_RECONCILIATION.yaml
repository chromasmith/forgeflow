# =============================================================================
# FORGEFLOW MASTER — LINEAGE RECONCILIATION (rollout step 2, Board M2 / v1.2 N4)
# Every behavioral rule found in the four legacy protocol lineages, each with
# EXACTLY ONE disposition: folded (names the master block), knobbed (names the
# config field), or dropped (one-sentence reason). A rule with no disposition
# blocks the first render.
# Home: github.com/chromasmith/forgeflow  master/LINEAGE_RECONCILIATION.yaml
# =============================================================================

meta:
  name: LINEAGE_RECONCILIATION
  version: "1.0"
  date: 2026-09-04
  author: Claude Web (step-2 session with Matt Fleming)
  status: >-
    GATE-PASSED 2026-09-04 (Matt's go in chat on the 16-item dropped list).
    Step 3 (build the master) is authorized and began 2026-09-04.
  blueprint_ref: master/BLUEPRINT.yaml v1.2 @ 009370b (Section 4 artifact, Section 11 step 2)
  lineages_read:
    STD: >-
      STANDARD (single-app + monorepo, unified), FOCUSED_BUILD_PROTOCOL +
      END SESSION, dated 2026-08-08. Source: Matt's thought-box, pasted into
      this session.
    SYN: >-
      SYNCLIPS-SYSTEM (chromasync + synclips-platform + dv-captain),
      FOCUSED_BUILD_PROTOCOL + END SESSION, dated 2026-07-04. Source:
      thought-box, pasted.
    CC2: >-
      CHROMACONTROL v2, FOCUSED_BUILD_PROTOCOL (2026-06-25) + END SESSION
      (2026-06-20). Source: thought-box, pasted.
    SBX: >-
      CONVERGIBLE-SANDBOX, four files read from GitHub at HEAD of main this
      session: .forge/protocols/start-protocol-local.yaml (blob e57b902),
      end-protocol-local.yaml (e8652d9), start-protocol-dispatch.yaml (d6d85c2),
      end-protocol-dispatch.yaml (02be688). Suffix -L = local files, -D =
      dispatch files. Also read: database-access.yaml (897faa3).
  not_read_this_session: >-
    .forge/protocols/artifact-register.yaml (40 KB). Its five binding rules
    R1-R5 are quoted identically in all four SBX protocol files and were taken
    from there. The register's per-repo entries are repo content, not protocol
    rules, and the blueprint already keeps the register repo-specific (Section
    4, artifact-register.yaml is created from a house template and never
    overwritten by a render). Step 3 should read it once when writing the house
    template.
  method: >-
    Each lineage was read end to end. Every sentence that tells a participant
    (Claude Web, Claude Code, or Matt) to do or not do something was extracted
    as a rule. Rules that appear in several lineages are one entry with all
    sources listed. Narrative, history, examples and headers are not rules and
    appear only where their removal is worth Matt's attention (the dropped list).
    Board additions from v1.1/v1.2 are NOT lineage rules; they are listed in
    board_additions_not_from_lineage so step 3 knows the inventory below is not
    the whole master.
  block_id_scheme: >-
    Provisional master block IDs assigned here so folded rules have a target.
    S-nnn = start-protocol master block. E-nnn = end-protocol master block.
    W-nnn = Claude Web behaviour block (rendered into the start file, excluded
    from the dispatch reader file). C-nnn = CLAUDE.md house block. Step 3 may
    renumber to the blueprint's B-nnn scheme but must carry this mapping into
    the master files as a comment so every LR-nnn below still resolves. Each
    block carries a reader hint (cw / cc-local / cc-dispatch / all) for the
    per-reader ordering in P7.
  counts:
    rules_inventoried: 183
    folded: 117
    knobbed: 50
    dropped: 16
    new_knobs_proposed: 8
    verify_flags: 1
    counts_computed_by: python yaml parse in the step-2 session sandbox, not estimated

