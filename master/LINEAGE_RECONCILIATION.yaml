new_knobs_proposed:
  - field: architecture.tsx_lib_rule
    type: boolean
    detected_by: any .tsx file under src/ or app/
    default: false
    renders: S-022, S-029, the ARCHITECTURE RULE preamble line, reflection Q4, the DATA ACCESS NAMED UPFRONT framing line
    why: The /lib rule is meaningless in a Python repo; rendering it there is noise that trains skimming.
  - field: subsystems.repo_rules_doc
    type: string (path)
    declared: true
    default: null
    example: ".forge/protocols/repo-rules.yaml"
    renders: S-005 (one binding paragraph, same shape as the database-access binding)
    why: >-
      Home for repo-specific operating rules that are neither master content nor
      config values — Convergible's DOC-FOLD-1 items (LR-163) and ChromaControl's
      Android mechanics (LR-164). Created for convergible-sandbox at step 4 by
      moving those items out of the rendered protocol; without it the sandbox
      render would silently lose rules it has today.
  - field: hardware.devices
    type: list of { name, on_for }
    declared: true
    default: []
    example: [{ name: "Nikon ZR", on_for: "camera tests" }, { name: "LIT Duo", on_for: "meter tests" }]
    renders: the hardware-off-by-default paragraph and device names inside the S-049 gate banners
  - field: repo.canonical_machine
    type: string
    declared: true
    default: "Surface 12"
    renders: one sentence in S-032
  - field: repo.alternate_machines
    type: list
    declared: true
    default: []
    example: ["Anvil — Anvil-only artifacts, worker profile, live browser worker"]
    renders: one sentence in S-032 when non-empty
  - field: repo.line_endings
    type: enum [lf, crlf, mixed]
    default: lf
    renders: the LF check in E-021 and CW's own pre-push check
  - field: execution.dispatch.allowed_tools
    type: list
    declared: true (copied from .github/workflows/claude.yml at render time; renderer warns on mismatch)
    default: []
    renders: the allowlist sentence in S-064 and the RUNNER ENVIRONMENT section of S-073
  - field: execution.local_report_desktop_copy
    type: boolean
    default: true
    renders: the "place a copy on Matt's Desktop" line in S-048, local reader only

