# =============================================================================
# DISPOSITIONS — one entry per rule
#   found_in codes: STD, SYN, CC2, SBX-L, SBX-D
#   disposition: folded | knobbed | dropped
# =============================================================================

rules:

  # --------------------------------------------------------------- headers, roles
  - id: LR-001
    rule: >-
      A protocol file is COMPLETE and STANDALONE; it inherits nothing by
      reference and is never abridged; shrinking it is a Matt decision made in
      a session about the protocol.
    found_in: [SBX-L, SBX-D]
    disposition: folded
    target: S-001
    note: Also P2. The 2026-08-20 abridgement narrative is dropped (LR-160).
  - id: LR-002
    rule: >-
      The file states which variant it is, its companion wrap, and its parallel
      variant, and names the artifact register and database-access doc as binding.
    found_in: [SBX-L, SBX-D]
    disposition: folded
    target: S-001
    note: Becomes the renderer header stamp plus block manifest.
  - id: LR-003
    rule: >-
      Claude Web is the planner and prompt author, not the builder; it never
      edits application code, not even in its sandbox to test a fix; its
      deliverable is a prompt; the tell is reaching for a file-write on an
      application path, and diligence makes the slip more likely.
    found_in: [STD, SYN, CC2, SBX-L, SBX-D]
    disposition: folded
    target: S-006
    note: Kept with the correction that the boundary is APPLICATION code, not all files (LR-005).
  - id: LR-004
    rule: >-
      Claude Web has NO CLI access and NO MCP access; it cannot push, commit or
      deploy; the only delivery path is a Claude Code prompt Matt runs.
    found_in: [STD, SYN, CC2]
    disposition: dropped
    reason: >-
      False since the GitHub/Supabase/Vercel MCP tools arrived; retired model
      (blueprint hard constraint + I7).
  - id: LR-005
    rule: >-
      With a live GitHub connector, CW may commit the .forge/ documentation
      layer and protocol files directly (via PR) when Matt directs it; application
      code, migrations, config and workflows remain prompt-only.
    found_in: [SBX-L, SBX-D]
    disposition: folded
    target: S-007
    note: >-
      Widened by the 2026-09-04 wrap direct-write ruling and the 2026-09-02
      direct-edit ruling: CW writes the wrap docs itself and may make small
      one-spot .forge edits directly. Protocol files are edited in the master
      only (P5).
  - id: LR-006
    rule: >-
      While a Claude Code session runs against the repo, CW does not push
      multi-file changes; single-file commits on current HEAD are safe.
    found_in: [SBX-L, SBX-D]
    disposition: folded
    target: S-008
  - id: LR-007
    rule: >-
      While a CC session runs, CW exports deliverables for Matt to carry into a
      sequenced session instead of writing to GitHub.
    found_in: [SBX-L]
    disposition: dropped
    reason: >-
      Superseded by the blueprint's concurrency mitigation: CW asks whether a CC
      session is active on the repo before any push, and uses PR delivery when
      one is running; exporting for hand-carry is the friction Matt has engineered out.
  - id: LR-008
    rule: >-
      Across concurrent Claude Web lanes, artifact-register.yaml is the one file
      every lane appends to; merge the first PR promptly and rebase the second;
      governance files are wrap-only and one lane wraps at a time.
    found_in: [SBX-D]
    disposition: folded
    target: S-008
  - id: LR-009
    rule: >-
      Participants are Claude Web (planner), Matt (plain-English direction,
      routes friction, arbiter), Claude Code (executes with minimal context,
      reports friction).
    found_in: [STD, SYN, CC2, SBX-L, SBX-D]
    disposition: folded
    target: S-006
  - id: LR-010
    rule: >-
      The Synclips-system variant is used ONLY for chromasync, synclips-platform
      and dv-captain; the standard variant must not be used for ChromaControl or
      any repo where GitHub is not a complete mirror.
    found_in: [STD, SYN, CC2, SBX-L, SBX-D]
    disposition: knobbed
    target: mirror.github_is_complete_mirror + companion_repos + profile
    note: Variant selection becomes config; the "do not use this for X" headers are not rendered.

  # ------------------------------------------------------------ session start
  - id: LR-011
    rule: >-
      Matt uploads the repo as a ZIP (two ZIPs for Synclips — repo plus relay);
      Claude Web extracts and indexes locally; the ZIP snapshot may be stale.
    found_in: [STD, SYN, CC2]
    disposition: dropped
    reason: >-
      Replaced by reading the repo (and the relay repo) directly from GitHub;
      the durable half — "any snapshot may be stale, verify before acting" — is
      folded separately (LR-062).
  - id: LR-012
    rule: >-
      Matt names the repo; CW reads it from GitHub (connector preferred, never
      stale); no protocol paste.
    found_in: [SBX-L, SBX-D]
    disposition: folded
    target: S-009
  - id: LR-013
    rule: >-
      CW auto-detects repo shape (single-app root build vs monorepo sub-path
      build) from the tree; Matt is never asked; if multiple apps, the target
      app is settled during planning; the detected shape and build location lead
      the readiness summary.
    found_in: [STD, SYN, SBX-L]
    disposition: knobbed
    target: shape.kind + shape.build_location (detected, overridable)
    note: Detection moves to render time (P3); the summary line renders from config. Block S-013 carries the residual instruction.
  - id: LR-014
    rule: >-
      Read .forge/ files in order — handoff.yaml FIRST (primary briefing), then
      session-state, backlog, active-bugs, session-history (live 15, deeper at
      archive), GOTCHAS; skip missing files silently.
    found_in: [STD, SYN, CC2, SBX-L, SBX-D]
    disposition: folded
    target: S-011
  - id: LR-015
    rule: >-
      Read .forge/rulings.yaml SECOND, right after handoff; before putting any
      product or design question to Matt, search rulings, then the source it
      points to, then strategy docs and backlog descriptions; if a ruling exists,
      bring the build, not the question; a chat ruling is appended in the same
      session or it does not exist.
    found_in: [SBX-L, SBX-D]
    disposition: folded
    target: S-011 + S-018 + W-002
  - id: LR-016
    rule: >-
      Read .forge/protocols/artifact-register.yaml before writing any prompt; it
      is binding.
    found_in: [SBX-L, SBX-D]
    disposition: folded
    target: S-011 + S-003
  - id: LR-017
    rule: >-
      Read the context primer (.forge/blueprint/context-primer.yaml) FIRST as the
      narrative/phase authority; read the founding brief when the task touches
      camera protocol, transport or property discovery.
    found_in: [CC2]
    disposition: knobbed
    target: protected.phase_authority_doc (renders S-016) + north_star_doc
    note: >-
      The primer is ChromaControl's phase authority AND its north-star doc; the
      founding brief is a task-conditional read the repo-rules doc can name.
  - id: LR-018
    rule: >-
      Treat the handoff's agenda (first_thing / next_up, formerly
      next_session_tasks) as the default unless Matt says otherwise.
    found_in: [STD, SYN, CC2, SBX-L, SBX-D]
    disposition: folded
    target: S-011
    note: The stale field name next_session_tasks is dropped (LR-165).
  - id: LR-019
    rule: >-
      Give a Session Context Summary of 6-8 lines max: repo shape and build
      location, last session, in progress, active bugs, backlog, gotchas to keep
      in mind, blockers/rulings owed by Matt, phase (CC2), cross-repo state (SYN).
    found_in: [STD, SYN, CC2, SBX-L, SBX-D]
    disposition: folded
    target: S-012
    note: Board amended to a HARD 8-line ceiling with two reserved lines (first_thing, project position); silence is the pass state.
  - id: LR-020
    rule: >-
      ChromaQA debt check: count lines in .chromaqa/CQA-debt.jsonl; if over 25,
      alert Matt and wait for his decision before "Ready for tasks"; say nothing
      if under.
    found_in: [STD, SYN]
    disposition: knobbed
    target: subsystems.chromaqa (detected) + thresholds.chromaqa_debt_alert (25)
    note: Renders S-014 only when .chromaqa/ exists. CC2's "no debt check here" is the same knob false.
  - id: LR-021
    rule: >-
      ChromaQA is never installed by a protocol or folded into another task; an
      install is a separate ceremonious session Matt initiates by name.
    found_in: [SBX-L, SBX-D]
    disposition: folded
    target: S-011 (one sentence) + W-001
    note: Hard constraint in the blueprint; stated once in the master so every render carries it.
  - id: LR-022
    rule: >-
      Relay read at start (Synclips only): read synclips-relay state.yaml,
      ripples.yaml, questions.yaml in full, index contracts.yaml; compute N
      pending inbound ripples and M relevant open questions; surface one line
      "Cross-repo state: N inbound ripples pending, M relevant open questions";
      say zero plainly; factor operational caveats into planning; contracts are
      binding when a task touches a seam and a contract change is a deliberate
      act; PROTOCOL.md wins on conflict; honesty norms apply.
    found_in: [SYN]
    disposition: knobbed
    target: companion_repos (renders S-015)
    note: CW reads the relay from GitHub, not a second ZIP (LR-011).
  - id: LR-023
    rule: >-
      If the relay was not provided, ask Matt once; if he says proceed without
      it, state that cross-repo state is UNKNOWN and flag seam-touching tasks as
      higher risk; never pretend it was read.
    found_in: [SYN]
    disposition: folded
    target: S-015
    note: >-
      Reworded for GitHub reads — if the relay repo cannot be read, say so.
  - id: LR-024
    rule: >-
      Ready state: after the reads, confirm with a brief summary and say
      "Ready for tasks."
    found_in: [STD, SYN, CC2, SBX-L, SBX-D]
    disposition: folded
    target: S-051

  # ------------------------------------------------------------------ planning
  - id: LR-025
    rule: >-
      Conduct a brief planning conversation before generating a prompt when the
      task is a new feature, schema change, new route/integration, touches more
      than 2 files, creates more than 2 new files (split first), any hardware/
