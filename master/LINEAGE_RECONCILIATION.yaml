# =============================================================================
# SIZE MEASUREMENT (sets the S4 ceiling — still open in the blueprint)
# =============================================================================

size_measurement:
  method: >-
    Rule count is exact (this file). Line counts are ESTIMATES from the byte
    sizes GitHub reports for the sandbox files, at roughly 55-60 bytes per line
    of wrapped YAML prose; step 3 replaces them with wc -l on the real files in
    the sandbox before the ceiling is written into the blueprint.
  folded_set:
    rules_folded_or_knobbed: 167
    master_blocks: 101   # 67 start (S-001..051, S-060..075) + 3 CW (W) + 30 end (E) + 1 CLAUDE.md (C)
  current_sandbox_files_estimated_lines:
    start-protocol-local.yaml:    "~1,000  (58,097 bytes)"
    end-protocol-local.yaml:      "~1,050  (61,481 bytes)"
    start-protocol-dispatch.yaml: "~800    (47,091 bytes)"
    end-protocol-dispatch.yaml:   "~700    (40,439 bytes)"
  projected_render_sizes:
    standard_saas_no_dispatch:
      start: "~850 lines (local start minus dispatch-only blocks, plus I4/M-series additions)"
      wrap:  "~950 lines (schema queries and templates dominate; the CDT prompt body shrinks under direct-write)"
    convergible_sandbox_with_dispatch:
      start_cw_file:       "~1,100"
      start_dispatch_file: "~650 (runner-irrelevant blocks excluded, fixed ordering)"
      wrap_cw_file:        "~1,000"
      wrap_dispatch_file:  "~500"
    chromacontrol_legacy_local:
      start: "~900 (multi-surface, spike, hardware gates; dispatch blocks excluded)"
      wrap:  "~800 (no schema, no deploy, no telemetry)"
  finding: >-
    The board's 400-line guess is not achievable without dropping content Matt
    has kept in every lineage. The biggest single consumers are the schema-refresh
    queries (~120 lines), the initialization templates (~90), and the
    preamble/completion boilerplate that must be verbatim in the rendered prompt.
  recommendation_for_S4_ceiling: >-
    Set the ceiling per READER file, not per repo: CW-read files 1,200 lines,
    runner-read (dispatch) files 800 lines. Both leave roughly 15 percent
    headroom over the largest projected render. Replace-to-add (P11) applies
    above the ceiling. Finalize the numbers at step 3 from wc -l of the real
    renders; do not write them into the blueprint from these estimates.

