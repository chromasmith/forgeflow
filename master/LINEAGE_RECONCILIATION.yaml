      consolidation, whichever first; the wrap never performs it — it says so in
      the handoff and the consolidation runs as its own session with Matt-set
      criteria; a wrap may archive entries it can justify individually; a bulk
      prune to a target number is its own session; declining to prune is
      correct behavior.
    found_in: [SBX-L, SBX-D]
    disposition: knobbed
    target: thresholds.gotcha_consolidation (100 / 1 month / own session) — renders E-015
    note: The legacy review-at-50 rule is dropped (LR-158).
  - id: LR-151
    rule: >-
      Archive fidelity: the runner counts entries before and after in BOTH
      files, never stops between the append and the removal, and CW diffs the
      sorted line multiset of source plus destination against the originals
      before merging; the count proves nothing was dropped, only the diff proves
      nothing was changed.
    found_in: [SBX-D]
    disposition: folded
    target: E-015
    note: Under direct-write CW performs the move itself; the same count+diff check runs on CW's own commit.
  - id: LR-152
