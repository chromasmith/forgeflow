# =============================================================================
# FORGEFLOW MASTER — UNIFIED SESSION-PROTOCOL SYSTEM
# Blueprint v1.4 — 2026-09-04 (two board passes; DESIGN CLOSED; step 3 built; rollout order amended by ruling; S4 ceilings set from measured renders)
# Author: Claude Web (planning session with Matt Fleming, Chromasmith LLC)
# Status: DESIGN CLOSED after two committee passes. Step 3 built (renderer, both masters, C-001 house block); no repo runs on the master (RULING-001).
# Home: github.com/chromasmith/forgeflow  master/BLUEPRINT.yaml
# =============================================================================
#
# HOW TO READ THIS DOCUMENT (for reviewers who cannot see the repos):
#   Section 1 lists facts and decisions that are ALREADY RATIFIED. Please do not
#   relitigate them — critique the design that sits on top of them. Sections 2-12
#   are the design. Section 13 lists the questions we actually want your opinion on.
#   Section 14 is a glossary of house terms.
# =============================================================================

meta:
  name: ForgeFlow Master
  version: "1.4-blueprint"
  date: 2026-09-04
  revision_history:
    - version: "1.0"
      note: Initial design from the planning session.
    - version: "1.1"
      note: >
        Folds in the board review (Phases 0-8). Accepted: M1 observation inbox (mapped
        onto the existing CC-reports/ convention), M2 lineage reconciliation gate, M3
        handoff staleness stamp, M4 evidence rule, M5 deterministic renderer
        (render.py — CW's sandbox DOES have code execution alongside the GitHub MCP),
        M6 rulings written when made, S1 pushed drift (replaces the per-session
        poll), S2 profile-based config, S3 precedence rule, S4 prune cadence
        (ceiling number deferred to after M2), S5 one rendered file per reader
        (replaces P7), S6 dispatch-reading canary, atomic propagation, compliance
        canary, 8-line summary ceiling, north-star pointer + wrap question.
        Rejected: deleting the config schema (board rejected it too); reverting wrap
        direct-write (M1 + M4 recover the witness).
    - version: "1.2"
      note: >
        Second board pass. All findings were one class — an artifact added in v1.1
        without the thing that notices when it is missing. Accepted: N1 inbox
        reconciled against runs; N2 needs_ruling surfaced on every board advance;
        N3 computed evidence count; N4 lineage reconciliation moved BEFORE the
        master build; N5 registered-repos.yaml written last as the single version
        authority; reserved summary lines; per-reader block ORDER. Deferred:
        drift_ci workflow until the render is proven. Declined: the board drafting
        master text (that is the build session's work). Active-repo count answered
        (3-4). Design declared CLOSED; a third pass would be gilding.
    - version: "1.3"
      note: >
        Matt's ruling 2026-09-04 (RULING-001 in forgeflow .forge/rulings.yaml): the
        rollout has no fixed repo order. Section 11 steps 4-9 collapse into "render
        one repo at a time, the repo and the moment chosen by Matt, each its own
        session and its own go." One ordering constraint survives: the Convergible
        FINAL repo is cloned from the rendered saas-starter, so it is never rendered
        before saas-starter. The stop point for THIS effort is the end of step 3 —
        both masters written and a byte-stable render proven inside forgeflow; no
        repo is rendered until Matt names it. Step 3a (renderer, schema, profiles,
        fixture proof) landed @ 5c66201.
    - version: "1.4"
      note: >
        Step-3 cleanup session 2026-09-04. S4 rendered-file ceilings SET from the
        measured renders of the real convergible-sandbox knob set at ecf77e5 (Section
        6, rendering.file_ceilings; P11 and Section 13 repointed). Section 8 wrap
        order amended to match the end master's E-021: the LOCAL remainder prompt
        runs BEFORE the docs write when the checkout may hold unpushed work. The
        CLAUDE.md house block master (C-001) landed @ 96b4290 with its own Markdown
        fence syntax (Section 6, conditional_blocks).
  problem_in_one_sentence: >
    Matt runs the same start/wrap session protocol across many repos, but each repo
    holds a hand-forked copy, so fixes made in one never reach the others and the
    copies have drifted apart (different reflection questions, different split
    thresholds, different backlog schemas, stale role descriptions).
  solution_in_one_sentence: >
    Unify the SOURCE, not the runtime prompt: one master template plus a small
    per-repo config, rendered into a complete standalone copy inside each repo, with
    a version stamp so stale copies announce themselves; a fix lands once in the
    master and is re-rendered to every registered repo.

# =============================================================================
# 1. HARD CONSTRAINTS — ALREADY RATIFIED. DO NOT RELITIGATE.
# =============================================================================

hard_constraints:
  environment_facts:
    - >
      Matt is a non-developer "vibe coder"; he directs all work in plain English and
      does not read code, YAML, or terminal output for judgment. Claude Web (CW) is the
      planner/technical reviewer; Claude Code (CC) is the builder.
    - >
      CW now has GitHub, Supabase, Vercel and other MCP/CLI tools. It reads repos
      directly from GitHub. The older "Matt uploads a ZIP + pastes the protocol" model
      is retired everywhere. (The three legacy variant files still describe that model;
      those descriptions are stale, not authoritative.)
    - >
      CC runs in two execution modes, both first-class: LOCAL (a CC session on Matt's
      Surface machine at the canonical checkout C:\Chromasmith\<repo-name>) and
      DISPATCH (CW files a GitHub issue beginning "@claude"; Claude Code Action runs it
      on a hosted runner with a fresh shallow clone; CC pushes a branch; CW opens the
      PR). Up to 3-4 dispatched jobs may run in parallel when a triage gate proves
      their authorized file lists are disjoint and no dependency exists.
    - >
      Dispatch runners CANNOT build (no npm run build), CANNOT write the database,
      CANNOT edit .github/workflows, and hard-refuse any bash command containing $
      expansion. Vercel branch deploy + ChromaQA CI are the build verification.
    - >
      GitHub is the SINGLE SOURCE OF TRUTH for every repo. Local checkouts are
      disposable. Nothing counts as "filed" unless it is committed and pushed.
    - >
      Every rendered protocol file must be COMPLETE and STANDALONE. Inheritance by
      reference ("see the other file for schemas") is FORBIDDEN in the protocol layer —
      ratified 2026-08-29 after content that lived only in a referenced file silently
      dropped out of generated prompts and produced a rogue duplicate archive file.
    - >
      A repo's protocol copy lives at .forge/protocols/ inside that repo (ratified
      2026-08-29), because a dispatched runner can read nothing else.
  workflow_rules_that_survive_unchanged:
    - >
      SCOPE LOCK: every CC prompt names an AUTHORIZED FILES list (ceiling, not floor)
      and an OFF-LIMITS list; CC must STOP/HALT-AND-REPORT rather than silently edit an
      unauthorized file.
    - >
      Named-file commits only; git add -A / git add . are forbidden.
    - >
      Local wraps end with VERIFY PUSH (clean tree, not ahead of origin, local HEAD ==
      origin/main). Dispatch wraps end with "the docs PR is merged."
    - >
      Architecture rule: data access and business logic never live in .tsx; screens
      call a /lib function. Authorizing a data-touching screen requires authorizing
      its /lib counterpart (paired-file rule).
    - >
      Pre-refresh SAFETY CHECK before any refresh of a local checkout; the check can
      stop the session.
    - >
      CC reflection questions at the end of every task, including SCOPE DISCLOSURE.
    - >
      Approval code 3949 appears in every CC prompt preamble.
    - >
      CLAUDE.md is read by CC automatically every session and remains the repo's
      standing-orders file.
    - >
      The .forge/ file family (handoff, session-state, backlog, active-bugs,
      session-history, GOTCHAS, rulings, CHANGELOG, archive/) is the state-carrying
      layer between sessions. handoff.yaml is the PRIMARY briefing, read first.
    - >
      Linear (one task at a time) is a first-class default, never a fallback.
      Parallelism is a throughput tool, not a virtue.
    - >
      One-item agenda: handoff.first_thing names EXACTLY ONE next item.
    - >
      Human gates for live supervised runs: CC prints a loud plain-text banner, states
      the one thing Matt must do, and WAITS for a typed confirmation word. No timers.
      Plain text only — Matt's terminal does not render ANSI color codes.
    - >
      ChromaQA is never installed by a protocol or folded into another task; a ChromaQA
      install is a separate ceremonious session Matt initiates by name.
  decisions_ratified_in_this_planning_session_2026_09_04:
    - >
      RULING REVERSAL: edits are made in the MASTER first and rendered DOWN to repos.
      The 2026-08-29 "edit in the repo, port up to the base" rule is superseded.
    - >
      The master lives in github.com/chromasmith/forgeflow, in a new top-level
      master/ directory. Legacy docs in that repo get a one-line "superseded by
      master/" banner; they are not rewritten in this effort.
    - >
      Repo protocol copies are NEVER hand-edited. A bug found in a copy is fixed in
      the master and re-rendered.
    - >
      WRAP DIRECT-WRITE: CW writes the wrap's .forge/ documentation files itself via
      the GitHub MCP (one commit or PR, diff-verified). CC's wrap role shrinks to
      pushing its own code and telemetry (local mode). Rationale: CW already authors
      100% of wrap content; most recorded wrap defects were runner transcription
      errors (CRLF conversion, wrong backlog section, rogue archive path, heredoc
      commit-message damage, indented GOTCHAS).
    - >
      The seven improvements in Section 9 are IN.
    - >
      ChromaControl (chromacontrol-v2) is dormant and is the only repo where GitHub
      is NOT a complete mirror. It is rendered LAST, only after the model is proven
      on active repos; until then its existing protocol pair stands untouched.

# =============================================================================
# 2. PROBLEM STATEMENT — evidence of drift
# =============================================================================

drift_evidence:
  variants_in_the_wild:
    - name: STANDARD (single-app + monorepo, unified)
      dated: 2026-08-08
      notes: 4 reflection questions; ARCHITECTURE RULE + paired /lib rule; wrap splits
        at 1,000 lines or >10 edit operations; backlog schema uses in_progress/backlog.
    - name: SYNCLIPS-SYSTEM (chromasync, synclips-platform, dv-captain)
      dated: 2026-07-04
      notes: Standard + relay read at start + mandatory relay assessment and optional
        second "relay prompt" at wrap. Never received the 08-08 standard updates —
        3 reflection questions, no ARCHITECTURE RULE, splits at 400 lines.
    - name: CHROMACONTROL v2
      dated: 2026-06-20 / 2026-06-25
      notes: Gentle pull instead of hard reset; Python py_compile validation; three
        surfaces (desktop / WSL build / phone); spike mode with EMPTY authorized list;
        secrets guard; context-primer as phase authority; tombstone GOTCHA never
        archived; operator-empathy banners. Internally inconsistent — the start file's
        DONE banner uses echo -e ANSI in the same file that says ANSI does not render.
    - name: CONVERGIBLE-SANDBOX (start/end × local/dispatch = 4 files)
      dated: 2026-08-20, rewritten 2026-08-29, amended 2026-09-03
      notes: The most advanced lineage. Adds dispatch pipeline, artifact register
        (binding), database-access rules, rulings register, verify-before-you-write,
        one-item agenda, closed backlog status vocabulary, sections
        prioritized/in_progress/completed, 6 reflection questions, GOTCHA
        consolidation at 100/monthly as its own session, backlog-archive after 30 days.
        Still contains one stale line ("Matt runs his own wrap prompt — never
        auto-generate") that contradicts the 2026-09-02 ruling that CW builds the wrap
        from the protocol when Matt declares the session finished.
  what_the_drift_costs:
    - >
      A fix made in one variant (e.g. the /lib architecture rule) never reaches the
      others, so the same defect recurs in other repos months later.
    - >
      Behavioral rules Matt has stated in chat (end every reply with the next verb and
      who owns it; plain-English-first on measurements; state overall project position
      at every wrap) live only in CW's private memory, so a fresh CW session in a repo
      whose protocol lacks them behaves differently.
    - >
      Schema divergence (backlog sections, status words) causes wrap misroutes.
  what_is_NOT_the_problem:
    - >
      The per-repo differences are real and legitimate. This design does not try to
      erase them; it moves them into a declared config so the shared 90% can be shared.

# =============================================================================
# 3. DESIGN PRINCIPLES
# =============================================================================

principles:
  - id: P1
    name: Unify the source, not the runtime prompt
    text: There is one master. There is no runtime prompt that branches on "if this
      repo is X." Each repo receives a rendered copy with the branches already
      resolved, so a session reads a flat file with nothing conditional left in it.
  - id: P2
    name: Rendered copies are complete and standalone
    text: A rendered file contains everything a session needs. It never says "see the
      master" or "as in the local variant." A renderer check greps the output for
      forbidden cross-reference phrasings before it ships.
  - id: P3
    name: Detect what can be detected; declare what cannot
    text: Repo shape (single-app vs monorepo) and subsystem presence (package.json,
      supabase/, .github/workflows, .chromaqa/, .venv) are auto-detected at render
      time and written into the config as detected values Matt can override. Things
      that cannot be inferred from the tree — mirror completeness, secrets paths,
      tombstones, companion repos, surfaces, ID prefixes — are declared in the config.
  - id: P4
    name: Safe defaults on the destructive knobs
    text: The refresh mode defaults to GENTLE PULL. HARD RESET is only rendered when
      the config explicitly declares mirror complete. A missing or malformed config
      never produces a destructive refresh.
  - id: P5
    name: The master is the only edit point
    text: Repo copies carry a "DO NOT EDIT — rendered from forgeflow/master vN" header.
      Any session that notices a protocol bug files it against the master.
  - id: P6
    name: Drift is pushed, not polled
    text: >
      A start protocol reads only files inside its own repo — never forgeflow. When a
      propagation pass leaves a repo behind, the pass writes a protocol_drift line
      into that repo's handoff.yaml; the next session states it in one line. There
      is no per-session cross-repo read. (Board S1; supersedes the v1.0 poll.)
  - id: P7
    name: One rendered file per READER
    text: >
      Each repo holds one start file and one wrap file per reader. Repos without
      dispatch hold one of each (read by CW). Repos with dispatch also hold
      start-protocol.dispatch.yaml and end-protocol.dispatch.yaml, rendered from the
      SAME master blocks with the runner-irrelevant blocks excluded — a cold runner
      with a shallow clone must not spend its attention on Surface checkouts, hard
      reset vs gentle pull, or typed-confirmation banners it cannot execute. Mode is
      still a per-task choice inside a session; the choice selects which file the
      task's prompt points at. One master, one edit point; the split is output-side.
      The block manifest (Section 6) proves the two files cannot drift from each
      other. The dispatch render additionally applies a FIXED READER ORDERING: scope
      lock, off-limits, halt-and-report, inbox path and the needs_ruling procedure
      occupy the first block positions regardless of their master order — a cold
      runner reads top-down. Block IDs are stable; block ORDER is per-reader.
      (Board S5 + v1.2 Context Engineer; answers v1.0 Q1.)
  - id: P8
    name: Chat rulings become repo text
    text: Any durable behavioral rule Matt states in chat is added to the master in the
      same or next session, or it does not exist to the next session. CW's memory is a
      side channel, not a source of truth.
  - id: P9
    name: The renderer is code, not discipline
    text: >
      Block resolution, substitution, the standalone check, the block manifest,
      schema validation and the config hash are performed by master/render.py,
      executed in CW's sandbox on content fetched via the GitHub MCP. CW's judgment
      is applied to the DIFF and to the plain-English summary for Matt — never to
      the transformation itself. A hand render is permitted only as a fallback, is
      stamped render_method: manual, and is never propagated to more than one repo
      without a verified code re-render. (Board M5; CW confirmed it has code
      execution.)
  - id: P10
    name: Evidence, not belief
    text: >
      Every factual claim CW writes into a .forge/ file carries the identifier of the
      artifact it fetched to check it (commit SHA, PR number, CI run ID, deployment
      ID, query result). A claim without an identifier is written in the "reported"
      form, never the "verified" form. (Board M4.)
  - id: P11
    name: Rules have a budget and a sunset
    text: >
      Adding a rule to the master that breaches the rendered-file ceiling requires
      naming the rule it replaces or retires. Every 200 sessions a PRUNE SESSION
      reviews the master: a rule not cited, triggered or violated in 200 sessions is
      deleted or demoted to a reference document no session must read. A compliance
      canary near the end of every rendered protocol detects when the tail has
      stopped being read. The ceiling NUMBERS were set in v1.4 from measured
      renders, per READER file — see rendering.file_ceilings in Section 6; 400
      lines was the board's guess, not a measurement. (Board S4 + pre-mortem 1.)

# =============================================================================
# 4. ARTIFACT SET
# =============================================================================

artifacts:
  in_forgeflow_master_directory:   # github.com/chromasmith/forgeflow  master/
    - path: master/BLUEPRINT.yaml
      purpose: This document, kept current as the design evolves.
    - path: master/start-protocol.master.yaml
      purpose: The master start protocol. Contains every section any repo could need,
        each conditional block tagged with a `render_when:` condition that the
        renderer resolves against the repo's config.
    - path: master/end-protocol.master.yaml
      purpose: The master wrap protocol, same conditional-block mechanism.
    - path: master/claude-md.house-block.master.md
      purpose: The house-standard block of CLAUDE.md (architecture rule, communication
        rules, dispatched-session rules, protocol pointers). Rendered between marker
        comments inside each repo's CLAUDE.md; repo-specific content outside the
        markers is never touched by a render.
    - path: master/protocol-config.schema.yaml
      purpose: The schema every repo's .forge/protocol-config.yaml must satisfy,
        with defaults and the detect-vs-declare flag per field.
    - path: master/registered-repos.yaml
      purpose: The list of repos that receive renders, with their config path and the
        master version they were last rendered from. This is what a propagation pass
        iterates.
    - path: master/RENDER_PROCEDURE.md
      purpose: Step-by-step how CW renders one repo — read config, detect, resolve
        conditional blocks, run the standalone check, stamp headers, diff against the
        repo's current copy, push. Written so a fresh CW session can execute it cold.
    - path: master/PROPAGATION_PROCEDURE.md
      purpose: How a master change ripples out — bump version, iterate
        registered-repos, render each, open PR or direct commit per the size rule,
        verify, update registered-repos.
    - path: master/CHANGELOG.yaml
      purpose: Version history of the master itself (what changed in v1 → v2 → ...).
    - path: master/render.py
      purpose: >
        The deterministic renderer (Board M5). Inputs: master files + a repo's
        protocol-config.yaml. Outputs: the rendered files, byte-exact, with header
        stamp, block manifest and real config hash. Owns block resolution,
        substitution, standalone grep, schema validation. Roughly 200 lines. Run by
        CW in its sandbox; a GitHub Action wrapper is a later option, not a
        requirement.
    - path: master/LINEAGE_RECONCILIATION.yaml
      purpose: >
        Board M2. Every behavioral rule found in any of the four legacy lineages,
        each with exactly one disposition — folded (names the master block ID),
        knobbed (names the config field), or dropped (one-sentence reason). A rule
        with no disposition blocks the first render. Matt reads only the dropped
        list.
    - path: master/profiles/
      purpose: >
        Board S2. Named profile defaults — standard, legacy-local, docs-only — that a
        repo's ~10-line config selects and overrides. The full schema in Section 5 is
        the renderer's internal contract; profiles are the repo-facing surface.
  rendered_into_each_repo:
    - path: .forge/protocol-config.yaml
      purpose: The repo's declared and detected knobs. Small (under ~60 lines).
        Hand-editable by Matt-directed CW when a fact about the repo changes.
    - path: .forge/protocols/start-protocol.yaml
      purpose: Rendered, standalone start protocol. DO NOT EDIT header.
    - path: .forge/protocols/end-protocol.yaml
      purpose: Rendered, standalone wrap protocol. DO NOT EDIT header.
    - path: .forge/protocols/start-protocol.dispatch.yaml
      purpose: Dispatch-reader start file (only when execution.dispatch.enabled). Same
        master blocks, runner-irrelevant blocks excluded. See P7.
    - path: .forge/protocols/end-protocol.dispatch.yaml
      purpose: Dispatch-reader wrap file (only when execution.dispatch.enabled).
    - path: .forge/inbox/<run-id>.yaml
      purpose: >
        Board M1 — the OBSERVATION INBOX. Written by CC on its own branch as the LAST
        action of every task, before any prose report: reflection answers verbatim,
        SCOPE DISCLOSURE (every file touched), ARCHITECTURE DISCLOSURE, discovered
        GOTCHAs in final line form, and needs_ruling entries for any decision CC
        could not make (a dispatched run writes needs_ruling and STOPS — it never
        chooses; this is dispatch's substitute for a human gate). One file per run,
        never shared, so parallel runs cannot collide. CW's wrap consumes every
        inbox file into the .forge/ documents and moves it to .forge/archive/inbox/.
        A TASK IS NOT COMPLETE UNTIL ITS INBOX FILE EXISTS (v1.2, N1). LOCAL mode:
        VERIFY PUSH fails if the branch contains code changes and no inbox file for
        this run — CC states "INBOX MISSING" and writes it before reporting done.
        DISPATCH mode: CW does not open the PR for a run with no inbox file; it
        comments on the branch asking for it, and if the run has ended, CW opens the
        PR marked "no inbox — observations lost for this run" so the gap is visible.
        At wrap, CW reconciles inbox files against RUNS, not against the directory:
        it lists every run of the session and states, per run, consumed / missing. A
        session with missing inboxes says so in the handoff. This formalizes the
        existing CC-reports/<ISSUE-ID>.md convention; the artifact register records
        the rename.
    - path: CLAUDE.md   (house block only, between markers)
      markers:
        open: "<!-- FORGEFLOW HOUSE BLOCK — rendered from forgeflow/master vN — do not edit inside markers -->"
        close: "<!-- END FORGEFLOW HOUSE BLOCK -->"
    - path: .forge/rulings.yaml
      purpose: Rulings register, created empty if absent (Section 9, item 3).
    - path: .forge/protocols/artifact-register.yaml
      purpose: Created from a house template if absent; repo-specific entries are
        appended by sessions and never overwritten by a render.
  kept_repo_specific_never_rendered:
    - >
      .forge/protocols/database-access.yaml (convergible-sandbox) — repo-specific facts
      about runner database roles; the master references the CONCEPT ("if the repo
      declares a database-access doc, it is binding on data tasks") and the config
      names the path.
    - >
      The relay repo's own PROTOCOL.md (synclips-relay) — authoritative for relay
      mechanics; the rendered Synclips protocols point to it by path, which is
      permitted because it is a DIFFERENT repo's governing doc, not protocol content
      delegated by reference.
  thought_box:
    - >
      The thought-box vault entries for session-start and session-end become POINTERS
      to forgeflow/master. No second copy of prompt content is kept there.

# =============================================================================
# 5. CONFIG SCHEMA — .forge/protocol-config.yaml
# =============================================================================

protocol_config_schema:
  schema_version: "1"
  two_forms: >
    Board S2. The REPO-FACING form is short: a profile name plus explicit overrides.
    The EXPANDED form below is the renderer's internal contract; render.py expands
    profile + overrides into it, validates it, and writes the effective values back
    into the repo config as a trailing comment block so the true values are readable
    without consulting the master. Every deviation from house standard is therefore
    visible as an explicit override, never buried among inherited defaults.
  repo_facing_form_example: |
    # .forge/protocol-config.yaml
    profile: standard          # standard | legacy-local | docs-only
    repo: { org: chromasmith, name: convergible-sandbox }
    overrides:
      execution.dispatch.enabled: true
      subsystems.database_access_doc: ".forge/protocols/database-access.yaml"
      north_star_doc: ".forge/specs/convergible-2.5-vision.yaml"
    # --- effective values (written by render.py, do not edit) ---
  profiles:
    standard:     { mirror.github_is_complete_mirror: true,  build.validation: npm-build, execution.local: true, execution.dispatch.enabled: false }
    legacy-local: { mirror.github_is_complete_mirror: false, build.validation: py-compile, execution.local: true, execution.dispatch.enabled: false }
    docs-only:    { mirror.github_is_complete_mirror: true,  build.validation: none,      execution.local: true, execution.dispatch.enabled: false }
  fields:
    protocol:
      master_version: { type: string, set_by: renderer, example: "v1.0" }
      rendered_on:    { type: date,   set_by: renderer }
      config_hash:    { type: string, set_by: renderer, note: "SHA-256 of the expanded config, computed by render.py — real, not narrated" }
      render_method:  { type: enum, values: [code, manual], set_by: renderer, note: "manual renders never propagate beyond one repo" }
    north_star_doc:
      type: string
      declared: true
      example: ".forge/specs/convergible-2.5-vision.yaml"
      note: >
        Board pre-mortem 2. A pointer to the repo's existing product-truth document
        (vision/spec), read at session start before the backlog. No new artifact is
        created where one exists; a repo with none may add a 30-line
        .forge/north-star.yaml. The wrap gains one CW-answered question: "Did today's
        work make the product better, or only move the board?"
    repo:
      org:                { type: string, declared: true, example: chromasmith }
      name:               { type: string, declared: true, example: convergible-sandbox }
      canonical_checkout: { type: string, default: "C:\\Chromasmith\\<n>" }
      default_branch:     { type: string, default: main }
    mirror:
      github_is_complete_mirror:
        type: boolean
        declared: true
        default: false
        note: >
          Drives refresh mode. true → hard reset to origin/main after the safety
          check. false → gentle pull after the safety check. Defaults to false so a
          missing config can never render a destructive refresh (Principle P4).
      gitignored_local_only_paths:
        type: list
        declared: true
        example: ["secrets/initiator-identity.yaml"]
        note: Paths expected to appear untracked; the safety check must not flag them.
    shape:
      kind:           { type: enum, values: [single-app, monorepo], detected: true, overridable: true }
      build_location: { type: string, detected: true, example: "apps/admin" }
    build:
      validation:
        type: enum
        values: [npm-build, py-compile, none]
        detected: true
        note: npm-build when package.json present at build_location; py-compile when a
          .venv or pyproject exists and no package.json; none for docs-only repos.
      build_command:  { type: string, default: "npm run build" }
      deploy:         { type: enum, values: [vercel, none, custom], detected: true }
      deploy_verify:  { type: string, declared: true, example: "Vercel deployment record READY for the exact SHA" }
      surfaces:
        type: list
        declared: true
        default: [desktop]
        note: >
          Multi-surface repos (ChromaControl) declare e.g. [desktop, wsl-build, phone]
          with a validation bar per surface. Renders the surface-aware completion
          steps and the spike-mode (empty authorized list) rules only when more than
          one surface is declared.
    execution:
      local:    { type: boolean, default: true }
      dispatch:
        enabled:   { type: boolean, declared: true, default: false }
        requires:  [".github/workflows/claude.yml", "CLAUDE_CODE_OAUTH_TOKEN secret", "branch protection on main", "artifact register", "mirror.github_is_complete_mirror: true"]
        note: >
          The renderer refuses dispatch: true when any requirement is absent and
          says which one, so Matt knows the one-time install step still owed.
      max_parallel: { type: integer, default: 3 }
    subsystems:            # each: detected + overridable
      supabase:        { detected_by: "supabase/ directory" }
      vercel:          { detected_by: ".vercel/project.json or vercel.json" }
      ci_quality_gate: { detected_by: ".github/workflows/*.yml naming a quality gate" }
      chromaqa:        { detected_by: ".chromaqa/ directory", debt_threshold: 25 }
      ui_inventory:    { detected_by: ".forge/specs/ui-inventory.yaml" }
      artifact_register: { detected_by: ".forge/protocols/artifact-register.yaml" }
      database_access_doc: { declared: true, example: ".forge/protocols/database-access.yaml" }
    companion_repos:
      type: list
      declared: true
      item:
        name:          { example: synclips-relay }
        role:          { enum: [relay], note: "other roles may be added later" }
        read_at_start: { type: boolean, default: true }
        write_at_wrap: { type: boolean, default: true }
        governing_doc: { example: "PROTOCOL.md" }
      note: Non-empty list renders the relay-read step at start and the mandatory
        relay assessment + relay write at wrap.
    protected:
      never_touch_paths:   { type: list, declared: true, example: ["secrets/initiator-identity.yaml"] }
      phase_authority_doc: { type: string, declared: true, example: ".forge/blueprint/context-primer.yaml", note: "renders the conditional phase-refresh wrap step when set" }
      tombstone_gotchas:   { type: list, declared: true, example: ["V2-G-028"], note: "never archived by any consolidation" }
      spec_dirs_off_limits: { type: list, default: [".forge/specs/"], exceptions: [".forge/specs/ui-inventory.yaml (append only)"] }
    ids:
      gotcha_prefix:  { default: "GOTCHA-", example_override: "V2-G-" }
      bug_prefix:     { default: "BUG-" }
      ruling_prefix:  { default: "RULING-" }
      backlog_prefix: { declared: true, example: "CV-" }
    thresholds:          # house defaults; overridable but discouraged
      session_history_cap: 15
      changelog_cap: 12
      gotcha_consolidation: { trigger_count: 100, or_every: "1 month", runs_as: "its own session" }
      backlog_completed_archive_after_days: 30
      wrap_split: { lines: 1000, edit_operations: 10 }
      chromaqa_debt_alert: 25
  validation_rules:
    - >
      dispatch.enabled may not be true unless mirror.github_is_complete_mirror is true.
    - >
      surfaces must contain at least one entry.
    - >
      Every path in protected.never_touch_paths must appear in mirror.gitignored_local_only_paths
      OR be tracked; the renderer reports which.
    - >
      Unknown fields fail the render with a clear message rather than being ignored.

# =============================================================================
# 6. RENDERING RULES
# =============================================================================

rendering:
  who_renders: >
    Claude Web executes master/render.py in its sandbox (Board M5): it fetches the
    master files and the repo's config via the GitHub MCP, runs the renderer as code,
    and pushes the byte-exact output. CW's judgment is applied to the DIFF and to
    Matt's plain-English summary, never to the transformation. If code execution is
    unavailable in a given session, CW may render by hand, stamps the output
    render_method: manual, and never propagates a manual render to more than one repo
    without a subsequent verified code re-render.
  conditional_blocks:
    syntax_in_master: >
      Each optional section in a master file is wrapped in
      `# >>> render_when: <condition>` ... `# <<< end render_when` comment fences.
      Conditions are simple boolean expressions over config fields, e.g.
      `execution.dispatch.enabled`, `companion_repos is non-empty`,
      `mirror.github_is_complete_mirror == false`, `len(build.surfaces) > 1`.
    resolution: The renderer keeps a block when its condition is true and removes the
      block AND its fences when false. No fence text survives into the rendered copy.
    claude_md_master_fences: >
      The CLAUDE.md house-block master is Markdown, so its conditional fences are
      HTML-comment lines carrying the same render_when condition language, one fence
      per line, no nesting. render.py resolves them, substitutes placeholders and runs
      the standalone check on the block before placing it between the markers.
  substitutions: >
    Placeholders like {{repo.name}}, {{repo.canonical_checkout}}, {{build.build_command}}
    are replaced with config values. An unresolved placeholder fails the render.
  standalone_check: >
    After resolution, the renderer greps the output for forbidden phrasings
    ("see the local variant", "inherited from", "as in end-protocol", "refer to master")
    and for any leftover `{{` or `render_when`. Any hit fails the render.
  file_ceilings:
    rule: >
      Board S4 / Principle P11, SET 2026-09-04 (v1.4). Ceilings are per READER FILE,
      not per repo: a rendered file that exceeds its ceiling is not pushed, and the
      master change that pushed it over must name the rule it replaces or retires
      (replace-to-add). RENDER_PROCEDURE.md step 5 compares wc -l against these.
    ceilings_lines:
      start-protocol.yaml:          1650   # Claude Web reader
      start-protocol.dispatch.yaml: 650    # runner reader
      end-protocol.yaml:            1400   # Claude Web reader
      end-protocol.dispatch.yaml:   150    # runner reader — one block (E-001) by design; a second block is a deliberate decision, not drift
    measurement:
      date: 2026-09-04
      master_commit: ecf77e5
      config: master/tests/fixtures/config-sandbox-real.yaml (the real convergible-sandbox knob set — the largest render, every subsystem on, dispatch on)
      method: wc -l on render.py output in the Claude Web sandbox, two renders byte-identical
      measured_lines: { start-protocol.yaml: 1436, start-protocol.dispatch.yaml: 562, end-protocol.yaml: 1207, end-protocol.dispatch.yaml: 90 }
      headroom: about 15 percent over each measured file, rounded up to the nearest 50
      note: >
        The lineage reconciliation estimated 1,200 for CW-read files; the real CW
        start file came in at 1,436, so the estimate was superseded by the
        measurement rather than trimming content Matt has kept in every lineage.
        A ChromaControl-shape render (config-legacy.yaml) is smaller on every file.
  header_stamp: >
    Every rendered file begins with a fixed header: source
    (chromasmith/forgeflow master/<file>), master version, render date,
    render_method, config hash, "DO NOT EDIT THIS FILE — edit the master and
    re-render.", and a one-line summary of the resolved knobs. It then carries a
    BLOCK MANIFEST (Board F4): the ordered list of every master block ID included, and
    every block ID excluded with the config condition that excluded it. Master blocks
    carry stable IDs (B-001, B-002, ...) that are never changed or reused. A render
    is valid only if included + excluded == the master's full block list and every
    excluded block's condition evaluates false against this repo's config. render.py
    enforces this; an invalid render is not pushed.
  compliance_canary: >
    Board pre-mortem 1. Near the END of every rendered protocol sits one cheap,
    observable instruction ("state the block-manifest count in your first output
    line"). When the canary stops appearing in session output, the tail of the
    protocol has stopped being read — learned in one session, not thirty. The same
    canary is the S6 test for whether dispatched runners read the protocol file at
    all (Section 11, step 3).
  drift_ci_deferred: >
    v1.2, deferred until the render is proven (after rollout step 4). A single
    workflow per rendered repo (.github/workflows/protocol-check.yml, installed by
    Matt once, same one-time list as claude.yml) re-runs the render on every PR
    touching .forge/protocols/ or .forge/protocol-config.yaml and fails the check if
    the committed file is not byte-identical to the render of the committed config —
    hand-edits become impossible rather than discouraged. [VERIFY] requires
    render.py to run on a runner with forgeflow fetched; confirm a token-readable
    checkout of forgeflow from another repo's Action before relying on it.
  claude_md_rendering: >
    The renderer locates the marker pair in the repo's CLAUDE.md, replaces only the
    text between them, and leaves everything else byte-identical. If the markers are
    absent, it appends the block at the end of the file with markers and reports that
    Matt may want to reorder it.
  diff_review: >
    Before pushing, CW diffs the rendered files against the repo's current copies and
    summarizes the change in plain English to Matt (e.g. "adds the rulings register
    step, unifies backlog sections, removes the stale ZIP-upload wording"). For the
    FIRST render of convergible-sandbox the expected diff is small — that repo is the
    master's source lineage — and any large unexpected diff is a renderer bug.

# =============================================================================
# 7. PROPAGATION PROCEDURE — how one change reaches every repo
# =============================================================================

propagation:
  trigger: Matt and CW agree a protocol change is needed (bug, refinement, a new tool
    such as ChromaQA 7.0 or the SEO/GEO tool that changes what a session must do).
  steps:
    - >
      Edit the master file(s) in forgeflow via PR or direct commit; bump master version;
      add a master/CHANGELOG.yaml entry stating what changed and why.
    - >
      If the change needs a new knob, extend protocol-config.schema.yaml with a DEFAULT
      so existing configs stay valid without edits.
    - >
      For each entry in registered-repos.yaml: read its config, render, run the
      standalone check, diff, push. Delivery: a PR per repo by default; a direct commit
      for small, low-risk changes per Matt's 2026-09-02 ruling on direct edits.
      Before pushing to any repo, CW asks whether a CC session is active on it (two
      writers on one repo is a collision).
    - >
      Update registered-repos.yaml with the new rendered version per repo.
    - >
      Report to Matt in one plain sentence per repo: rendered / PR open / skipped and why.
  partial_propagation: >
    A repo may deliberately lag (e.g. ChromaControl). registered-repos.yaml records
    "pinned: vN — reason" so the drift flag at session start reads as intentional.
  drift_detection: >
    Drift is PUSHED, not polled (Board S1). When a propagation pass renders some repos
    and pins or defers others, CW writes a single field into each lagging repo's
    handoff.yaml in the same pass: protocol_drift: "repo on v1.2; master is v1.4 —
    <reason>". Start protocols read only files inside their own repo. If the field is
    present, the Session Context Summary states it in one line and offers a re-render
    as an option; it never re-renders mid-session. Re-rendering removes the field. No
    start protocol ever reads forgeflow.
  atomic_propagation: >
    Board pre-mortem 3. A master version bump is not complete until every registered
    repo is either rendered to it or explicitly pinned with a written reason. A
    propagation that cannot finish in its session is REVERTED — the master version
    rolls back rather than being left half-landed. registered-repos.yaml has exactly
    two states per repo: current, or pinned-with-reason. "Mostly propagated" does not
    exist. The pass writes registered-repos.yaml LAST, after every render or pin has
    landed (v1.2, N5): it is the single authority on versions; the protocol_drift
    handoff line is a courtesy notice derived from it, never a second record. A pass
    that fails partway leaves registered-repos.yaml on the OLD version — which
    correctly describes a reverted bump — and CW's next act is to remove any drift
    lines it wrote before the failure.
  delivery_rule: >
    A propagation is never a direct commit — PR per repo, always (Board, Release
    Engineer). A bad render caught in PRs is eight closed tabs; caught in commits it
    is eight reverts Matt must authorize. Direct commit remains available for a
    single-repo small change per the 2026-09-02 ruling.

# =============================================================================
# 8. SESSION FLOW UNDER THE NEW SYSTEM (what Matt experiences)
# =============================================================================

session_flow:
  start:
    - >
      Matt opens a CW chat and names the repo. No ZIP, no protocol paste.
    - >
      CW reads, from GitHub, in order: .forge/protocol-config.yaml,
      .forge/protocols/start-protocol.yaml, then the files the protocol names
      (handoff FIRST, rulings, session-state, backlog, active-bugs, session-history,
      GOTCHAS, artifact register and database-access doc if declared, companion repo
      files if declared).
    - >
      HANDOFF STALENESS CHECK (Board M3 — the board's single highest-leverage
      amendment). handoff.yaml carries written_at_commit (HEAD SHA when written) and
      written_at_utc. Step 1 compares written_at_commit to the current HEAD of the
      default branch. If commits have landed since, the Session Context Summary
      OPENS with: "HANDOFF IS STALE — N commits have landed since it was written.
      Treating first_thing as a suggestion, not a briefing. Reconstructing from the
      last N commits and session-history before proposing the first item." If they
      match: "Handoff current at <SHA>." Never silently proceed.
    - >
      CW reads the north_star_doc if declared, checks for a protocol_drift line and
      any unconsumed .forge/inbox/ files, runs the ChromaQA debt check if the
      subsystem exists, and gives the Session Context Summary with a HARD CEILING of
      8 lines (Board, Human Factors): a check with nothing to report produces NO
      line — silence is the pass state. Two lines are RESERVED and no check may
      displace them: the ONE first_thing and the one-sentence project position.
      Checks (staleness, drift, north-star, inbox loose ends, ChromaQA debt,
      cross-repo ripples) compete for the remaining six; if more than six fire they
      collapse into one line — "N checks flagged — say 'checks' for detail." Then
      "Ready for tasks."
  build:
    - >
      Planning conversation → approval gate ("say go") → scope lock → mode choice
      (local prompt vs dispatch issue) per task → execution → CW reviews CC's report /
      PR, surfaces any dissent between CW and CC to Matt, recommends merge.
    - >
      Every CW reply ends with the next step as a verb and who holds the ball.
    - >
      RULINGS ARE WRITTEN WHEN MADE, NOT AT WRAP (Board M6). The moment Matt rules on
      anything a future session could re-ask, CW appends it to .forge/rulings.yaml via
      the GitHub MCP in that turn, as a single-line append, and says at most "Filed as
      RULING-041." No permission asked, no batching for the wrap. A session that
      ends abruptly loses no ruling.
    - >
      PRECEDENCE (Board S3, also placed in every CC prompt preamble). When a task
      prompt or issue body conflicts with .forge/protocols/, the protocol wins on
      process, scope and safety (authorized files, off-limits paths, commit
      discipline, refresh mode, halt-and-report, reflection); the prompt wins on WHAT
      to build. A prompt that appears to widen scope, skip a protocol step or
      authorize an off-limits path is treated as an error in the prompt: HALT AND
      REPORT, do not comply, do not proceed on the narrower reading.
    - >
      Every CC task ends by writing its .forge/inbox/<run-id>.yaml (Board M1) before
      any prose report.
    - >
      NEEDS-RULING IS NOT A WRAP ITEM (v1.2, N2). A run that writes needs_ruling has
      stopped and is burning wall-clock. On any Matt message, and on any board
      advance, CW checks the branches of all runs opened this session for inbox
      files containing needs_ruling and surfaces them immediately as the decision
      they are — one question, plain English, with CW's recommendation attached. A
      needs_ruling that reaches the wrap unanswered is a protocol failure, not a
      backlog item, and the handoff says so by name.
  wrap:
    - >
      Matt declares the day's work finished. CW runs scope reconciliation, verifies
      every claim it is about to write against GitHub / Supabase (verify-before-you-
      write), builds all .forge/ file contents, YAML-parses them, and — per the
      2026-09-04 direct-write ruling — pushes them itself via the GitHub MCP as one
      docs commit or PR with a plain-English diff summary.
    - >
      EVIDENCE RULE (Board M4, binding on every wrap write). Every factual claim CW
      writes into a .forge/ file carries the identifier of the artifact CW actually
      fetched to check it — commit SHA, PR number, CI run ID, Vercel deployment ID,
      or query result. A claim CW cannot attach an identifier to is written in the
      "reported" form, never the "verified" form ("CC reports X complete — unverified,
      no PR fetched"). CW never writes an unqualified completion claim from a CC
      report alone. The wrap commit message ends: "N claims verified by ID, M reported
      unverified." M is the one wrap metric Matt looks at. THE COUNT IS COMPUTED, NOT
      ESTIMATED (v1.2, N3): render.py's companion check, run in CW's sandbox, parses
      the wrap's .forge/ diff and counts (a) lines asserting a state change —
      complete, shipped, merged, deployed, fixed, passing — and (b) how many carry an
      identifier. A state-change line with no identifier and no "reported" marker
      FAILS the wrap write; CW fetches the artifact or rewrites the line in reported
      form. Vagueness is not an escape: a wrap recording no state changes at all in a
      session that produced commits is itself flagged.
    - >
      CW consumes every .forge/inbox/ file into the .forge/ documents and moves them to
      .forge/archive/inbox/. Any inbox file it cannot consume is named as a loose end
      in the handoff. handoff.yaml is written with written_at_commit and written_at_utc.
    - >
      CW answers the north-star question in one sentence in the handoff: "Did today's
      work make the product better, or only move the board?"
    - >
      LOCAL mode remainder (end master E-021): CC gets a short prompt to commit and
      push its own code and telemetry with named files and run VERIFY PUSH. CW issues
      it BEFORE the docs write when the local checkout may hold unpushed work, so the
      resulting commit SHA can serve as evidence in the wrap files; when every task
      already pushed and verified, CW says so in one line and skips it. DISPATCH mode:
      nothing further; CC's work already landed via merged PRs. (Order corrected in
      v1.4; the master is the ruling text.)
    - >
      CW states the OVERALL PROJECT POSITION in one plain sentence — a finished session
      must never read as a finished project.
    - >
      Relay assessment runs if a companion repo is declared; the explicit "no relay
      update needed" sentence is required when nothing crossed a seam.

# =============================================================================
# 9. IMPROVEMENTS FOLDED INTO THE MASTER (all ratified 2026-09-04)
# =============================================================================

improvements:
  - id: I1
    name: Wrap direct-write
    detail: See hard_constraints.decisions_ratified. Eliminates the transcription
      failure class. Keeps a manual GitHub-web fallback for when the MCP is down.
  - id: I2
    name: One backlog schema and one status vocabulary
    detail: Sections are prioritized / in_progress / completed (no section named
      "backlog"). Status is one of ready | blocked | needs-ruling | in_progress |
      deferred | completed | superseded. Completed items MOVE to completed and archive
      to .forge/archive/backlog-archive.yaml after 30 days. Repos on the old schema are
      migrated by a one-time wrap-style edit during their first render.
  - id: I3
    name: Promote convergible-sandbox's newest rules to every repo
    detail: Rulings register (.forge/rulings.yaml) with search-before-asking;
      verify-before-you-write (STEP 2b); one-item agenda; artifact register (R1-R5);
      dissent-visibility rule; advance-the-board rule for dispatch sessions;
      "a merged PR proves nothing about buildability."
  - id: I4
    name: Chat rulings become protocol text
    detail: >
      Added to the master's CW behavior section: end every reply with the next
      step as a verb and who holds the ball; give measurements plain-English-first,
      numbers after; state overall project position at every wrap and milestone;
      human gates with typed confirmation for live supervised runs; never re-ask a
      question Matt has ruled on (search rulings first); a "might" is not a decision;
      ask before touching a repo another CC session may be working in; hand the turn
      back after dispatching instead of sleep-polling; one CC prompt per reply; one
      Matt action item per reply.
  - id: I5
    name: Version stamp + drift flag
    detail: Section 6 header_stamp and Section 7 drift_detection.
  - id: I6
    name: One canonical reflection set
    detail: >
      Always: (1) what would have made this prompt better; (2) anything that would
      make a future memoryless session fail or waste time; (3) SCOPE DISCLOSURE;
      (4) ARCHITECTURE DISCLOSURE (data/business logic in .tsx?). Rendered only when
      applicable: (5) RUNNER ENVIRONMENT (dispatch only); (6) UI CONFORMANCE (when
      ui-inventory exists); (7) ARTIFACT PATHS (when the task creates any file).
      For multi-surface repos, question 3 adds "for a spike, confirm the repo was
      never touched."
  - id: I7
    name: Stale-line corrections carried into the master
    detail: Remove "Claude Web has NO CLI/MCP access" everywhere; remove "Matt runs his
      own wrap prompt — never auto-generate" (CW builds the wrap when Matt declares
      the session finished, never unprompted mid-session); replace ZIP-upload wording
      with GitHub-direct reading; make the DONE banner plain text everywhere (no
      echo -e ANSI); CLAUDE.md "Session workflow" section names handoff.yaml and the
      .forge/protocols/ path.

  - id: I8
    name: Board amendments accepted in v1.1
    detail: >
      M1 observation inbox; M2 lineage reconciliation gate; M3 handoff staleness
      stamp; M4 evidence rule; M5 deterministic renderer; M6 rulings written when
      made; S1 pushed drift; S2 profile config; S3 precedence rule; S4 prune cadence
      + replace-to-add (ceiling number deferred); S5 one file per reader; S6 dispatch
      canary; atomic propagation; compliance canary; 8-line summary ceiling;
      north-star pointer + wrap question. Each is placed in the section it amends.

# =============================================================================
# 10. REPO EXCEPTIONS EXPRESSED AS CONFIG (proof the knobs cover the variants)
# =============================================================================

variant_mapping:
  standard_saas_repo:
    mirror.github_is_complete_mirror: true
    shape.kind: detected
    build.validation: npm-build
    execution.dispatch.enabled: false until installed
    companion_repos: []
  synclips_system_repo:
    same_as: standard_saas_repo
    companion_repos:
      - { name: synclips-relay, role: relay, governing_doc: PROTOCOL.md }
    note: >
      The rendered start file gains the relay-read step and the Session Context
      Summary line "Cross-repo state: N inbound ripples pending, M relevant open
      questions." The rendered wrap gains the mandatory relay assessment and, when
      needed, the relay write (executed by CW direct-write against the relay repo,
      same surgical-operations discipline, DELETE means delete, evidence rule, ID
      counters from state.yaml).
  chromacontrol_v2:
    mirror.github_is_complete_mirror: false          # → gentle pull
    mirror.gitignored_local_only_paths: ["secrets/initiator-identity.yaml"]
    build.validation: py-compile
    build.surfaces: [desktop, wsl-build, phone]      # → surface-aware completion, spike mode
    build.deploy: none
    execution.dispatch.enabled: false                 # structurally impossible (mirror false)
    subsystems: { supabase: false, vercel: false, ci_quality_gate: false, chromaqa: false }
    protected.never_touch_paths: ["secrets/initiator-identity.yaml"]
    protected.phase_authority_doc: ".forge/blueprint/context-primer.yaml"
    protected.tombstone_gotchas: ["V2-G-028"]
    ids.gotcha_prefix: "V2-G-"
    note: Rendered LAST and only after the model is proven. The operator-empathy /
      human-gate banners are NOT a ChromaControl exception — they render for every
      repo (Section 9, I4) and merely fire more often in hardware-test sessions.
  convergible_sandbox:
    mirror.github_is_complete_mirror: true
    execution.dispatch.enabled: true
    subsystems: all detected true; database_access_doc declared
    note: First render target. The master is built FROM this repo's four protocol
      files, so its first render should diff nearly zero apart from the Section 9
      additions and the per-reader split (P7), which its four files already resemble.
  convergible_final_and_future_repos:
    note: Born from the saas-starter template's baked-in config, so a new repo starts
      on the current master version with dispatch pre-wired except the Matt-only
      workflow-file step. The Convergible FINAL repo is cloned from the RENDERED
      saas-starter (RULING-001), so saas-starter renders first.

# =============================================================================
# 11. ROLLOUT ORDER (in sessions, not days)
# =============================================================================

rollout:
  - step: 1
    name: Committee review of this blueprint
    done_when: DONE 2026-09-04 — two passes, design closed at v1.2.
  - step: 2
    name: Lineage reconciliation (BLOCKING gate on step 3 — Board M2, reordered v1.2 N4)
    detail: >
      Runs BEFORE the master is built, because its output IS the master's content
      inventory — building first means building twice. CW reads all four legacy
      lineages (STANDARD 2026-08-08, SYNCLIPS-SYSTEM 2026-07-04, CHROMACONTROL v2
      2026-06-20/25, CONVERGIBLE-SANDBOX 2026-08-29/09-03) and produces
      master/LINEAGE_RECONCILIATION.yaml: every behavioral rule found in any lineage
      with exactly one disposition — folded (master block ID), knobbed (config
      field), or dropped (one-sentence reason). A rule with no disposition blocks
      the build. Matt reviews ONLY the dropped list, in plain English, one screen.
      This also sets the S4 ceiling number from the measured size of the folded set.
    done_when: The dropped list is read to Matt and he says go.
  - step: 3
    name: Build the master in forgeflow
    detail: >
      Create master/ with the artifacts in Section 4 — including render.py with
      stable block IDs, per-reader ordering and the block manifest, the profiles, and
      the evidence-count companion check — from the reconciled inventory of step 2.
      Add the legacy banners to the old forgeflow docs and repoint the README.
      Register the active repos.
    done_when: A cold CW session can read RENDER_PROCEDURE.md, run render.py, and
      render a repo.
  - step: 4
    name: Render repos — one at a time, repo and moment chosen by Matt (RULING-001, 2026-09-04)
    detail: >
      There is NO fixed repo order. Each render is its own session with its own
      explicit go, and no repo is rendered until Matt names it. The one ordering
      constraint: the Convergible FINAL repo is cloned from the already-rendered
      saas-starter, so saas-starter is rendered before it and the final repo is
      born on the master rather than rendered onto it. Everything the former
      per-repo steps required still applies WHEN a given repo's turn comes —
      convergible-sandbox needs its two prerequisites first (create
      .forge/protocols/repo-rules.yaml from the LR-163 items; rename the
      CC-reports/<ISSUE-ID>.md register entry to .forge/inbox/<run-id>.yaml) and
      the S6 dispatch canary must surface in three dispatched tasks, with the
      issue-body fallback if it does not; Synclips repos use the companion knob
      and the relay's PROTOCOL.md stays as-is; saas-starter bakes the config
      defaults and rendered protocols into the template; a repo lacking .forge/
      gets the initialization templates; dormant repos get a stamped, pinned copy;
      ChromaControl only when Matt reactivates it. drift_ci may be installed after
      the first proven render. Thought-box pointers and the forgeflow legacy
      cleanup happen whenever Matt chooses and gate nothing.
    done_when: Never "done" as a step — each render closes on its own session's go.

rollout_rule: >
  Each step is its own session with its own go from Matt. Step 2 blocked step 3.
  THE STOP POINT FOR THIS EFFORT IS THE END OF STEP 3 — both master protocol
  files written and a byte-stable render proven inside forgeflow. Nothing past
  that point happens until Matt names a repo (RULING-001, 2026-09-04).

# =============================================================================
# 12. RISKS AND DOWNSIDES (honest)
# =============================================================================

risks:
  - risk: >
      A renderer mistake propagates to every repo at once.
    mitigation: >
      Render convergible-sandbox first and diff-review; propagate to other
      repos only after one real session on the rendered copy; PR-per-repo by default
      so a bad render is reverted by closing PRs, not by editing many repos.
  - risk: >
      A wrong mirror flag renders a hard reset onto a repo with local-only work.
    mitigation: >
      Principle P4 — default false; the pre-refresh safety check remains in
      every rendered copy regardless of mode and stops on any dirty or unpushed state.
  - risk: >
      Rendered files get long and cross the reader's attention horizon.
    mitigation: >
      One rendered file per reader (P7) keeps runner-irrelevant blocks out of the
      dispatch file; P11 rule budget and prune cadence; compliance canary detects
      when the tail stops being read.
  - risk: >
      Wrap direct-write means CW is writing to repos more often; concurrent CC
      sessions could collide.
    mitigation: >
      Docs-only paths; CW asks about active CC sessions before any push;
      one wrap per repo at a time; PR delivery when a session is known to be running.
  - risk: >
      The master becomes a second forge of drift if repo copies get hand-edited
      "just this once."
    mitigation: >
      DO NOT EDIT header; drift flag at start; the rule that a copy bug is a
      master bug.
  - risk: >
      Over-engineering — a renderer and config schema for ~8 repos.
    mitigation: >
      render.py is ~200 lines run in CW's sandbox, not a CI system; the repo-facing
      config is a ~10-line profile + overrides (S2). If the active-repo count turns
      out to be two or three, dormant repos get a stamped, pinned copy and the
      propagation set is small by design (Section 13, open item).
  - risk: >
      Wrap direct-write turns transcription errors into EVAPORATION — an observation CW
      skims past leaves no trace (Board, worst seam).
    mitigation: >
      M1 observation inbox: CC's observations are written by CC, as a file, on its
      branch, before any prose; CW consumes files, not recollection. M4 evidence
      rule makes every wrap claim carry an ID or be marked unverified.
  - risk: >
      The protocol thickens until agents skim it (Board pre-mortem 1).
    mitigation: >
      P11 rule budget, prune session every 200 sessions, compliance canary.
  - risk: >
      Propagation quietly stops because dormant repos have no advocate (Board
      pre-mortem 3).
    mitigation: >
      Atomic propagation — current or pinned-with-reason, nothing in between; a bump
      that cannot finish is reverted.
  - risk: >
      ChromaQA 7.0 and the SEO/GEO tool may need knobs not anticipated here.
    mitigation: >
      Schema fields carry defaults so new knobs are additive; the
      propagation procedure exists precisely for this.

# =============================================================================
# 13. COMMITTEE QUESTIONS — RESOLVED IN v1.1, PLUS WHAT REMAINS OPEN
# =============================================================================

committee_resolutions:
  Q1: One rendered file per READER (P7). Not one-per-repo, not one-per-mode.
  Q2: Comment-fence render_when blocks stay, but resolved by render.py with stable block IDs and a manifest — the fences are now a machine format, not a discipline.
  Q3: Evaporation is the new failure mode; answered by M1 (inbox) + M4 (evidence rule). Manual fallback keeps the GitHub-web-edit form.
  Q4: Drift is pushed into the lagging repo's handoff at propagation time; no start protocol reads forgeflow.
  Q5: Mirror completeness is DECLARED, never inferred; shape and subsystem presence are detected; profiles carry the defaults.
  Q6: Subtree/submodule rejected — a shallow-clone runner cannot resolve them and they violate the standalone constraint.
  board_Q_code_execution: YES — CW has deterministic code execution alongside the GitHub MCP (confirmed 2026-09-04 by parse-validating this file in-session). M5 is in.
  board_Q_dispatch_reads_protocol: UNCONFIRMED — tested by the S6 canary in rollout step 3.
  board_Q_active_repo_count: >
    ANSWERED 2026-09-04 — 3 to 4: convergible-sandbox, the Synclips system, ChromaQA,
    plus the new Convergible final monorepo Matt is standing up within a day or two
    (migrating off convergible-sandbox). Consequence:
    the propagation set is small by design; dormant repos get a stamped, pinned copy
    and are not rendered (rollout step 7). The Radical's "you are building propagation
    machinery before knowing the population" objection is thereby answered: the
    population is four, and the machinery is a 200-line script plus a registry.

  board_S4_ceiling: SET 2026-09-04 (v1.4) from measured renders — Section 6, rendering.file_ceilings.

still_open:
  - drift_ci [VERIFY] — can a rendered repo's Action fetch forgeflow?

committee_questions_v1_0_for_the_record:
  - id: Q1
    question: >
      One rendered start file containing both LOCAL and DISPATCH sections (mode
      chosen per task inside the session), or two rendered start files as
      convergible-sandbox has today? Same question for the wrap. Our lean is ONE
      (Principle P7). Argue for or against.
  - id: Q2
    question: >
      Is comment-fence conditional rendering (`# >>> render_when:`) the right
      mechanism, or should the master be split into a core file plus include
      fragments that the renderer concatenates? (Note: the OUTPUT must be standalone
      either way; this is about master-side ergonomics only.)
  - id: Q3
    question: >
      Wrap direct-write moves the .forge/ documentation writes from Claude Code to
      Claude Web's GitHub MCP. What failure modes does that introduce that the
      runner-transcription model did not have, and how should the manual fallback be
      shaped?
  - id: Q4
    question: >
      The drift flag reads forgeflow/master/registered-repos.yaml at every session
      start — a cross-repo read. Is that an acceptable dependency, or should the
      rendered copy carry enough (e.g. master version only) to flag drift without
      reaching into forgeflow?
  - id: Q5
    question: >
      Which of the knobs in Section 5 should be DETECTED rather than DECLARED, and
      vice versa? In particular: should mirror completeness ever be inferred?
  - id: Q6
    question: >
      Is there a simpler design that achieves "fix once, land everywhere" without a
      renderer at all — e.g. git subtree/submodule of a shared protocol directory —
      and what does it cost against the standalone-file constraint and the
      shallow-clone dispatch runner?

# =============================================================================
# 14. GLOSSARY
# =============================================================================

glossary:
  CW: Claude Web — the planning/reviewing AI in claude.ai chat. Has GitHub, Supabase,
    Vercel MCP tools. Never edits application code.
  CC: Claude Code — the coding AI. Runs locally on Matt's machine or as Claude Code
    Action on a GitHub runner (dispatch).
  .forge/: Per-repo directory holding session state, backlog, bugs, history, GOTCHAS,
    rulings, handoff, specs, protocols, archive.
  handoff.yaml: The pass-the-baton "warning letter" from the outgoing session to the
    next. Primary briefing. first_thing names exactly one item.
  GOTCHAS.yaml: Append-only lessons learned per repo.
  rulings.yaml: Append-only register of decisions Matt has made, so no session re-asks.
  artifact register: Binding list of every file class a session may create, with its
    exact path. "Create an archive" without a path is forbidden.
  scope lock: The AUTHORIZED FILES ceiling and OFF-LIMITS list in every CC prompt.
  dispatch: Filing a CC task as a GitHub issue that Claude Code Action executes on a
    runner; CC pushes a branch, CW opens the PR, Matt approves the merge.
  relay: synclips-relay — a fourth repo holding cross-repo contracts, ripples
    (obligations between repos), open questions, and a state snapshot for the three
    Synclips-system repos.
  ChromaQA: Matt's project-agnostic quality-gate bolt-on; writes .chromaqa/*.jsonl
    telemetry; never installed by a protocol.
  canonical checkout: C:\Chromasmith\<repo-name> — the ONE local location per repo.
  hard reset vs gentle pull: The two refresh modes for a local checkout; hard reset is
    safe only when GitHub is a complete mirror.
  spike: Throwaway proving work outside the repo (ChromaControl Android/BLE), with an
    EMPTY authorized list.
  tombstone GOTCHA: A permanent warning entry never archived (e.g. the dead Termux plan).
  render: Producing a repo's standalone protocol copy from master + config.
  propagation: Re-rendering every registered repo after a master change.
