prioritized:
  - id: FF-009
    name: Propagate master v1.2.0 to the other six registered repos — first run of the one-prompt method
    priority: P1
    estimate: 1 session
    spec_ref: master/PROPAGATION_PROCEDURE.md; .forge/rulings.yaml RULING-013
    description: |
      Master v1.2.0 (54c1293) runs on forgeflow only (8ec708c, registry 67a91ee). seogeo, chromaqa
      and chromasmith-saas-starter are on v1.1.0 with the harness installed; synclips-platform,
      chromasync and dv-captain are on v1.0.0 with the secret set but no claude.yml and no
      protection. Steps: Claude Web renders all six in the sandbox (private repos from tree
      skeletons carrying the real claude.yml / CLAUDE.md / config), proves byte-stability and
      ceilings, records every blob SHA; ONE batch concurrency question to Matt; ONE local Claude
      Code run renders each repo at its canonical checkout, verifies against the supplied SHAs,
      commits one named-file commit per repo and pushes; Claude Web re-proves and writes the
      registry rows LAST. Repos without a harness render dispatch-off with S-092 unless Matt
      installs claude.yml + protection first. Closes FF-006 (and with it FF-003/FF-004).
    status: ready
    blocked_by: null
  - id: FF-011
    name: Master STEP 0 emits cmd.exe syntax; Claude Code on Surface 12 runs PowerShell / Git Bash
    priority: P2
    estimate: 1 master change (rides the next one)
    spec_ref: master/start-protocol.master.yaml (S-032, S-036); GOTCHA-011
    description: |
      S-032 and S-036 emit `cd /d`, `if not exist ... mkdir`, `del`, `copy /Y`, `rmdir /S /Q` and
      say the cmd forms are "safe there"; the FF-V120-MASTER run reported it had PowerShell and Git
      Bash only and translated every command. Switch STEP 0 and the completion steps to Git Bash
      syntax (`mkdir -p`, `cd`, `rm -f`, `cp -f`, `rm -rf`, forward slashes) and reword S-036.
      Also note the console renders the em-dash in render.py's success line as "?" — cosmetic.
    status: ready
    blocked_by: "lands inside the next master change, never alone (P11 — the start file is 55 lines from its ceiling)"
  - id: FF-010
    name: Pointer-URL protocols (repos hold a link to one master file) — PARKED
    priority: P3
    estimate: n/a
    spec_ref: .forge/rulings.yaml RULING-013
    description: |
      Matt's 2026-09-06 idea: instead of rendered copies, each repo carries a GitHub URL to the
      master (or a per-repo variant) and every reader fetches it at session start. Declined for
      now — a network fetch of an 80 KB file on the critical path of every session including
      runners, silent truncation risk, repeals the ratified standalone-in-repo rule. Revisit ONLY
      if the one-prompt propagation (FF-009) is still too slow in practice.
    status: deferred
    blocked_by: "FF-009 outcome"
  - id: FF-007
    name: convergible-sandbox FIRST render from master v1.1.0 (named by Matt, RULING-012)
    priority: P1
    estimate: 1 session
    spec_ref: master/RENDER_PROCEDURE.md; .forge/rulings.yaml RULING-012
    description: |
      Inspected 2026-09-05 and NOT up to spec: old four-file protocol set with different names
      (start-protocol-local.yaml, start-protocol-dispatch.yaml, end-protocol-local.yaml,
      end-protocol-dispatch.yaml), CC-reports/ still at the repo root with no .forge/inbox/,
      no .forge/repo-rules.yaml, claude.yml is the hand-written 2026-08-29 overlay (PG env,
      psql, bunx depcheck — KEEP it, do not replace with the generic asset), protection state
      unreadable through the connector. Order: concurrency question; Matt confirms protection
      (PR required, approvals OFF, bypass allowed); ONE Claude Code prompt moves CC-reports/ to
      .forge/inbox/ (git mv, named files) and writes .forge/repo-rules.yaml from the DOC-FOLD-1
      items in the sandbox handoff; config from the tree (standard, database_access_doc
      .forge/protocols/database-access.yaml, repo_rules_doc .forge/repo-rules.yaml,
      artifact_register true, vercel true, supabase true); render, push six files, DELETE the
      four old protocol files, prove bypass, registry row last.
    status: ready
    blocked_by: "FF-009 first (RULING-013: the v1.2.0 propagation lands before any first render, so the sandbox is rendered from v1.2.0 once, not twice)"
  - id: FF-006
    name: v1.1.0 rollout — remaining re-renders (synclips-platform, chromasync, dv-captain)
    priority: P1
    estimate: 3 renders
    spec_ref: master/RENDER_PROCEDURE.md step 0b; master/PROPAGATION_PROCEDURE.md
    description: |
      Secret CLAUDE_CODE_OAUTH_TOKEN already set on all three (2026-09-05). Each still needs:
      Matt pastes master/assets/claude.yml via the web editor (blob must equal 4cccfbf),
      Matt turns on classic branch protection on main (PR required, approvals OFF, bypass
      allowed), then Claude Web renders from the repo's CURRENT protocol-config.yaml knobs
      (synclips-platform: four monorepo overrides; chromasync: set build.python_interpreter;
