prioritized:
  - id: FF-027
    name: Doc-tightening template refinements, round two — lessons from the LeadDowser, seogeo and saas-starter reviews
    priority: P2
    estimate: one small change to two master files, like FF-026; lands before the next FF-021 dispatch
    spec_ref: master/assets/doc-tightening.issue.md; master/DOC_TIGHTENING_PROCEDURE.md; .forge/GOTCHAS.yaml GOTCHA-037..040
    description: |
      (a) ASCII and box-drawing diagrams (wireframes) are carried byte-for-byte apart from indentation, and
      the review compares every diagram line to the original (GOTCHA-038, LeadDowser PR #6 F1).
      (b) Every inventory mapping names one line; a line-range mapping is unverified until its exact text
      is found (GOTCHA-038, LeadDowser INV-054).
      (c) A rule converted into a prohibition keeps its id and name (GOTCHA-039, LeadDowser F4).
      (d) An instruction is never rewritten as a present-tense claim, and a "must" rule never as a
      description (GOTCHA-039: LeadDowser F6, saas-starter T7).
      (e) UNDECIDED and open items map to PROPOSED with no invented trigger; OPEN is not a status tag
      (GOTCHA-039: LeadDowser F7, seogeo S2).
      (f) The history companion receives cut reasoning and citations as well as provenance (LeadDowser F8).
      (g) Content absent from the source document is added only where a ruling states it, and the
      mapping cites that ruling (saas-starter T12, RULING-009).
      (h) A document's inbox mechanism (an append-only log) moved to the companion is replaced by a rule
      naming where new entries go (GOTCHA-040, saas-starter T1).
      (i) Claude Web's own issue text: a verification phrase sits on one line of the new text
      (GOTCHA-037).
    status: ready
    blocked_by: null
  - id: FF-010
    name: Pointer-URL protocols (repos hold a link to one master file) — PARKED
    priority: P3
    estimate: n/a
    spec_ref: .forge/rulings.yaml RULING-013
    description: |
      Matt's 2026-09-06 idea: instead of rendered copies, each repo carries a GitHub URL to the
      master (or a per-repo variant) and every reader fetches it at session start. Declined for
      now — a network fetch of an 80 KB file on the critical path of every session including
      runners, silent truncation risk, repeals the ratified standalone-in-repo rule. Revisit ONLY
      if the one-prompt propagation (FF-009) is still too slow in practice. It was not: two runs
      covered nine repos on 2026-09-07.
    status: deferred
    blocked_by: "FF-009 outcome — answered; revisit only if propagation becomes slow again"
  - id: FF-025
    name: Propagation diff check becomes a permanent tool, named in PROPAGATION step 3
    priority: P3
    estimate: rides the next master change
    spec_ref: master/PROPAGATION_PROCEDURE.md step 3; .forge/GOTCHAS.yaml GOTCHA-029
    description: |
      Run FF-V142-MASTER replaced per-repo sandbox renders of the eight private repos with a one-off
      checker (v142-diffcheck.py, blob aae8831b, on the deleted tmp/v142-apply) that proves each new
      render equals the committed copy plus only the intended lines. Make it a generic tool: render the
      repo with the previous master and the current master on the same tree and require the committed
      copy to equal the previous render; name it in step 3 as the method when the sandbox cannot clone a
      repo.
    status: deferred
    blocked_by: "the next master change"

