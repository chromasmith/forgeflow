      blob-SHA proof, proves bypass, updates the registry row. Order after FF-007 is Claude
      Web's choice (RULING-012). Closing FF-006 also closes FF-003 and FF-004.
      2026-09-06: these three re-renders now happen INSIDE the FF-009 propagation run (one
      prompt, all six repos); this item stays open only to track Matt's harness steps.
    status: in_progress
    blocked_by: "rides FF-009; Matt's claude.yml + protection on each repo decide dispatch on/off at render time"
in_progress:
  - id: FF-003
    name: Python validation knob that does not assume a .venv (and a two-language knob)
    priority: P2
    estimate: 1 master change
    spec_ref: master/start-protocol.master.yaml (S-082, S-083)
    description: |
      S-082 (py-compile) tells Claude Code to use .venv\Scripts\python.exe and "never
      system python", but chromasync and dv-captain run on the system Python312 on the
      canonical machine (no .venv there; dv-captain's Anvil daemons do have one). S-083
      (validation none) says "this repo has no build or interpreter step", which is false
      for dv-captain — it was rendered on that knob only because py-compile would have
      been worse. chromasync is Python + Next.js and no knob covers both halves; it kept
      the detected npm-build. Add an interpreter knob (or a py-compile variant that names
      the interpreter from config), reword S-083 to "no per-task validation step is
      configured", then re-render dv-captain and chromasync inside the next master change.
    status: in_progress
    blocked_by: "master half landed in v1.1.0 (b421783: build.python_interpreter knob, S-083 reworded); closes when chromasync and dv-captain are re-rendered (FF-006)"
  - id: FF-004
    name: ChromaQA debt read assumes committed telemetry; v6.1 repos gitignore .chromaqa/
    priority: P3
    estimate: 30 min
    spec_ref: master/start-protocol.master.yaml (S-014)
    description: |
      S-014 reads .chromaqa/CQA-debt.jsonl from GitHub and counts lines. chromasync (ChromaQA
      v6.1) gitignores .chromaqa/ entirely, so the read finds nothing and the debt check is
      silently vacuous; E-036/E-040/E-047 also describe the telemetry as committed. Either
      make S-014 say plainly that a gitignored .chromaqa/ means the debt read is not
      available on GitHub (and where to read it instead), or add a knob for the telemetry
      location. Land inside the next master change; re-render chromasync after.
    status: in_progress
    blocked_by: "master half landed in v1.1.0 (b421783: S-014/E-036/E-040 gitignored-telemetry wording); closes when chromasync is re-rendered (FF-006)"

