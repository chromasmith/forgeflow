# .forge/protocol-config.yaml — chromasmith/forgeflow
# Repo-facing knobs for rendering this repo's session protocols from the ForgeFlow master.
# forgeflow is the HOME of the master (master/) and is itself rendered from it: master/ is the
# source, .forge/protocols/ is the rendered output — no loop, because a render never reads
# .forge/protocols/. Edit these knobs, never the rendered files; re-render after a master change.
profile: docs-only
repo: { org: chromasmith, name: forgeflow }
north_star_doc: "master/BLUEPRINT.yaml"
ids:
  backlog_prefix: "FF-"

