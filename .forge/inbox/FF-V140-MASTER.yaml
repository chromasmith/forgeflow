gotcha_candidates:
  - >-
    Verifying a deleted branch with `gh api repos/OWNER/REPO/branches/NAME`
    exits non-zero on the expected 404, so chaining it after the delete with
    && makes a successful deletion look like a failed command - separate the
    two calls with a semicolon and read the 404 body as the proof.
