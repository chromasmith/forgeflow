gotcha_candidates:
  - id_hint: forgeflow / propagation
    line: >-
      A pre-refresh check that only counts `origin/main..HEAD` cannot tell a synced checkout
      from one that is BEHIND — both report 0. convergible was 8 commits behind while reading
      as clean. Always count both directions before calling a checkout safe.
  - id_hint: forgeflow / propagation
    line: >-
      Never `git reset --hard origin/main` in a repo where you have just committed a dirty
      file you were told to preserve — the reset discards it no matter what order you do it
      in. Use `git rebase origin/main`.
  - id_hint: chromaqa
    line: >-
      chromaqa's main is branch-protected ("Changes must be made through a pull request") and
      Matt's account bypasses it, so a direct push succeeds but prints a "Bypassed rule
      violations" warning. Expected on this repo, not a failure — but a session that treats
      it as an error will stop for no reason.
  - id_hint: convergible
    line: >-
      Every push of convergible runs the ChromaQA gate, which appends fresh lines to
      .chromaqa/CQA-debt.jsonl — so the working tree is ALWAYS dirty immediately after a
      successful push. That is the gate working. On 7.2+ those lines are new findings: read
      the diff and name them, do not commit them blind.
  - id_hint: convergible
    line: >-
