  - id: NR-1
    decided_by: Matt / Claude Web
    question: >-
      Is a propagation that lands 5 of 8 a violation of atomic_propagation
      (PROPAGATION_PROCEDURE section 7, "mostly propagated does not exist")?
    context: >-
      Section 3 says a renderer failure on ANY repo stops the pass BEFORE anything is
      pushed - but that gate is the sandbox pass, and it passed for all eight. Section
      5 then says a SHA mismatch is a HALT for THAT REPO and the run moves to the next
      one, and this prompt says the same in as many words. So the two halts here are
      the per-repo behaviour both documents specify, not a failure of the section 3
      gate. But section 7 still says a pass that cannot finish is REVERTED. Three
      repos are now behind: convergible on its pre-first-render state, chromaqa on
      v1.1.0, dv-captain on v1.0.0, while five are on v1.3.0.
    ruling_needed_on: >-
      Whether this is (a) a normal partial pass to be closed by a short follow-up run
      on the three, with the registry showing three rows lagging, or (b) a pass that
      must be reverted under section 7. My reading is (a) - section 7's revert is for
      a pass that cannot finish at all, and each of the three outstanding repos has a
      known, cheap, non-destructive path forward. I did not revert anything.
    my_action: none - nothing reverted, nothing forced

  - id: NR-2
    decided_by: Claude Web
    question: >-
      Should build.validation be DECLARED rather than detected for repos carrying a
      local-only .venv?
    context: >-
      See the dv-captain diagnosis. P3 says detection is for "what can be read off the
      repo tree", but which tree is not stated, and a local checkout and the GitHub
      tree are demonstrably different trees. Fixing this means editing either
      master/render.py or dv-captain's protocol-config.yaml knobs - both off-limits to
      this run, so nothing was changed.

  - id: NR-3
    decided_by: Matt
    question: >-
      Who owns the uncommitted .chromaqa/CQA-debt.jsonl lines in convergible, and
      should they be committed or reverted before convergible's first render?
    context: >-
      Ten appended debt lines from a local gate run on 2026-09-06. Under master
      v1.3.0's own 7.2 rule, a modified debt ledger after a push is a NEW finding to
      diff and name, never committed blind - which is exactly why this run did not
      touch it. The file is a wrap-only artefact and off-limits to this run either way.

# ---------------------------------------------------------------------------
# REFLECTION (verbatim)
# ---------------------------------------------------------------------------
reflection:
  q1_what_would_have_made_this_prompt_better: >-
    Two things. First, the prompt gave the forgeflow commit the sandbox rendered from
    (cbf591e) but not the per-repo origin/main SHA each target was rendered against.
    That asymmetry is exactly backwards for diagnosing a mismatch: the forgeflow side
    was trivially verifiable - I diffed cbf591e..HEAD and confirmed no render input had
    moved - while the target side, which is what actually broke, twice, was invisible.
    One extra column, "rendered against <repo>@<sha>", would have turned both halts
    from a ten-minute investigation into a one-line "the snapshot is stale, re-render".
    Second, the prompt asserts the render is deterministic and that any mismatch means
    render non-determinism, which is a master bug. That framing is too narrow and
    nearly sent me in the wrong direction: render.py's detect() reads the WORKING TREE,
    so a byte-identical master plus a byte-identical config can still render
    differently on two machines if the trees differ - which is precisely what happened
    on dv-captain, where an untracked .venv/ was the entire cause. The instruction
    would be better as "halt and diagnose whether the cause is the master, the config,
    or the tree" rather than naming one of the three in advance. Everything else - the
    file ceilings as context-only, the dispatch-off note for repos 6 to 8, the sandbox
    pre-rendering, the named-file commit discipline - was correct and saved real time.
  q2_gotchas_for_a_future_session: >-
    Yes, three, all recorded above in final line form. The load-bearing one: render.py
    detects from the local working tree, so a gitignored .venv/ (or .vercel/,
    supabase/, .chromaqa/, .seogeo/config.json, package.json) makes a local render
    disagree with a GitHub-tree render - different config_hash, different protocol
    text, identical master. A future session that hits this and takes the prompt's
    framing at face value will go looking for non-determinism in render.py and find
    nothing, because there is nothing there to find. The fast triage is the third
    gotcha: check the CLAUDE.md house block first - if it matches and only the .forge
    files differ, it is a detection difference, so go and compare the trees, not the
    code.
  q3_scope_disclosure: >-
    No - all changes stayed within the authorized scope. The only files created,
    modified or deleted in any repository are the ones enumerated under
    scope_disclosure above, and every one of them is named by the prompt's AUTHORIZED
    FILES list. No master/ file was touched, registered-repos.yaml was not touched, no
    workflow file was created or edited, no .chromaqa/ file was touched, no wrap-only
    file was touched, and no application source was touched. The .render-out scratch
    folder was created at the path the prompt named and deleted before the audit. No
    memory was written and nothing was written outside the repository trees.
  q4_artifact_paths: >-
    No. Every file written was at a path this prompt named explicitly. I created no
    file at a path of my own choosing.

# ---------------------------------------------------------------------------
# DEVIATIONS FROM MY APPROACH
# ---------------------------------------------------------------------------
deviations: >-
  None in process - the eight repos were attempted in the exact order given, each with
  the full pre-refresh safety check, render, SHA verification, named-file commit, push
  and VERIFY PUSH. One judgement call worth surfacing rather than smoothing over: for
  chromaqa I stopped short of PROVING the artifact-register diagnosis. Proving it would
  have meant rendering against a tree without that file, which meant either creating a
  scratch tree or checking out an old commit of chromaqa - the first breaks the file
  creation rule, the second mutates a checkout this run had no authority to mutate. I
  judged a well-evidenced hypothesis, clearly labelled as unproven, to be worth more
  than a proof obtained by stepping outside scope. Claude Web can settle it in the
  sandbox in one render.

