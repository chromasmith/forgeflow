# ---------------------------------------------------------------------------
# GOTCHA CANDIDATES - final line form
# ---------------------------------------------------------------------------
gotcha_candidates:
  - id_suggestion: GOTCHA-render-local-tree-vs-github-tree
    severity: high
    proven: true
    line: >-
      render.py detect() reads the WORKING TREE, so a gitignored local-only directory
      changes the render: dv-captain's untracked .venv/ sets build.validation
      "py-compile" locally while a GitHub-tree render leaves it "none" - different
      config_hash, different protocol text, same master. Sandbox SHAs and local SHAs
      only agree when the local checkout has no local-only detection inputs (.venv/,
      .vercel/project.json, supabase/, .chromaqa/, .seogeo/config.json, package.json).
      Declare the field in the repo's config to stop it recurring.

  - id_suggestion: GOTCHA-propagation-sha-table-goes-stale
    severity: high
    proven: high-confidence, not proven in-session
    line: >-
      A propagation SHA table is only valid against the repo snapshot it was rendered
      from. chromaqa gained .forge/protocols/artifact-register.yaml at cfdfdf7 on
      2026-09-06, flipping subsystems.artifact_register false to true, so every SHA in
      the prompt's chromaqa row was stale by the time the local run refreshed to
      origin/main. Record the per-repo origin/main SHA the sandbox rendered against
      alongside the blob SHAs, so a mismatch is diagnosable in one command instead of
      being mistaken for render non-determinism.

  - id_suggestion: GOTCHA-house-block-isolates-the-diff
    severity: medium
    proven: true
    line: >-
      When a propagation render mismatches, check the CLAUDE.md house block FIRST. If
      the house block matches and only the .forge files differ, the cause is a
      detection-field difference (the tree), not the renderer and not the master. Both
      halts in PROPAGATE-v1.3.0 had this exact signature.

