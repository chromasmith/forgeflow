        expected: 59fdec54799332f19767c823d6cd2e293597d96e
      - file: .forge/protocols/end-protocol.yaml
        got:      7662336d9e96d34f61bdd2e1029a7f8542c35b40
        expected_verbatim_from_prompt: 69c7b4f04ce6a410ce5a418c78e76b286665523
      - file: CLAUDE.md house block
        got:      b90a44453a40860003da0a52e408905f6e1cfb9d
        expected: b90a44453a40860003da0a52e408905f6e1cfb9d
        status: MATCH
    prompt_defect_noted: >-
      The dv-captain end-protocol.yaml expected value in the prompt's table is 39 hex
      characters (69c7b4f04ce6a410ce5a418c78e76b286665523), not the 40 a git blob SHA
      has. It is recorded above exactly as the prompt wrote it, with no repair
      attempted. It made no difference to the outcome - this repo halted on the
      config_hash and on the two files whose expected values are well formed - but it
      should be corrected when the SHA table is reissued.
    diagnosis: >-
      PROVEN, and again not a master bug. dv-captain's canonical checkout contains a
      local, gitignored .venv/ directory (.gitignore line 7, confirmed with
      git check-ignore, and confirmed untracked with git ls-files). render.py's
      detect() treats (tree/".venv").exists() as evidence of a Python project and sets
      build.validation to "py-compile". The GitHub tree has no .venv - it does not
      appear in git ls-tree origin/main - so the Claude Web sandbox render, built from
      the GitHub listing, left build.validation at its default "none". That single
      field changes the config_hash and the rendered protocol text. The house block
      matches exactly, which is consistent: the house block does not carry that field.
      This is a real and repeatable divergence between rendering against a local
      working tree and rendering against the GitHub tree, and it will recur on any
      repo carrying a gitignored .venv/, .vercel/ or similar local-only path.
    recommended_next: >-
      Two options for Claude Web, both cheap. (a) Accept the local reading - a Python
      repo with a .venv genuinely is py-compile-validatable - and reissue the SHA
      table rendered against a tree that has .venv, i.e. adopt config_hash
      55f18235af3c. (b) Declare it, so the two renders agree regardless of where they
      run: set build.validation explicitly in dv-captain's protocol-config.yaml
      overrides, which makes the field declared rather than detected and removes the
      local/remote divergence for good. Option (b) is the one that stops this
      recurring, and it matches P3's own stance that only what can be read off the
      tree should be detected.

