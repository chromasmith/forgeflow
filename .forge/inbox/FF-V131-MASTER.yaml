deviation_from_prompt:
  - id: CONVERGIBLE-REFRESH
    prompt_said: >-
      "because of it convergible is refreshed with `git rebase origin/main`, NOT a
      hard reset"
    what_happened: >-
      git rebase origin/main REFUSED to run: "error: cannot rebase: You have
      unstaged changes. error: Please commit or stash them." The same prompt
      forbids committing or discarding that unstaged file (.chromaqa/CQA-debt.jsonl,
      trap CV-T9), so the two instructions cannot both be obeyed as written.
    what_i_did_instead: >-
      git merge --ff-only origin/main. First confirmed with `git diff --name-only
      HEAD origin/main` that the two incoming commits touch only
      .forge/inbox/VERCEL-LINK-1.yaml, so the fast-forward could not disturb the
      dirty file. With ahead=0 a fast-forward merge produces a byte-identical
      result to a rebase, so the intent of the instruction is preserved exactly.
      Result: HEAD 6b08096 -> 34ab2bd, ahead 0 / behind 0, CQA-debt.jsonl still
      modified and untouched.
    recommendation: >-
      Future propagation prompts should say `git merge --ff-only origin/main` for
      any repo expected to arrive with a dirty working tree. `git rebase` cannot
      run against unstaged changes at all, so the instruction as written can never
      succeed in convergible.

