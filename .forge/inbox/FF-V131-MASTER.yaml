gotcha_candidates:
  - id_suggested: FF-GOTCHA-CANDIDATE-A
    line: >-
      convergible cannot be refreshed with `git rebase origin/main` — git refuses to
      rebase with unstaged changes, and .chromaqa/CQA-debt.jsonl is always unstaged
      there (CV-T9). Use `git merge --ff-only origin/main`; with 0 local commits the
      result is identical.
  - id_suggested: FF-GOTCHA-CANDIDATE-B
    line: >-
      In Git Bash, a Windows path written with backslashes inside double quotes eats
      a following shell variable — "C:\Chromasmith\$R" expands to the literal
      C:\Chromasmith$R because the backslash escapes the dollar. Use forward slashes
      (C:/Chromasmith/$R) in any propagation loop that builds paths from a variable.
      Failed harmlessly here (cd errored, no file was written), but it would silently
      write to the wrong place in a script that used `>` instead of `cp`.
  - id_suggested: FF-GOTCHA-CANDIDATE-C
    line: >-
      render.py's console output prints the em-dash in "rendered 6 files to ... —
      master v1.3.1" as a replacement character under the Windows console codepage.
      Cosmetic only; the rendered FILES are correct LF UTF-8 and every blob SHA
      matched. Do not "fix" it by touching render.py.

needs_ruling: []

reflection:
  q1_what_would_have_made_this_prompt_better: >-
    One line: the convergible refresh command. `git rebase origin/main` cannot run
    against the unstaged CQA-debt.jsonl the same prompt tells you to leave alone, so
    that instruction is self-cancelling; `git merge --ff-only origin/main` is what it
    should say. Everything else was complete — the expected blob SHAs for all 54
    rendered files, the apply-script hash, the exact commit messages and the explicit
    "this deliberately widens scope, do not halt" note all did their job, and the
    run needed no judgement calls beyond that one.
  q2_gotchas_for_a_future_memoryless_session: >-
    Three, all recorded above as gotcha candidates: the convergible rebase-vs-ff-only
    trap; the Git Bash backslash-eats-the-next-variable trap when building Windows
    paths in a loop; and the cosmetic em-dash mojibake in render.py's console output,
    which is not a rendering fault and must not be chased. Also worth knowing: a
    "Bypassed rule violations ... Changes must be made through a pull request" line on
    a SUCCESSFUL push is branch protection letting Matt's own account through — it
    appeared on forgeflow, chromasmith-saas-starter, convergible-sandbox, seogeo and
    chromaqa and is not an error.
  q3_scope_disclosure: >-
    No — all changes stayed within the authorized scope. See scope_disclosure above
    for the full file-by-file list.
