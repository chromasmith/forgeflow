gotcha_candidates:
  - "A clean canonical checkout is NOT a current one — seven of nine were behind origin on 2026-09-10, one by 14 commits, all clean. Since render.py reads the working tree for detection, a skipped refresh can shift config_hash and halt a propagation on a gate that is not really failing. Always refresh before rendering, even when git status is empty."
  - "PROPAGATION_PROCEDURE.md step 5 mandates a per-file `git hash-object` comparison against sandbox SHAs; the v1.4.0 delivery prompt substituted a byte-stable double render plus the config_hash gate. Both are valid proofs of determinism but the procedure text does not sanction the substitution — reconcile the two, or a future run reads the prompt as skipping a protocol step and halts."
  - "chromasync and dv-captain have no rulings register in either shape — no .forge/rulings.yaml and no .forge/rulings/ directory. 'sharded' and 'never had one' are different states and the registry cannot currently tell them apart."

