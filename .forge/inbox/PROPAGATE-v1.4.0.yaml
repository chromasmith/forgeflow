surprises:
  - "Every one of the nine local checkouts was clean and on main, but seven of the nine were BEHIND origin — chromasmith-saas-starter by 3, convergible by 1, convergible-sandbox by 3, seogeo by 4, synclips-platform by 2, chromasync by 3, LeadDowser by 14. No repo had a local commit and no repo had a dirty tree, so no STOP was triggered; the refresh was the cure in every case. Worth noting only because a run that skipped the refresh would have rendered against stale trees, and a stale tree is a detection input (GOTCHA-013/014)."
  - "Not one ChromaQA ledger showed as modified after any push in this run, so the FF-016 / S-033 dirty-tree ff-merge path was never needed. Every one of the nine trees was clean before and after."
  - "convergible-sandbox's config_hash moved from 75e4a365bd50 to f29646f90fe2, exactly as the prompt's change-gate required, and S-005 appears in the rendered block manifest — so the repo-rules document is now binding on every session in that repo."
  - "Two repos (chromasync, dv-captain) have no rulings register at all — neither a .forge/rulings.yaml nor a .forge/rulings/ directory. The prompt anticipated a missing single file but the registry does not distinguish 'sharded' from 'never had one'; Claude Web may want to record that distinction when it writes the registry."

reflections:
  what_would_have_made_the_prompt_better: |
    Nothing material was missing — the prompt was executable end to end without a single decision
    left to me. Three small things would have saved a little time or a little doubt:

    (1) The prompt's validation method and PROPAGATION_PROCEDURE.md step 5 do not describe the
    same check. Step 5 says to compare the `git hash-object` SHA of every rendered file against
    per-file SHAs Claude Web supplied in the prompt; this prompt supplied no per-file SHAs and
    substituted a byte-stable double render plus the config_hash gate. I followed the prompt,
    because PRECEDENCE gives the protocol process and the prompt the WHAT, and the substituted
    check is at least as strong (it proves determinism directly rather than by comparison against
    a sandbox that rendered elsewhere). But a reader could reasonably have read that as the prompt
    skipping a protocol step, which is a HALT condition. One line saying "the double render
    replaces step 5's per-file SHA comparison this pass, because the sandbox SHAs were not
    captured" would remove the ambiguity entirely.

    (2) The commit message the prompt dictates differs from the one step 5 dictates — the prompt
    appends "+ rulings register sharded (Claude Code run PROPAGATE-v1.4.0)". That is plainly the
    intended v1.4.0 form given step 5b, but the two texts sitting side by side in two authoritative
    documents invites a needless pause.

    (3) The prompt says to drop the shard clause where a repo has no register, which I did for
    chromasync and dv-captain, but did not say whether a repo might have NEITHER file NOR directory
    (as opposed to an already-sharded directory). Both cases end at the same action, so nothing was
    blocked; naming the third case would make the branch airtight.

  future_session_traps: |
    Nothing new that would break a future run, and one thing worth writing down.

    The thing worth writing down: seven of nine canonical checkouts on this machine were behind
    origin, one of them by fourteen commits, and every one of them was clean — so no safety check
    fired. Rendering reads the working tree for detection (GOTCHA-013/014), which means a run that
    trusted a clean tree and skipped the refresh could have produced a legitimately-different
    config_hash from a stale tree and then halted itself on a gate that was never really failing.
    The refresh is not a formality on this box; it is the thing that makes the hash gate mean
    anything. The prompt already ordered it first, which is why nothing went wrong.

    Two smaller notes. shard_rulings.py prints Windows-mixed paths (forward slashes for the part
    you passed it, a backslash before the shard filename) — cosmetic, not a defect, but it does not
    round-trip as a copy-pasteable path. And the em-dash in every rendered line and in the
    renderer's own output prints as "?" in this console; that is the console font, already known,
    and the SHAs are the proof.

  scope_disclosure: |
    No — all changes stayed within the authorized scope. Files touched, by repo, are listed under
    scope_disclosure below. Nothing outside the AUTHORIZED FILES list was modified, created or
    deleted in any of the ten repositories; the one scratch directory named by the prompt was
    created under the Windows temp folder and removed at STEP C; nothing was written to memory or
    to any path outside these trees.

  artifact_paths: |
    No. Every file this run wrote is at a path the prompt named explicitly: the six rendered files
    and the rulings shards in each target repo, .forge/protocols/artifact-register.yaml in
    convergible-sandbox, and .forge/inbox/PROPAGATE-v1.4.0.yaml in forgeflow. The shard filenames
    beyond 001-020.yaml (021-040, 041-060, 061-080) were named by the prompt's pattern and chosen
    by shard_rulings.py, not by me.

