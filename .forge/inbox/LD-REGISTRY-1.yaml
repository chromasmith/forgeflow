      the LeadDowser block verbatim to the very end of the file, after the
      chromasmith/convergible row's notes block, at the same two-space list
      indentation as every other row. Diff is 36 insertions and 1 deletion in one
      file — the 1 deletion is the replaced master_version_current line.
    validation: >-
      python -c "import yaml;d=yaml.safe_load(open('master/registered-repos.yaml'));
      print(len(d['repos']),'rows;last:',d['repos'][-1]['repo'])" printed
      "10 rows;last: chromasmith/LeadDowser" — the exact required output. The file
      also still has zero carriage returns (grep -c $'\r' = 0), so it stayed LF as
      the house line-ending convention requires.

