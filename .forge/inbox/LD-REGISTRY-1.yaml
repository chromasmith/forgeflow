      readiness check and explicitly forbidding `op whoami`, spelling out that
      `.Trim()` is not optional and why, and giving the exact expected output of
      the YAML parse ("10 rows;last: chromasmith/LeadDowser") so success was a
      string comparison rather than a judgement call. The two edits were quoted
      literally, so there was no interpretation step and no room for me to
      paraphrase the registry's own wording.

