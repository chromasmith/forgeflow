# .forge/rulings.yaml — chromasmith/forgeflow
# Append-only register of decisions Matt has made about the ForgeFlow Master effort,
# so no future session re-asks them. Search here BEFORE putting any question to Matt.
# Format: one entry per ruling; never rewrite or soften an entry — supersede it with a new one.

# Shard 021-040.yaml of the rulings register — twenty rulings per file; the newest shard takes appends. Other shards live beside this one in .forge/rulings/.
rulings:
  - id: RULING-021
    date: 2026-09-09
    subject: Tenth repo to render from the ForgeFlow Master — chromasmith/LeadDowser, a first render on a bare repo deliberately NOT spawned from the SaaS starter template
    ruling: >-
      chromasmith/LeadDowser is the TENTH repo rendered from the master, in its own session with
      its own go ("The repo is called LeadDowser"; "You have full access"). It was NOT spawned
      from chromasmith-saas-starter — Matt states that was a deliberate choice — so it inherits
      no config, no rendered protocols and no CLAUDE.md house block, and its config is written
      from what the tree shows (GOTCHA-003), never from the template's baked defaults. Tree at
      this ruling: README.md plus a documentation-only .forge/ (README.md,
      strategy/leaddowser-blueprint.yaml, specs/leaddowser-convergible-interface.yam,
      instructions/README.md, scanlab/README.md); no package.json, no CLAUDE.md, no
      .github/workflows/, no .chromaqa/, no .seogeo/, no vercel.json, and none of the .forge/
      state family (handoff, rulings, session-state, backlog, active-bugs, session-history,
      GOTCHAS, inbox). Profile standard — a product repo whose app is not yet scaffolded, not a
      docs repo — so build and deploy detect as none today and the repo is re-rendered once the
      app scaffolding lands; north_star_doc = .forge/strategy/leaddowser-blueprint.yaml; backlog
      prefix LD-. EXISTING DOCUMENTATION IS PRESERVED: Matt's instruction is that nothing already
      in the repo is damaged, deleted or overwritten by this install. The render adds files and
      seeds the missing .forge/ state family beside the existing docs; any relocation or rename
      of an existing document is a separate named action he approves first, never folded into a
      render commit. Concurrency (Matt, this session): no Claude Code session on LeadDowser and
      no other Claude Web session mid-render. The dispatch harness (RENDER_PROCEDURE step 0b)
      is installed BEFORE the render so the repo joins dispatch-ON in one trip.
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, in this session, recorded in the turn it was made per W-002
  - id: RULING-022
    date: 2026-09-09
    subject: Branch protection is added with "Require a pull request" ON and "Require approvals" UNTICKED
    ruling: >-
      RULING-011 established what branch protection is for — guarding main against runners while
      administrators bypass — but never said what to tick. Installing it on
      chromasmith/LeadDowser exposed the gap: GitHub pre-ticks "Require approvals" (1) the
      moment "Require a pull request before merging" is enabled, and that setting deadlocks
      the whole model, because Matt cannot approve his own pull request and Claude Web opens
      every runner PR acting as Matt. It is harmless only while the administrator bypass
      holds; the day "Do not allow bypassing the above settings" is ever ticked, or a second
      collaborator changes the calculus, no pull request in the repo can be approved by the only person
      who works in it. THE HOUSE SETTING, for every current and future repo on the master:
      classic branch protection on the default branch, "Require a pull request before merging"
      ON, "Require approvals" UNTICKED, "Do not allow bypassing the above settings" UNTICKED.
      The merge gate is Matt's yes in chat, never a GitHub approval — Claude Web authored the
      contents, so a GitHub approval would be a signature on its own work. Recorded as a
      back-fill at the wrap rather than in the turn it was made, which is a W-002 miss; the
      decision itself was Matt's, taken when he applied the recommended settings. The nine
      repos protected before today were configured by hand and are NOT known to have been
      checked against this; auditing them is not filed as work, because the bypass makes it
      harmless until someone tightens it. master/RENDER_PROCEDURE.md step 0b is amended to
      carry this as FF-019.
    supersedes: nothing — RULING-011 stands; this fills in the settings it left unstated
    stated_by: Matt, in chat, in this session, by applying the recommended protection settings on chromasmith/LeadDowser after Claude Web named the deadlock
  - id: RULING-023
    date: 2026-09-10
    subject: Branch deletion is automated — Claude Code deletes transport branches via the GitHub REST API; runner branches auto-delete on merge; Matt never deletes a branch by hand
    ruling: >-
      Matt reported constant friction from being asked to delete branches in the browser, a
      chore that arrived with two new standards: the tmp/ transport branch of the apply-script
      landing route (GOTCHA-009) and the per-run branches dispatched runners push. Neither
      Claude could do it — the GitHub connector has no branch-delete tool, and Matt's global
      pre-push guard on Surface 12 (main-only-guard.sh, GOTCHA-010) rejects a git branch
      deletion as a push to a non-main branch. Matt asked for a procedure so it never needs to
      be manual, conditional on his code being at risk in no way; Claude Web confirmed it is
      safe: a branch delete removes a pointer only, the transport branch is deleted only after
      the apply run has pushed to main and proven every blob SHA, a runner branch auto-deletes
      only after its PR is merged, and GitHub refuses to delete the default branch (branch
      protection blocks it a second time). THE RULING: (1) every prompt that uses a tmp/
      transport branch ends by having Claude Code delete it with
      gh api -X DELETE repos/chromasmith/<repo>/git/refs/heads/tmp/<name> — a REST call, not a
      git push, so the pre-push guard is never touched and never bypassed — and verify the
      branch is gone; (2) the repository setting "Automatically delete head branches" is
      enabled on every repo on the master, set through gh api, so runner branches disappear at
      merge; (3) GOTCHA-010's "Matt deletes it in the browser" instruction is retired, and
      RENDER_PROCEDURE, PROPAGATION_PROCEDURE and the apply-prompt template carry the new steps.
      Landing rides the laundry-list plan of this session.
    supersedes: the "Matt deletes the branch in the browser" step recorded in GOTCHA-010 and in S-007's large-file lane wording
    stated_by: Matt, in chat, in this session ("If that's a safe thing to do... we should do this for sure"), recorded in the turn it was made per W-002
  - id: RULING-024
    date: 2026-09-10
    subject: TOOLS FIRST — Claude Web assumes an autonomous tool path exists for every third party and reaches for it before designing any manual step; secrets come from the 1Password CLI, never from a hand-built pipeline
    ruling: >-
      Matt's friction, in his words: when a build needs env vars or secrets, Claude "immediately
      starts designing an elaborate system to get my passwords into whatever build we're working
      on", and he does not find out until significant planning has happened; he has to remember
      to say he has a 1Password CLI. Likewise he repeatedly has to remind sessions that he has an
      extensive set of MCP, CLI and API tools for the parties he works with (a Cloudflare session
      spent a long argument before conceding the tools existed, and then became easy). THE
      STANDING ORDER, protocol text in the start master and the CLAUDE.md house block so Claude
      Code inherits it: (1) it is ALWAYS assumed that Matt has a third-party connection — a
      connector, MCP server, CLI or management API — for any service a task touches; working
      through autonomous tools is his default and the first line of work; (2) before proposing
      any manual step, dashboard click, or hand-built mechanism, Claude Web checks the live tool
      list of its own session and Claude Code's known CLIs, and names the tool it will use; (3)
      SECRETS: every key, token and credential is sourced from the Chromasmith Keys vault via the
      1Password CLI (op read) by Claude Code, or from where it already lives (a neighbouring
      service's .env); Claude Web never designs a secret-transfer mechanism and Matt never
      handles a secret; (4) if no tool path is known, the deep dive to find one (docs, MCP
      registry, vendor CLI) happens BEFORE any manual plan is written; (5) every live-run
      proposal states up front which steps have a tool path and which do not, so Matt can weigh
      the manual friction before saying go; (6) the inventory floor named in the protocol is
      1Password CLI, GitHub (MCP + gh), Cloudflare, Vercel, Supabase, Google Workspace (Gmail,
      Drive, Calendar), PostHog and Todoist — not exhaustive, and the session's own connector
      list is authoritative because the landscape changes daily. Promotes Matt's 2026-09-09
      "automate before hand-holding" rule from Claude Web's memory into repo text (P8).
      Landing rides the laundry-list plan of this session (master v1.4.0).
    supersedes: nothing — S-039 (tool_capabilities) is expanded, not replaced; the live-run secrets clause of S-049 is reaffirmed and generalized
    stated_by: Matt, in chat, in this session ("I just want this to be part of the standard operating procedure where Claude Web reaches for these tools and doesn't forget about them"), recorded in the turn it was made per W-002
  - id: RULING-025
    date: 2026-09-10
    subject: NOTHING IS LOST IN THE CHAT — the wrap ends with a RESIDUE SWEEP that maps every decision, observation and open thread from the session to a committed file, and "I'll remember" is a forbidden phrase
    ruling: >-
      Matt's requirement, in his words: "I am adamant that when I finish a session that
      nothing be lost in the ephemeral chat. Everything must be saved to GitHub, which must
      always be the single source of truth." The friction: wraps report done, and when he
      asks whether everything is saved, roughly half the time the session admits items exist
      only "in my memory" or says the next session "will remember" to do something. Claude
      Web's diagnosis, accepted: "memory" there is Claude Web's private side channel, which
      this protocol already calls no source of truth and which Claude Code can never read;
      the wrap has no final step asking what surfaced in the chat that is not yet in a
      committed file; oversized files get deferred instead of taking the E-002 apply lane;
      and "done" is declared when the last numbered part lands rather than when the chat has
      been emptied into the repo. THE RULING, master text in the end protocol (v1.4.0):
      (1) RESIDUE SWEEP — before the handoff's final part, Claude Web enumerates every
      decision, ruling, observation, plan, deferred item and open thread that surfaced in the
      session and maps each to the committed file and SHA that now holds it; anything unmapped
      is written before wrap_complete: true, with the handoff's watch_out_for and next_up as
      the catch-all for items that fit no other file; (2) the wrap closes with a specific
      attestation, in plain English, that everything from this chat is on GitHub at the named
      HEAD and nothing lives only in this chat or in Claude Web's memory; (3) a
      "chat residue: 0" count joins the verified/unverified evidence counts in the final wrap
      commit message, and a nonzero residue means the wrap is not complete; (4) the phrases
      "I'll remember", "it's in my memory" and "the next session will remember" are named as
      protocol violations — a thing the next session must do is written into the handoff's
      first_thing or next_up, or committed, never remembered; (5) a file the connector cannot
      write is delivered by the E-002 apply lane in the same wrap, never deferred to a later
      session (see the E-001 exception fix on this session's list).
    supersedes: nothing — E-002 and E-030 are extended; the "memory is a side channel" wording of S-009/W-002 is reaffirmed with an enforcement step
    stated_by: Matt, in chat, in this session ("This is not okay... Everything must be saved to GitHub"), recorded in the turn it was made per W-002
  - id: RULING-026
    date: 2026-09-10
    subject: Claude Web reply SHAPE — BOTTOM LINE is the first line, Matt's actions live once in a ruled "YOUR MOVE" block, detail only below
    ruling: >-
      Matt's chronic friction, in his words: he spends about 30 percent of his interactions
      asking Claude to "bottom line it"; like an LLM reading a long document he attends to the
      start and the end and skips the middle, and he wants his actions — his verbs — in a
      visually identifiable form he can scan for. Claude Web's recommendation, accepted ("let's
      give it a shot"): a fixed reply SHAPE, because a template the model must fill sticks
      where a length rule drifts. THE SHAPE, protocol text in W-001 and the CLAUDE.md house
      block (v1.4.0): (1) every Claude Web reply opens with the line "**BOTTOM LINE:**" in bold
      caps followed by ONE sentence — what happened, what it means for Matt, the way around;
      (2) any action Matt must take appears exactly once, in a block set off by horizontal
      rules above and below, headed "**▶ YOUR MOVE:**" in bold caps, stating one action as an
      imperative verb and nothing else; actions are never buried in prose; (3) when Matt has no
      action the block is ABSENT — silence remains the pass state, and an empty block is noise;
      (4) technical detail, reasoning and alternatives come only BELOW those two elements and
      stay within the four-sentence ceiling and its named exceptions (W-001); (5) the Session
      Context Summary keeps its own eight-line shape and the canary on line one — its first
      line is its bottom line. This is Claude Web's counterpart to Claude Code's mandatory
      plain-text MATT — YOUR TURN banner (S-049): same purpose, the visual forms the chat can
      render (bold, caps, rules). The chat renders Markdown only — no colour, no highlight,
      no font size beyond headers — so bold caps between rules is the strongest signal
      available and is the house standard.
    supersedes: nothing — extends W-001 (RULING-019) with a structural shape; the four-sentence ceiling, layering and lead-with-the-recommendation rules are unchanged
    stated_by: Matt, in chat, in this session ("Great, let's give it a shot"), recorded in the turn it was made per W-002
  - id: RULING-027
    date: 2026-09-10
    subject: The PROPORTIONAL WRAP — a light wrap tier for small sessions; the wrap writes only the .forge/ files that changed, with the handoff and a session-history entry as the floor
    ruling: >-
      Matt raised the cost of ceremony at the system level: he believes his methods win in
      aggregate but worries about the trade-offs, and the wrap is the most expensive act in his
      day — a nine-part series that a small session does not deserve. He accepted Claude Web's
      light-wrap concept ("I love the idea... we should move forward with that if you are
      prepared to conceive it and implement it in the next version"). THE RULING, master text in
      the end protocol (v1.4.0), Claude Web conceives the exact mechanics: (1) the wrap is
      PROPORTIONAL — after the residue sweep (RULING-025) Claude Web computes which wrap files
      hold something new this session and writes ONLY those; (2) the FLOOR is two parts that
      never drop: .forge/handoff.yaml (rewritten every session — it is the next session's
      briefing, staleness stamp and wrap_complete flag) and one appended .forge/session-history.yaml
      entry; (3) session-state, backlog, active-bugs, GOTCHAS, CHANGELOG, rulings (already
      written when made, W-002), the registry and inbox consumption are written only when they
      changed, and every skipped file is NAMED as "unchanged" in the wrap report so a skip is
      visible, never silent; (4) the safety mechanics are identical in both tiers — SHA-guarded
      single-file commits, handoff first with wrap_complete: false when more than one further
      part follows (a two-part light wrap writes the handoff once, last, with wrap_complete: true),
      the evidence counts, the residue sweep and its attestation, the "chat residue: 0" count;
      (5) Claude Web states the tier and its reason in ONE line before the first write ("Light
      wrap: one docs commit this session, only handoff and history change" / "Full wrap: N files
      changed"); the tier is Claude Web's route call, not a question to Matt; (6) a light wrap
      still closes with the overall project position sentence. Rationale recorded: the friction
      Matt brings is concentrated in wrap mechanics, not in the ceremony's substance (GitHub as
      truth, scope lock, handoff, rulings, inbox), so the relief is proportionality, not cutting
      rules; the P11 prune session remains the instrument for the start protocol's size.
    supersedes: E-002/E-003's fixed full manifest as the only wrap shape — the manifest becomes conditional with a two-part floor; nothing about write discipline or evidence changes
    stated_by: Matt, in chat, in this session ("I love the idea of a light wrap... we should move forward with that"), recorded in the turn it was made per W-002
  - id: RULING-028
    date: 2026-09-10
    subject: TWO DOCUMENT STANDARDS in the master — the blueprint standard for every instructional document, a lean RECORD standard for the .forge/ state files — and legacy repos are tightened afterwards by dispatched cleanup runs gated on a rule inventory
    ruling: >-
      Standards (master v1.4.0, rendered into every repo): (1) INSTRUCTIONAL documents —
      blueprints, specs, plans, guides, READMEs, instructions, procedures — obey
      master/blueprint-standard.master.yaml (rules, decisions, prohibitions, dependencies, open
      items only; history in a companion file; 50 KB smell); (2) RECORD files — handoff, rulings,
      GOTCHAS, session-history, backlog — obey a RECORD standard: one fact per line, one
      identifier and one date, the why only when it is itself a rule or a trap, no narrative,
      no who-thought-what, no quotations. Both standards are protocol text (start rule for any
      prompt that creates or amends a document, wrap check that flags provenance prose or a
      size smell, one house-block line so Claude Code inherits them). Legacy cleanup: after
      v1.4.0 propagates, each repo's existing documents are tightened by a DISPATCHED run from a
      master template (master/assets/doc-tightening.issue.md rendered per repo), up to three
      repos in parallel, on Matt's schedule; the run first inventories every rule, decision,
      prohibition and open item in the original and the rewrite is accepted only when every
      inventory line maps to the new document; cut narrative moves to a companion history file;
      Claude Web reviews the PR against the inventory; Matt's only action is the merge. A local
      Claude Code prompt is the fallback lane. EXCEPTION: existing rulings entries are never
      rewritten (append-only register); they are sharded (item 7 of this session) and the record
      standard applies from RULING-028 onward. Order: standards first, propagation, then
      cleanups; the P11 prune session for the protocol files follows the cleanups. Expectation
      recorded: leaner records speed every session start; the protocol file itself is the
      larger read and is the prune session's job, not this one's.
    supersedes: nothing — extends BLUEPRINT STANDARD v1.0 (47f4b55, unwired) into rendered protocol text and adds the record standard
    stated_by: Matt, in chat, in this session ("We are perfectly aligned... institute the standard now in ForgeFlow"; cleanup by reusable focused prompt, separate sessions on his schedule), recorded in the turn it was made per W-002
  - id: RULING-029
    date: 2026-09-10
    subject: Document tightening runs from a FORGEFLOW session, not a session on the target repo
    ruling: >-
      Legacy-document cleanup (RULING-028) is operated from a Claude Web session opened on
      chromasmith/forgeflow: Matt names the target repo and the document(s); Claude Web files
      the dispatch issue from master/assets/doc-tightening.issue.md, reviews the PR against
      the rule inventory, and Matt merges. The template and its procedure live in forgeflow
      only and are never propagated; a rendered start protocol carries one line — document
      tightening is a forgeflow-session operation, like a render. Supersedes the
      "session opened on the target repo" lane of RULING-028 and replaces FF-020's inline
      procedure with master/DOC_TIGHTENING_PROCEDURE.md plus that one line in S-093 (next
      master change).
    supersedes: the target-repo-session lane of RULING-028; FF-020 as an inline-procedure block
    stated_by: Matt, in chat, in this session, recorded in the turn it was made per W-002
  - id: RULING-030
    date: 2026-09-10
    subject: FF-021 progress is tracked per repo as a DONE / NEXT inventory, not a done-list alone
    ruling: >-
      At a repo's first tightening session, Claude Web lists every instructional document in that
      repo (blueprints, specs, plans, guides, READMEs, instructions, procedures) under the repo's
      FF-021 entry in forgeflow .forge/backlog.yaml, each marked done (with merge SHA) or next.
      Every later tightening session on that repo updates the same list at its wrap. A forgeflow
      session resuming a partly cleaned repo reads that list and states "done / next" from it
      without a tree scan. The inventory is a record file and follows the record standard.
      master/DOC_TIGHTENING_PROCEDURE.md carries this as a rule and a flow step.
    supersedes: the done-list-only progress record in DOC_TIGHTENING_PROCEDURE.md data_model and flow step 7 (v1.4.1)
    stated_by: Matt, in chat, in this session, recorded in the turn it was made per W-002
  - id: RULING-031
    date: 2026-09-10
    subject: First FF-021 repo — chromasmith/LeadDowser, every instructional document, ForgeFlow files off limits
    ruling: >-
      chromasmith/LeadDowser is the first repo tightened under FF-021 (RULING-028/029/030). Scope: every
      instructional document in the repo. Off limits: the ForgeFlow-rendered files (.forge/protocols/,
      .forge/protocol-config.yaml, the CLAUDE.md house block) and the .forge/ state family. A document
      already carrying the standard's header is verified, not rewritten. Inventory block written under
      FF-021 in forgeflow .forge/backlog.yaml at this session's wrap.
    supersedes: nothing — RULING-028 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, in this session, recorded in the turn it was made per W-002
