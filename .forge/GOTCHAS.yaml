# GOTCHAS.yaml
# Lessons learned for future Claude Code sessions in this repo

- id: GOTCHA-001
  date: 2026-09-04
  summary: "render.py read the render_when literal 'none' as YAML null, so every '== none' block silently never rendered"
  detail: |
    build.validation and build.deploy are ENUMS whose legal values include the STRING "none".
    parse_literal() treated the condition token "none" as None, so "build.validation == none"
    (S-083) and "build.deploy == none" (S-085) were always false, and "build.deploy != none"
    (E-023) was always true — a no-deploy repo received a wrap step reading "deploys via none"
    and no local validation/deploy steps at all. The fixture tests were green because every
    fixture that exercised those blocks was on the standard profile (npm-build/vercel). Found
    on the first real render (seogeo, docs-only). Fixed in commit 1f0d1d0: only "null"/"None"
    mean null. Lesson: before rendering a repo, diff old-vs-new renders for THAT repo's profile
    and read the block manifest against the repo's real shape; a green fixture suite proves
    only the shapes the fixtures cover.
  source: "first real render, 2026-09-04 (forgeflow commits 1f0d1d0, 90209d0)"
  applies_to:
    - master/render.py (parse_literal, eval_condition)
    - master/start-protocol.master.yaml (S-083, S-085)
    - master/end-protocol.master.yaml (E-023)
    - master/tests/test_render.py
- id: GOTCHA-002
  date: 2026-09-04
  summary: "A Claude Web session rendering ANOTHER repo writes forgeflow's own .forge/ docs at its wrap — a second Claude Web session on forgeflow can collide with it"
  detail: |
    forgeflow is the render SOURCE, so a Claude Web session that renders saas-starter (or any
    repo) also commits to forgeflow at its wrap: registered-repos.yaml, handoff.yaml,
    session-state.yaml, session-history.yaml, rulings.yaml. Matt reported the other session as
    "read-only, just using the repo" — true mid-render, false at its wrap. The self-render
    session paused until that wrap (827dba9) landed, then re-cloned. Lesson: the concurrency
    question before writing to forgeflow is "is any OTHER CLAUDE WEB session mid-render or
    about to wrap?", not only "is a Claude Code session active?". Re-clone after it lands;
    a clone taken before the other wrap is stale.
  source: "forgeflow self-render session, 2026-09-04 (RULING-004; wait for 827dba9)"
  applies_to:
    - master/RENDER_PROCEDURE.md (step 0 / step 7 concurrency question)
    - .forge/handoff.yaml (watch_out_for)
- id: GOTCHA-003
  date: 2026-09-04
  summary: "A knob override recorded in an earlier ruling was filed into a new ruling before the target repo was inspected — and it was wrong"
  detail: |
    RULING-002 predicted that chromaqa's config must override subsystems.chromaqa to false
    because render.py would "mis-detect" the tool's own chromaqa-check.sh. When Matt named
    chromaqa (RULING-005), Claude Web restated that override in the ruling text from memory
    of RULING-002, then inspected the repo and found it genuinely RUNS ChromaQA on itself
    (.github/workflows/quality-gate.yml, a committed .chromaqa/CQA-debt.jsonl, and a CLAUDE.md
    decision of 2026-09-03 saying so). Detection was correct; the override would have
    stripped the debt check, push-gate rule and CI-reading blocks from a repo that needs
    them. Corrected by RULING-006 in the same session. Lesson: a render_when knob prediction
    made about a repo in an earlier session is a hypothesis, not a fact — list the target
    tree (workflows, .chromaqa/, CLAUDE.md) BEFORE writing any ruling or config that names
    a subsystem override, and write only what the tree shows.
  source: "chromaqa render session, 2026-09-04 (RULING-005 e909725, RULING-006 f0e348b)"
  applies_to:
    - master/RENDER_PROCEDURE.md (step 0 preconditions — inspect before configuring)
    - .forge/rulings.yaml (RULING-002 clause superseded by RULING-006)
- id: GOTCHA-004
  date: 2026-09-04
  summary: "A cut-off earlier instance of the SAME Claude Web chat can already have landed a write (RULING-007 @ 220a70e) — re-read the target file's blob SHA before every append, even one you 'know' is first"
  detail: |
    Matt's page glitched and the chat restarted mid-turn. The cut-off instance had already
    appended RULING-007 to .forge/rulings.yaml (220a70e) in the turn he named synclips-platform;
    the resumed instance was about to append the same ruling as RULING-007 again. It was caught
    only because the write step re-fetched rulings.yaml and its blob SHA had changed from the
    session-start read. Lesson: GOTCHA-002's "another session may have written here" applies to
    a previous instance of YOUR OWN conversation, not only to other chats; treat a changed blob
    SHA as "read it again and reconcile", never as a conflict to overwrite. Check the file's
    current tail for your own intended entry before assigning the next ID.
  source: "Synclips trio render session, 2026-09-04 (RULING-007 at 220a70e found already landed)"
  applies_to:
    - .forge/rulings.yaml (W-002 write-when-made appends)
    - master/RENDER_PROCEDURE.md (step 0 concurrency question)
- id: GOTCHA-005
  date: 2026-09-05
  summary: "On Surface 12 `op whoami` reports 'not signed in' while every 1Password data command works — use `op vault list` as the readiness check; secrets piped from `op read` need .Trim()"
  detail: |
    The 1Password CLI's whoami lies on Matt's Surface 12 (reports no session while op read /
    op item edit / op vault list all succeed). A prompt that gates on whoami stalls for
    nothing. Also: `op read` emits a trailing newline, and `gh secret set` stores it — the
    working install line is
      (op read "op://Chromasmith Keys/CLAUDE_CODE_OAUTH_TOKEN/credential").Trim() | gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo chromasmith/<repo>
    Never use the vault's ANTHROPIC_API_KEY for the dispatch harness (per-token billing);
    the harness wants the subscription token (sk-ant-oat*) created by `claude setup-token`.
  source: "secrets install for the v1.1.0 rollout, 2026-09-05 (Claude Code run SETUP-TOKEN; RENDER_PROCEDURE step 0b @ ab19c0e)"
  applies_to:
    - master/RENDER_PROCEDURE.md (step 0b)
    - master/PROPAGATION_PROCEDURE.md (step 2b)
- id: GOTCHA-006
  date: 2026-09-05
  summary: "The GitHub connector's push_files JSON-escapes backslashes — it doubled every backslash in render.py (38af6dc); the repair is 43146f8"
  detail: |
    push_files landed master/render.py (38af6dc) with `\\n` where the source had `\n`, so the first
    v1.1.0 code commit shipped a renderer (38af6dc) that ran but produced wrong output. Caught only
    because the sandbox blob SHA was compared to GitHub's after the push. Lesson: prefer
    create_or_update_file (one file per call) for any file containing backslashes, and ALWAYS
    prove a landing by `git hash-object <sandbox file>` == the blob SHA GitHub returns —
    never by "the commit exists". Large text sets that will not fit the connector at all go
    through ONE Claude Code prompt carrying a gzip+base64 patch and a blob-SHA table
    (b421783 landed seven master files that way).
  source: "master v1.1.0 landing, 2026-09-05 (38af6dc broken, 43146f8 repaired, b421783 patch route)"
  applies_to:
    - master/render.py
    - master/RENDER_PROCEDURE.md (landing step)
- id: GOTCHA-007
  date: 2026-09-05
  summary: "A landed master change (e.g. b421783) updates NOTHING any repo reads until that repo is re-rendered; and the renderer's 'DISPATCH OFF - harness not installed' line is a correct message, not a failure"
  detail: |
    After b421783 every rendered repo still carried v1.0.0 text until its own re-render
    landed (forgeflow e60eff5..f9b8d33 was the first); a session that reads the new master and then a rendered protocol sees a mismatch
    that is expected. Report protocol behaviour as changed only for repos whose registry row
    says v1.1.0. Separately: rendering a repo whose tree has no .github/workflows/claude.yml
    prints "DISPATCH OFF - harness not installed" on stderr and renders S-092 — that is the
    v1.1.0 design (FFD-001), not a broken renderer; the fix is Matt installing the workflow
    file, never a config override.
  source: "FF-V110-MASTER inbox reflections + the four re-renders, 2026-09-05"
  applies_to:
    - master/PROPAGATION_PROCEDURE.md
    - master/render.py (dispatch detection)
- id: GOTCHA-008
  date: 2026-09-05
  summary: "create_or_update_file can ABORT with no result on a ~80-90 KB file and fails outright near 110 KB — retry, then prove by blob SHA; a start protocol that renders above ~100 KB needs a Claude Code prompt to land"
  detail: |
    seogeo's 78 KB start protocol aborted once mid-call with no tool result, then landed (a94d846) on
    the identical retry; an earlier ~110 KB attempt failed outright, which is why
    v1.1.0's text half went through a Claude Code patch (GOTCHA-006). The call is idempotent
    (same content, same target SHA), so a retry is safe; the landing (e.g. a94d846) is proven by comparing
    the returned blob SHA to git hash-object of the sandbox file. Today's largest rendered
    file was saas-starter's 93 KB start protocol (f3110b0) — repos with more subsystems
    (synclips-platform with the monorepo + companion blocks) may cross the line; check
    `wc -c` on the render output before choosing the landing route.
  source: "seogeo and saas-starter re-renders, 2026-09-05 (a94d846, f3110b0)"
  applies_to:
    - master/RENDER_PROCEDURE.md (landing step)
- id: GOTCHA-009
  date: 2026-09-06
  summary: "A base64/gzip blob pasted inside a Claude Web reply arrives CORRUPTED — never transport a master change that way; push a self-verifying apply script to a temporary branch through the connector and let Claude Code fetch it"
  detail: |
    The first v1.2.0 landing prompt carried the master change as a 31 KB gzip+base64 block for
    Claude Code to decode. It arrived with multi-character damage (SHA-256 mismatch; the recovered
    payload was the right LENGTH, 70,425 bytes, but failed the gzip CRC; git apply --check rejected
    it at line 351; an exhaustive single-character repair search found no fix). The cause is the
    transport itself: a token model cannot emit tens of KB of opaque base64 reliably, and the
    encoding has no redundancy, so one slip is fatal and invisible until decode. Nothing was applied
    — the run's SHA-256 guard caught it before a byte touched the repo. The route that worked, first
    try: write the change as a PYTHON APPLY SCRIPT of exact-match replacements (each asserts its
    target text exists exactly once, so a wrong start state or a transcription slip fails loudly
    before saving) that ends by printing git hash-object of every file it wrote against the expected
    blob SHA; push that script through the connector to a temporary branch (tmp/<name>; prose
    survives the connector, and the returned blob SHA proves the landing); have Claude Code
    `git fetch origin tmp/<name>:refs/remotes/origin/tmp/<name>`, `git restore
    --source=origin/tmp/<name> -- <script>`, prove the script's blob SHA, run it, delete the scratch
    file, then commit the named files. Prove the whole route from a fresh clone in the sandbox BEFORE
    handing the prompt over. Side lesson from the failed run: when a gzip payload fails its CRC,
    gzip.decompress discards everything; decompressing as raw deflate (skip the 10-byte header and the
    null-terminated name, then zlib.decompressobj(-15)) recovers the damaged bytes for diagnosis.
  source: "v1.2.0 landing, 2026-09-06 (halted run reported in chat — no inbox file; successful run FF-V120-MASTER @ 54c1293 / 8ec708c via branch tmp/v120-apply blob 82288e6)"
  applies_to:
    - master/RENDER_PROCEDURE.md (landing step — anything the connector cannot carry directly)
    - master/PROPAGATION_PROCEDURE.md (step 5)
    - .forge/handoff.yaml (watch_out_for)
- id: GOTCHA-010
  date: 2026-09-06
  summary: "Matt's Surface 12 has a main-only pre-push guard that also blocks branch DELETIONS — a transport branch is deleted in the GitHub browser UI, never by Claude Code and never with --no-verify"
  detail: |
    C:\Users\chrom\.config\git\hooks\main-only-guard.sh (a global pre-push hook) rejects any push
    whose target is not main, and a `git push origin --delete <branch>` counts as a push to that
    branch: "MAIN-ONLY GUARD: Push rejected. Attempted branch: tmp/v120-apply". Claude Code correctly
    stopped instead of skipping the guard. The connector has no branch-delete tool either (it can
    create a branch and write files on it, not remove it). So a prompt that creates or uses a
    transport branch must NOT ask Claude Code to delete it; it ends with a one-line Matt action:
    https://github.com/chromasmith/<repo>/branches, trash icon. Note the branches page lists the same
    branch under "Your branches" and "Active branches" — one delete removes both; the second row is a
    stale render of the page, not a second branch (verify with the connector's list_branches).
    Dispatched runners are unaffected (they push from the runner, not this machine).
  source: "FF-V120-MASTER run report, 2026-09-06; branch confirmed gone via list_branches"
  applies_to:
    - master/RENDER_PROCEDURE.md (landing step)
    - master/PROPAGATION_PROCEDURE.md (step 5)
    - prompts that use a tmp/ transport branch
- id: GOTCHA-011
  date: 2026-09-06
  summary: "Claude Code on Surface 12 runs PowerShell / Git Bash, not cmd.exe — the master's STEP 0 and completion steps still emit cmd syntax, which every run must translate (FF-011)"
  detail: |
    S-032 / S-036 emit `cd /d`, `if not exist ... mkdir`, and prompts inherit `del`, `copy /Y`,
    `rmdir /S /Q` and backslash paths; S-036 even says the cmd forms are "safe there". The
    FF-V120-MASTER run reported that the session had PowerShell and Git Bash only, and translated
    every command to its Git Bash equivalent (`cd`, `mkdir -p`, `rm -f`, `cp -f`, `rm -rf`, forward
    slashes) — correctly, but that is a per-run tax and an invitation to a slip. Until FF-011 lands
    in the master, write prompt commands for this machine in Git Bash syntax, and treat PowerShell
    redirection (`>`) as suspect for file content (it re-encodes output; use git restore/show
    --output or a Python one-liner instead). Cosmetic: the Windows console renders the em-dash in
    render.py's and the apply script's success lines as a stray "?" — it is not corruption; the blob
    SHA is the proof.
  source: "FF-V120-MASTER inbox reflections, 2026-09-06"
  applies_to:
    - master/start-protocol.master.yaml (S-032, S-036, S-043)
    - master/end-protocol.master.yaml (E-021)
    - every local Claude Code prompt written for Surface 12
- id: GOTCHA-012
  date: 2026-09-07
  summary: "Surface 12 render-and-verify facts: core.autocrlf must be false or every render blob SHA fails; /tmp is the Windows Temp dir; git cat-file with a path needs MSYS_NO_PATHCONV=1 under Git Bash"
  detail: |
    The FF-V130-MASTER run (8db4ff2 / e4466c4) matched all twelve blob SHAs first try, and its
    reflections named the one thing that could have broken it silently: git's CRLF conversion.
    render.py writes LF and the sandbox hashes LF; a checkout with core.autocrlf=true (or unset
    on a fresh Windows git) would rewrite the six rendered files on checkout/add and every hash
    gate would fail with no visible cause. This box has core.autocrlf=false, so it passed —
    any prompt that hashes rendered output on Surface 12 should print `git config core.autocrlf`
    first and HALT on anything but false. Two smaller facts from the same run: (1) a Git Bash
    /tmp path in a prompt resolves to C:\Users\chrom\AppData\Local\Temp, so the render banner
    prints that Windows path — harmless, not a wrong output dir; (2) `git cat-file -p
    origin/main:.forge/...` fails under Git Bash because MSYS rewrites the path inside the
    argument — prefix the command with MSYS_NO_PATHCONV=1, or verify the pushed tree with
    `git ls-tree origin/main <path>` instead. Also confirmed: the apply-script route (GOTCHA-009)
    is now proven twice (54c1293 and 8db4ff2) and is the standard landing for any master text
    change the connector cannot carry.
  source: "FF-V130-MASTER inbox reflections and Claude Code report, 2026-09-07"
  applies_to:
    - every local Claude Code prompt that renders or hashes files on Surface 12
    - master/RENDER_PROCEDURE.md (landing step)
    - master/PROPAGATION_PROCEDURE.md (step 5 — the FF-009 run hashes six repos' renders)
- id: GOTCHA-013
  date: 2026-09-07
  summary: "render.py detect() reads the WORKING TREE, so a local-only file changes the render — a gitignored .venv made dv-captain render differently on Matt's machine than from a GitHub-shaped tree"
  detail: |
    The FF-009 propagation halted on dv-captain because the local checkout carries an
    untracked .venv/ that GitHub does not have. detect() sets build.validation to
    "py-compile" when it sees a .venv, so the local render produced a different
    config_hash and different protocol text from the Claude Web sandbox render of the
    same repo at the same master. Neither render was wrong; they were reading different
    trees. Every detection input can do this: .venv/, .vercel/project.json, supabase/,
    .chromaqa/, .seogeo/config.json, package.json, src/**/*.tsx. THE FIX IS THE CONFIG,
    NOT THE RENDERER: declare the field as an override in the repo's
    .forge/protocol-config.yaml with the reason, and the file then renders identically
    wherever it runs (proven for dv-captain: identical output with and without .venv).
    Before trusting a sandbox SHA table, ask whether the target checkout could hold a
    detection input that GitHub does not.
  source: "FF-009 propagation, 2026-09-07 (run PROPAGATE-v1.3.0 halt on dv-captain; fixed in PROPAGATE-v1.3.0b at c22d068)"
  applies_to:
    - master/render.py (detect)
    - every repo's .forge/protocol-config.yaml overrides block
    - master/PROPAGATION_PROCEDURE.md step 3
- id: GOTCHA-014
  date: 2026-09-07
  summary: "A propagation SHA table is only valid against the repo snapshot it was rendered from — chromaqa gained an artifact register between the snapshot and the run, and every SHA in its row went stale"
  detail: |
    chromaqa acquired .forge/protocols/artifact-register.yaml on 2026-09-06, which flips
    subsystems.artifact_register true and renders S-003 IN. The Claude Web sandbox render
    had been taken before that landed, so the local run's config_hash (ff50e23e) did not
    match the prompt's (b5c5ed08) and the repo correctly halted. Nothing was wrong with
    the renderer or the master. TWO CHEAP HABITS: (1) record the per-repo origin/main SHA
    the sandbox rendered against alongside the blob SHAs, so a mismatch is diagnosable in
    one command instead of looking like render non-determinism; (2) when a render
    mismatches, check the CLAUDE.md house block FIRST — if the house block matches and
    only the .forge files differ, the cause is a detection difference in the tree, never
    the renderer and never the master. Both halts in this propagation had that signature.
  source: "FF-009 propagation, 2026-09-07 (runs PROPAGATE-v1.3.0 and PROPAGATE-v1.3.0b)"
  applies_to:
    - master/PROPAGATION_PROCEDURE.md step 3
    - every propagation prompt Claude Web writes
- id: GOTCHA-015
  date: 2026-09-07
  summary: "Refresh mechanics that bite: an ahead-only check cannot see a BEHIND checkout; reset --hard deletes a commit you were told to keep; and rebase refuses on a dirty tree, so the answer there is merge --ff-only"
  detail: |
    Three related traps, all found in one day of propagation prompts, all now repaired in
    master v1.3.1 (S-033, W-005) except the last, which is FF-016.
    (1) `git rev-list --count origin/main..HEAD` counts commits AHEAD. A checkout that is
    eight commits BEHIND reports 0 and reads as "clean" — convergible was exactly that.
    Count both directions: `git rev-list --count HEAD..origin/main` too.
    (2) A prompt that says "commit this file, then git reset --hard origin/main" deletes
    the commit it just asked for. Order does not save it. Claude Code caught this in a
    Claude Web prompt and correctly overrode it.
    (3) `git rebase origin/main` is the right refresh when the checkout holds local
    commits — but git refuses to rebase with unstaged changes, and convergible ALWAYS has
    an unstaged .chromaqa/CQA-debt.jsonl. With no local commits the correct move there is
    `git merge --ff-only origin/main`, which is byte-identical in result and leaves the
    dirty file alone. Claude Code made that call correctly, unprompted.
    SHELL TRAP from the same runs: in Git Bash a Windows path in double quotes eats a
    following variable — "C:\Chromasmith\$R" expands to the literal C:\Chromasmith$R
    because the backslash escapes the dollar. Use forward slashes (C:/Chromasmith/$R) in
    any loop that builds paths from a variable. It failed harmlessly here (cd errored,
    nothing was written) but with `>` instead of `cp` it would silently write elsewhere.
  source: "FF-009 propagation and the v1.3.1 landing, 2026-09-07 (runs PROPAGATE-v1.3.0b and FF-V131-MASTER)"
  applies_to:
    - master/start-protocol.master.yaml (S-033, S-036, W-005)
    - every local Claude Code prompt written for Surface 12
- id: GOTCHA-016
  date: 2026-09-07
  summary: "Three signals that look like failures and are not: the 'Bypassed rule violations' push warning, convergible's ledger dirtying after every push, and render.py's em-dash printing as a replacement character"
  detail: |
    A session that treats any of these as an error stops for no reason.
    (1) On a branch-protected repo (chromaqa, forgeflow, convergible and others), a direct
    push by Matt's own account succeeds and prints "Bypassed rule violations — changes must
    be made through a pull request". That is protection working exactly as RULING-011
    designed it: runners cannot push main, administrators bypass.
    (2) Every push to convergible runs its ChromaQA gate, which appends to
    .chromaqa/CQA-debt.jsonl AFTER staging, so the working tree is dirty immediately after
    a successful push. On ChromaQA 7.2+ those lines are new findings: read the diff and
    name them, never commit them blind, and never discard them.
    (3) render.py's success line prints the em-dash as a replacement character under the
    Windows console codepage. The rendered FILES are correct LF UTF-8 and every blob SHA
    matched. Do not "fix" render.py for it.
  source: "FF-009 propagation and the v1.3.1 landing, 2026-09-07 (inbox PROPAGATE-v1.3.0b, FF-V131-MASTER)"
  applies_to:
    - every propagation or render run on Surface 12
    - .forge/handoff.yaml (watch_out_for)
- id: GOTCHA-017
  date: 2026-09-09
  summary: "Onboarding a brand-new repo: check the GitHub name's CASE before rendering, pass the prompt's --date not today's, never copy the echoed protocol-config out of the render output, and expect --claude-md to point at a file that does not exist yet"
  detail: |
    Four things the first render of chromasmith/LeadDowser exposed, none of them a
    renderer bug, all of them capable of costing a round trip.
    (1) CASE. The repo had been created all-lowercase (chromasmith/leaddowser) while
    every rendered path said LeadDowser. Pushes still worked because GitHub redirects
    an old name, printing "remote: This repository moved" — a courtesy, not a
    contract. Read the repo's real name from the API before writing the config
    (`html_url` on any contents call, or search_repositories), because repo.name goes
    into config_hash and into every path in both protocol files. Renaming afterwards
    is cheap and a re-render is not — but a CASE-ONLY rename NO-OPS SILENTLY in
    GitHub's Settings page: it needs the two-step, rename to <reponame>-tmp, then to
    the final casing.
    (2) DATE. render.py stamps --date into the header, so a hash table computed by
    Claude Web is only reproducible with that exact date value. A run that substitutes
    today's date renders correct content under a different header and misses every
    expected blob SHA, which reads like non-determinism and is not. Say the date
    explicitly in the prompt and say why.
    (3) THE ECHOED CONFIG. render.py writes .forge/protocol-config.yaml into its --out
    directory as an echo of its input, not as a deliverable. Never copy it back into
    the repo tree; instead commit the config FIRST through the connector and compare
    the echoed file's blob SHA to the committed one — that comparison is the
    determinism proof, and it is stronger than "the render succeeded".
    (4) NO CLAUDE.md YET. On a first render --claude-md points at a file that does not
    exist; render.py handles it and creates the block. Creating a stub first changes
    the detected tree and breaks the CLAUDE.md hash.
  source: "LeadDowser first render, 2026-09-09 (runs LD-INSTALL-1 and LD-REGISTRY-1; LeadDowser commits 58c2511, a86cfbb)"
  applies_to:
    - master/RENDER_PROCEDURE.md (step 0 preconditions and the landing step)
    - every first render of a repo new to the master
- id: GOTCHA-018
  date: 2026-09-09
  summary: "A Claude Code session may append Co-Authored-By / Claude-Session trailers to every commit message it writes — no forgeflow commit before 2026-09-09 carries them, so say 'no attribution trailers' in the prompt when the history should stay uniform"
  detail: |
    The LD-REGISTRY-1 run used the prompt's commit subject verbatim and then added two
    trailer lines from its own harness instruction, making be3cf47 and 4f1a670 the
    first commits in this repo to carry them. The run disclosed it rather than letting
    it pass, which is the system working. Nothing about content, blobs or SHA
    verification changes — this is house style only. If a repo's history should stay
    uniform, the prompt must say so explicitly, because the harness instruction is
    outside the prompt and will otherwise win every time.
  source: "LD-REGISTRY-1 run report and inbox, 2026-09-09 (forgeflow be3cf47, 4f1a670)"
  applies_to:
    - every local Claude Code prompt that commits
- id: GOTCHA-019
  date: 2026-09-09
  summary: "Extends GOTCHA-012: MSYS path conversion also breaks `git rev-parse <ref>:<path>`, and because only paths containing a slash are mangled, a bare CLAUDE.md verifies fine while every .forge/ path errors — which looks exactly like the protocol files are absent from the commit"
  detail: |
    GOTCHA-012 recorded that `git cat-file` with a path needs MSYS_NO_PATHCONV=1 under
    Git Bash. The same applies to `git rev-parse origin/main:.forge/protocols/start-protocol.yaml`,
    which is rewritten to a Windows path and fails with "ambiguous argument". The
    asymmetry is the trap: CLAUDE.md has no slash, so it succeeds, and a session
    verifying a push sees one file confirmed and five apparently missing. Use
    `git ls-tree -r origin/main` and read the blob column, or prefix with
    MSYS_NO_PATHCONV=1. Any prompt that asks a run to verify pushed blobs on Surface 12
    should name the ls-tree form directly rather than leaving the run to discover this.
  source: "LD-INSTALL-1 run, verifying the pushed blob SHAs, 2026-09-09"
  applies_to:
    - every local Claude Code prompt that verifies a push by blob SHA on Surface 12
    - master/start-protocol.master.yaml (S-036 shell notes)
- id: GOTCHA-020
  date: 2026-09-09
  summary: "The connector's READ TRUNCATES angle-bracket placeholders — GOTCHA-009's tmp/<reponame> came back as tmp/<n>, and re-transmitting that read corrupted the file; rebuild every whole-file write from a git clone, never from a connector read"
  detail: |
    Part 5 of this wrap appended three entries to this file by re-transmitting the whole
    file, and the write landed 82 bytes larger than the sandbox build with a different blob
    SHA. The diff was three lines inside GOTCHA-009 where a placeholder had shrunk. The
    connector's read tool renders such placeholders in a shortened form, so any text taken
    from a read and written back silently loses characters — and the corruption is invisible
    in the reply, in the diff view and in a YAML parse, because the result is still valid
    YAML. It was caught only by comparing the returned blob SHA to git hash-object of the
    sandbox file, which is why that comparison is mandatory rather than a formality. THE
    RULE: build every whole-file write from `git clone` content in the sandbox, never from
    a connector read; and when a write's blob SHA does not match, diff the landed file
    against the sandbox build before doing anything else, because the mismatch names the
    damage exactly.
  source: "the 2026-09-09 wrap, part 5 (landed af35ade wrong, repaired in the part that follows)"
  applies_to:
    - every wrap or direct-write that re-transmits an existing file
    - master/end-protocol.master.yaml (E-002 write discipline)
- id: GOTCHA-021
  date: 2026-09-10
  summary: "A prompt that states the world's condition as fact goes stale between writing and running — brief the run with a hypothesis and let its own audit be the authority"
  detail: |
    HARNESS-AUDIT-1 was told four repos lacked branch protection and convergible lacked
    the OAUTH secret; the run's read-only audit found all ten repos already correct.
    The claims came from the handoff and the registry, not from the API. Rule: a prompt
    describes expected state as "expect roughly X; confirm against the audit and report
    divergence", never as fact; and every apply phase states what to do when zero items
    qualify. Records that say a setting is "owed" are re-read from the API before being
    repeated.
  source: "run HARNESS-AUDIT-1 reflections, 2026-09-10 (inbox bf0f305)"
  applies_to:
    - every live-run prompt that applies account or repo settings
    - .forge/handoff.yaml watch_out_for lines that assert external state
- id: GOTCHA-022
  date: 2026-09-10
  summary: "On Surface 12 the FIRST op command after idle can fail with an authorization timeout — retry the readiness check once before declaring a sign-in gate"
  detail: |
    GOTCHA-005 prescribes `op vault list` as the readiness check because `op whoami` lies.
    The first `op vault list` of HARNESS-AUDIT-1 returned only an authorization timeout;
    an identical call moments later listed the vault. A prompt that gates on one call
    stalls a supervised run and asks Matt to sign in to a 1Password that is signed in.
    Rule: run the check; on a timeout run it exactly once more; only then gate.
  source: "run HARNESS-AUDIT-1, 2026-09-10 (op CLI 2.34.1)"
  applies_to:
    - master/RENDER_PROCEDURE.md (step 0b)
    - every prompt that reads a secret through the 1Password CLI
- id: GOTCHA-023
  date: 2026-09-10
  summary: "A clean canonical checkout is not a current one — seven of nine were behind origin (one by 14 commits) with empty git status; render.py reads the working tree, so a skipped refresh moves config_hash"
  detail: |
    PROPAGATE-v1.4.0 found every checkout clean and on main, and seven behind origin.
    No safety check fires on a behind-only checkout (S-033 check 2b reports it, that is
    all). Detection reads the tree, so rendering a stale tree can produce a different
    config_hash and halt a propagation on a gate that is not really failing. Rule: the
    refresh runs before every render even when git status is empty; it is what makes the
    hash gate mean anything.
  source: "run PROPAGATE-v1.4.0 reflections, 2026-09-10 (inbox bdbbdb0)"
  applies_to:
    - master/PROPAGATION_PROCEDURE.md step 5
    - every render or propagation prompt
- id: GOTCHA-024
  date: 2026-09-10
  summary: "Branch deletion by the run works (RULING-023): `gh api -X DELETE .../git/refs/heads/tmp/<name>` never touches the pre-push guard; the 404 verification exits non-zero, so separate it with a semicolon, not &&"
  detail: |
    FF-V140-MASTER deleted tmp/v140-apply via the REST call and confirmed the 404 — the
    first transport branch Matt did not delete by hand. Supersedes GOTCHA-010's "Matt
    deletes it in the browser" step; GOTCHA-010's fact about the main-only guard blocking
    `git push --delete` stands. Trap: `gh api repos/OWNER/REPO/branches/NAME` on a deleted
    branch returns 404 and exits non-zero, so `delete && verify` reports a successful
    deletion as a failed command — run the two calls on separate lines.
  source: "run FF-V140-MASTER reflections, 2026-09-10 (inbox 52dd972)"
  applies_to:
    - every prompt that uses a tmp/ transport branch
    - .forge/GOTCHAS.yaml GOTCHA-010 (partly superseded)
- id: GOTCHA-025
  date: 2026-09-10
  summary: "A protocol sentence with reader 'all' that says where an operation is run FROM is read by a cold runner as a prohibition on the issue it is executing — TIGHTEN-LeadDowser-002 halted on S-093's closing sentence"
  detail: |
    S-093 (v1.4.1) closes "document tightening is a forgeflow-session operation ... this repo
    never carries either". The runner on LeadDowser issue #2 read that as "a tightening issue
    dispatched on LeadDowser violates the protocol", cited the issue's own PRECEDENCE clause and
    halted with a needs_ruling; the runner on issue #1 read the same text and proceeded. Any block
    with reader all is read cold by a runner that cannot see the forgeflow session; a sentence
    about where an operation is OPERATED must also say what the runner receiving it does. Interim
    resume wording that worked (issue #2 comment 5623465814): option 3, "this issue WAS filed from
    the forgeflow session; a runner receiving it is executing the operation, not violating it".
    Master fix: FF-022. Dispatch-start is 640/650 on the maximum knob set, so the fix replaces text.
  source: "LeadDowser issue #2, run TIGHTEN-LeadDowser-002, 2026-09-10 (halt comment 5623339861, resume 5623465814)"
  applies_to:
    - master/start-protocol.master.yaml (S-093, any block with reader all)
    - master/assets/doc-tightening.issue.md
- id: GOTCHA-026
  date: 2026-09-10
  summary: "Runner refuses ANY piped Bash command as 'multiple operations requiring approval', read-only included; with python3 and node also blocked, counting or diffing on a runner needs an in-repo scratch file and the Grep tool"
  detail: |
    On the dispatch runner `git show HEAD:path | grep -c pattern` is refused before it runs — the
    harness treats a pipe as multiple operations needing approval, and nobody is present. This is
    a third refusal mechanism beside the allowlist and the $-expansion block (S-064). Working
    pattern from run TIGHTEN-LeadDowser-002: `git show HEAD:<path> > <in-repo scratch path>`
    (no pipe), run the Grep tool on the scratch file, delete the scratch file BEFORE the scope
    audit so it never appears in the diff, and disclose it in the run report. A template that
    asks a runner to count lines or compare against the pre-edit file should name this pattern.
  source: "run TIGHTEN-LeadDowser-002 inbox (LeadDowser PR #4, merged 46a97b2), 2026-09-10"
  applies_to:
    - master/start-protocol.master.yaml (S-064 runner_environment_facts)
    - master/assets/doc-tightening.issue.md (RUNNER ENVIRONMENT)
- id: GOTCHA-027
  date: 2026-09-10
  summary: "At a first render, open the north_star_doc and check its header names the document the path claims — LeadDowser's blueprint path carried a copy of the interface notice for a day, and two files of near-identical size are the tell"
  detail: |
    chromasmith/LeadDowser was rendered 2026-09-09 with north_star_doc = .forge/strategy/
    leaddowser-blueprint.yaml. The file at that path was the Convergible interface notice (a
    wrong file picked in the web upload); the real 84 KB blueprint had never been committed.
    RULING-021 recorded the tree by path and never looked inside. Found 2026-09-10 only because
    the tightening inventory opened the file. Rule for RENDER_PROCEDURE step 0: read the first
    30 lines of the north_star_doc and confirm its own meta.doc / title matches the filename;
    two instructional files within a few bytes of each other in size are treated as one document
    duplicated until the headers are read. Restored @ LeadDowser 1c4b3d97 (84,286 bytes) by a concurrent Claude Web session
    from its own file, not from a chat re-transmission.
  source: "LeadDowser inspection at the start of FF-021, 2026-09-10 (restore commit 1c4b3d97)"
  applies_to:
    - master/RENDER_PROCEDURE.md (step 0 preconditions)
    - every first render where the config names a north_star_doc
- id: GOTCHA-028
  date: 2026-09-10
  summary: "A ChromaQA summary line reading 'N new warning(s) logged' does not mean .chromaqa/CQA-debt.jsonl changed — read the file with git diff, never the sentence"
  detail: |
    The counter counts findings raised by the push; the ledger gains a line only for a finding it has
    not already recorded. In run FF-V142-MASTER chromasmith-saas-starter reported 1 new warning and
    convergible reported 4, and in both repos the tracked ledger was byte-identical to HEAD and the
    working tree clean. A session that trusts the sentence hunts for ledger changes that do not exist,
    or stashes a file that never changed. After a push, check the ledger with git status or git diff.
  source: "run FF-V142-MASTER inbox (40b51b8), 2026-09-10"
  applies_to:
    - every local run that pushes to a repo with a ChromaQA pre-push gate
    - .forge/GOTCHAS.yaml GOTCHA-016 (ledger dirt after a push)
- id: GOTCHA-029
  date: 2026-09-10
  summary: "The sandbox cannot clone the private repos, so PROPAGATION step 3's per-repo sandbox render needs a tree skeleton each; for a text-only master change a diff-check gate inside the run proves more with less"
  detail: |
    Eight of the ten registered repos are private. For v1.4.2 the run executed a checker per repo that
    takes the committed rendered copy, applies only the intended changes (header stamps v1.4.1 to
    v1.4.2, the S-093 closing sentence, the W-005 bullet) and requires the new render to equal the
    result byte for byte; any other difference fails that repo. All eight passed 6 of 6, and every
    landing commit showed the same six-file +19/-16 signature through the connector. The checker was
    proven on forgeflow's real render and on a deliberately damaged copy before use (4bc7d21). It lived only on
    the transport branch (blob aae8831b); FF-025 makes it a permanent tool.
  source: "run FF-V142-MASTER (v142-diffcheck.py blob aae8831b; inbox 40b51b8), 2026-09-10"
  applies_to:
    - master/PROPAGATION_PROCEDURE.md (step 3)
    - every propagation prompt for a text-only master change
- id: GOTCHA-030
  date: 2026-09-10
  summary: "A tightening runner mapping a legacy status legend PROMOTED draft copy to RATIFIED; the rule inventory still mapped, because it tracks where an item lands, not its status"
  detail: |
    Run TIGHTEN-convergible-001 mapped DECIDED / PROVISIONAL / DEFERRED / OPEN to the house tags and set
    the Showcase blueprint's surfaces > editor > modal_copy from "DRAFT copy" to "RATIFIED".
    Inventory 392/392 still mapped (PR #5). A build session would have shipped unapproved owner-facing
    copy. Review reads every changed status line in the diff and rejects any move toward RATIFIED; DRAFT, PROVISIONAL and
    unconfirmed items map to PROPOSED. Fixed in 2271019 before merge.
  source: "convergible PR #5 review (merged c82ae59), 2026-09-10"
  applies_to:
    - master/assets/doc-tightening.issue.md (status mapping)
    - master/DOC_TIGHTENING_PROCEDURE.md (review checks)
- id: GOTCHA-031
  date: 2026-09-10
  summary: "A tightening runner dropped current declarations that sat inside rationale paragraphs; the inventory classed each paragraph as reasoning and lost the facts in it"
  detail: |
    Run TIGHTEN-convergible-002 on .forge/legal/compliance.yaml lost four statements of what is true
    today: the personalization inputs, the DMCA agent status (none declared, notification clause present),
    the Article 27 representative declared neither, and that the trademark alone does not permit a d/b/a.
    Three were in neither the new document nor the history companion. Inventory 64/64 mapped, so the count
    did not show it. Review reads each cut paragraph for present-tense facts and requires each as an
    inventory item. Restored in 48571cc (68/68) before merge.
  source: "convergible PR #4 review (merged 356033a), 2026-09-10"
  applies_to:
    - master/assets/doc-tightening.issue.md (inventory rule)
    - master/DOC_TIGHTENING_PROCEDURE.md (review checks)
- id: GOTCHA-032
  date: 2026-09-10
  summary: "On one dispatch runner the plain redirect GOTCHA-026 prescribes (git show HEAD:path > scratch file) was refused as requiring approval, while a runner started a second later ran it"
  detail: |
    Actions run 34528481822 (TIGHTEN-convergible-001) had the redirect refused twice; run 34528536240
    (TIGHTEN-convergible-002) ran it. The first run wrote the HEAD content to the authorized scratch path
    with the Write tool, checked it byte-identical to HEAD (53821 bytes), used it and deleted it before the
    scope audit. A template that names the redirect names the Write-tool fallback beside it.
  source: "TIGHTEN-convergible-001 run report (convergible issue #2), 2026-09-10"
  applies_to:
    - master/assets/doc-tightening.issue.md (RUNNER ENVIRONMENT)
    - .forge/GOTCHAS.yaml GOTCHA-026
- id: GOTCHA-033
  date: 2026-09-10
  summary: "GOTCHA-020 recurred on a file rebuilt from a git clone: the sandbox terminal display shortens angle-bracket placeholders too, so a whole-file write retyped from any display can drop characters"
  detail: |
    The RULING-033 write (747073a) landed 3 bytes short: the placeholder after tmp/ in RULING-023 was
    shortened in transit although the file had been rebuilt from a clone, because the write is retyped
    from what the sandbox displays. The returned blob SHA differed from git hash-object, a diff against
    the clone named the line, and a049f6e restored it (blob 8ecdeec). Before a whole-file write, list the
    file's angle-bracket tokens with od -c; after it, the blob SHA comparison is the only proof.
  source: "747073a, repair a049f6e, 2026-09-10"
  applies_to:
    - every whole-file connector write of a file containing angle-bracket placeholders
    - .forge/GOTCHAS.yaml GOTCHA-020
- id: GOTCHA-034
  date: 2026-09-10
  summary: "A connector squash merge given only a title gets GitHub's default body, which lists the branch commits and adds a claude[bot] Co-authored-by trailer; pass commit_message explicitly"
  detail: |
    convergible 356033a (PR #4, title only) carries the trailer the issue's no-attribution rule forbids;
    c82ae59 (PR #5, explicit commit_message) does not. Runner commits can carry Co-Authored-By trailers
    despite the rule (2271019); an explicit squash message keeps them off main.
  source: "convergible 356033a and c82ae59, 2026-09-10"
  applies_to:
    - every merge_pull_request call that squashes a runner PR
- id: GOTCHA-035
  date: 2026-09-10
  summary: "Claude Web cannot read convergible's PR check runs or combined status (GitHub connector 403) or list its Vercel deployments (403), so a red check on a PR cannot be diagnosed from chat"
  detail: |
    Vercel previews reported Error on convergible PRs #4 and #5, which changed only .forge/ YAML files
    outside the apps/web build root. get_check_runs and get_status returned 403 Resource not accessible by
    integration; Vercel list_deployments returned 403 and build-log lookups returned not found. A failing
    preview never replaces what production serves. Diagnosis belongs to a convergible session with
    Vercel CLI access.
  source: "convergible PRs #4 and #5, 2026-09-10"
  applies_to:
    - reviewing dispatched PRs on chromasmith/convergible
- id: GOTCHA-036
  date: 2026-09-11
  summary: "Concurrently dispatched runs on different repos can all fail at the same moment and push nothing; check for the branch, then restart each with an @claude comment"
  detail: |
    Three tightening runs (LeadDowser #5, seogeo #2, chromasmith-saas-starter #16), started minutes apart,
    each ended in error within about 70 seconds of each other, 8 to 11 minutes in, with no branch on the
    remote. The workflow sets no timeout, and a fourth run started just after (convergible #6) finished normally, so the
    cause was shared and outside the documents. Claude Web cannot read Actions job logs through the
    connector. A comment "@claude ... carry out the task in the issue body from the beginning" restarted each
    run and all three finished (LeadDowser PR #6, seogeo PR #3, chromasmith-saas-starter PR #17). A run's own
    "working" comment is not proof of progress: list the repo's branches before trusting it.
  source: "LeadDowser issue #5, seogeo issue #2, chromasmith-saas-starter issue #16, 2026-09-10"
  applies_to:
    - reading the board after parallel dispatches
- id: GOTCHA-037
  date: 2026-09-11
  summary: "A verification step that greps for a phrase must use one that sits on a single line of the text being checked; the issue's own line wrapping can split it"
  detail: |
    The FF-026 issue asked the runner to confirm "What is true today" was present, but the issue's own
    replacement text wrapped that phrase across two lines, so a single-line grep could never match. The
    runner flagged the false failure and verified the phrase line by line. Pick verification phrases from
    inside one line of the new text.
  source: "forgeflow issue #2 (run FF-026), 2026-09-10"
  applies_to:
    - every dispatched issue or prompt that names grep checks for inserted text
- id: GOTCHA-038
  date: 2026-09-11
  summary: "A tightening run can redraw box-drawing diagrams and hide a dropped rule behind a line-range mapping, while its inventory still reads N/N"
  detail: |
    LeadDowser PR #6 mapped 208/208, yet every wireframe border changed width, an annotation was dropped, and
    INV-054 ("one scale for every screen size") was mapped to rules.type:75-87 and appeared nowhere. Review
    compares every diagram line to the original with indentation stripped, and treats any range mapping as
    unverified until the item's exact text is found. Fixed in 5603aa8; FF-027 items (a) and (b).
  source: "LeadDowser PR #6 (F1, F2), fix 5603aa8"
  applies_to:
    - reviewing tightening PRs
- id: GOTCHA-039
  date: 2026-09-11
  summary: "Tightening drops rule ids on conversion to prohibitions, rewrites instructions as claims, and invents triggers or tags for undecided items; the count shows none of it"
  detail: |
    LeadDowser PR #6 dropped ids and names (EN3 LINT-TOKENS and nine more), turned "ALSO go to the rulings
    register" into "are also filed", and set undecided DS-U4 to DEFERRED with a trigger no source stated.
    seogeo PR #3 used a non-standard OPEN tag. saas-starter PR #17 turned the ROUTES "must be" rule into a
    description and reframed a single-app ruling as an open question. Review reads every status line, every
    converted prohibition and every "is" that used to be a "must". FF-027 items (c) to (e).
  source: "LeadDowser PR #6, seogeo PR #3, chromasmith-saas-starter PR #17"
  applies_to:
    - reviewing tightening PRs
- id: GOTCHA-040
  date: 2026-09-11
  summary: "Moving a document's append-only log to the history companion removes the channel it provided; the tightened document needs a rule naming where new entries go"
  detail: |
    START_HERE.md's Friction Log was the template team's inbox for new friction. The tightening moved it to
    START_HERE-history.md and left a line pointing at a log that no longer existed. Fix 7319dae names
    .forge/template-friction.yaml as the place new template friction is appended. FF-027 item (h).
  source: "chromasmith-saas-starter PR #17 (T1), fix 7319dae"
  applies_to:
    - tightening any document that carries a log or inbox section
- id: GOTCHA-041
  date: 2026-09-11
  summary: "To hand another repo's next session a list of observations mid-session, commit a new .forge/inbox file there; never rewrite that repo's backlog"
  detail: |
    A repo's backlog and handoff are wrap-only, and rewriting them whole through the connector risks the
    placeholder loss in GOTCHA-033 (convergible's backlog carries angle-bracket tokens). A small new inbox
    file is listed by that repo's next start and consumed by its wrap. Used for convergible c3316c6; the six
    fixable items were then closed by a dispatched run in the same session (FORGEFLOW-FIX-1, 7c4fb77) and
    the one needing a local machine was carried in that run's own inbox file.
  source: "convergible c3316c6 and PR #7 (7c4fb77), 2026-09-11"
  applies_to:
    - cross-repo observations raised in a forgeflow session
- id: GOTCHA-042
  date: 2026-09-11
  summary: "Grepping a rendered protocol file for a block ID does not prove the block rendered; the BLOCK MANIFEST header names every excluded block by ID too"
  detail: |
    Run CV-RERENDER-UI-1 had to prove S-027, S-056, S-077 and E-032 now render in chromasmith/convergible.
    Each ID also appeared in the old render, on the manifest's excluded lines. Proof is the manifest's
    included line or the block's own section header line ("# --- S-027 ui_conformance ..."). A block with
    reader cw is excluded from the dispatch files by reader, which is correct.
  source: "run CV-RERENDER-UI-1 inbox (forgeflow fdfc842), 2026-09-11"
  applies_to:
    - every prompt or review that checks which blocks a render includes
- id: GOTCHA-043
  date: 2026-09-11
  summary: "The ceiling fixture called the maximum knob set is not the maximum, and render.py does not enforce file ceilings; the first ui_inventory repo breached the dispatch-start ceiling with the suite green"
  detail: |
    master/tests/fixtures/config-tools-max.yaml carries no ui_inventory, artifact register, database-access
    doc, repo-rules doc or companion repo. At master v1.4.2 it renders start-protocol.dispatch.yaml at 640
    lines; chromasmith/convergible with ui_inventory renders 659; every subsystem on renders 710 (Claude Web
    sandbox, 2026-09-11). render.py writes an over-ceiling file without complaint; only test_render.py
    (against the fixture) and RENDER_PROCEDURE step 5 (by hand) check. Every render session runs wc -l on its
    own output against the current ceilings. Ceiling raised to 850 by RULING-034 (17050d6); fixture fix FF-035.
  source: "convergible ui_inventory re-render, 2026-09-11 (RULING-034 17050d6)"
  applies_to:
    - master/tests/fixtures/config-tools-max.yaml
    - master/tests/test_render.py
    - master/RENDER_PROCEDURE.md (step 5)
