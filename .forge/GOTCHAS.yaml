# GOTCHAS.yaml
# Lessons learned for future Claude Code sessions in this repo

- id: GOTCHA-001
  date: 2026-09-04
  summary: "render.py read the render_when literal 'none' as YAML null, so every '== none' block silently never rendered"
  detail: |
    build.validation and build.deploy are ENUMS whose legal values include the STRING "none".
    parse_literal() treated the condition token "none" as None, so "build.validation == none"
    (S-083) and "build.deploy == none" (S-085) were always false, and "build.deploy != none"
    (E-023) was always true — a no-deploy repo received a wrap step reading "deploys via none"
    and no local validation/deploy steps at all. The fixture tests were green because every
    fixture that exercised those blocks was on the standard profile (npm-build/vercel). Found
    on the first real render (seogeo, docs-only). Fixed in commit 1f0d1d0: only "null"/"None"
    mean null. Lesson: before rendering a repo, diff old-vs-new renders for THAT repo's profile
    and read the block manifest against the repo's real shape; a green fixture suite proves
    only the shapes the fixtures cover.
  source: "first real render, 2026-09-04 (forgeflow commits 1f0d1d0, 90209d0)"
  applies_to:
    - master/render.py (parse_literal, eval_condition)
    - master/start-protocol.master.yaml (S-083, S-085)
    - master/end-protocol.master.yaml (E-023)
    - master/tests/test_render.py
- id: GOTCHA-002
  date: 2026-09-04
  summary: "A Claude Web session rendering ANOTHER repo writes forgeflow's own .forge/ docs at its wrap — a second Claude Web session on forgeflow can collide with it"
  detail: |
    forgeflow is the render SOURCE, so a Claude Web session that renders saas-starter (or any
    repo) also commits to forgeflow at its wrap: registered-repos.yaml, handoff.yaml,
    session-state.yaml, session-history.yaml, rulings.yaml. Matt reported the other session as
    "read-only, just using the repo" — true mid-render, false at its wrap. The self-render
    session paused until that wrap (827dba9) landed, then re-cloned. Lesson: the concurrency
    question before writing to forgeflow is "is any OTHER CLAUDE WEB session mid-render or
    about to wrap?", not only "is a Claude Code session active?". Re-clone after it lands;
    a clone taken before the other wrap is stale.
  source: "forgeflow self-render session, 2026-09-04 (RULING-004; wait for 827dba9)"
  applies_to:
    - master/RENDER_PROCEDURE.md (step 0 / step 7 concurrency question)
    - .forge/handoff.yaml (watch_out_for)
- id: GOTCHA-003
  date: 2026-09-04
  summary: "A knob override recorded in an earlier ruling was filed into a new ruling before the target repo was inspected — and it was wrong"
  detail: |
    RULING-002 predicted that chromaqa's config must override subsystems.chromaqa to false
    because render.py would "mis-detect" the tool's own chromaqa-check.sh. When Matt named
    chromaqa (RULING-005), Claude Web restated that override in the ruling text from memory
    of RULING-002, then inspected the repo and found it genuinely RUNS ChromaQA on itself
    (.github/workflows/quality-gate.yml, a committed .chromaqa/CQA-debt.jsonl, and a CLAUDE.md
    decision of 2026-09-03 saying so). Detection was correct; the override would have
    stripped the debt check, push-gate rule and CI-reading blocks from a repo that needs
    them. Corrected by RULING-006 in the same session. Lesson: a render_when knob prediction
    made about a repo in an earlier session is a hypothesis, not a fact — list the target
    tree (workflows, .chromaqa/, CLAUDE.md) BEFORE writing any ruling or config that names
    a subsystem override, and write only what the tree shows.
  source: "chromaqa render session, 2026-09-04 (RULING-005 e909725, RULING-006 f0e348b)"
  applies_to:
    - master/RENDER_PROCEDURE.md (step 0 preconditions — inspect before configuring)
    - .forge/rulings.yaml (RULING-002 clause superseded by RULING-006)
- id: GOTCHA-004
  date: 2026-09-04
  summary: "A cut-off earlier instance of the SAME Claude Web chat can already have landed a write (RULING-007 @ 220a70e) — re-read the target file's blob SHA before every append, even one you 'know' is first"
  detail: |
    Matt's page glitched and the chat restarted mid-turn. The cut-off instance had already
    appended RULING-007 to .forge/rulings.yaml (220a70e) in the turn he named synclips-platform;
    the resumed instance was about to append the same ruling as RULING-007 again. It was caught
    only because the write step re-fetched rulings.yaml and its blob SHA had changed from the
    session-start read. Lesson: GOTCHA-002's "another session may have written here" applies to
    a previous instance of YOUR OWN conversation, not only to other chats; treat a changed blob
    SHA as "read it again and reconcile", never as a conflict to overwrite. Check the file's
    current tail for your own intended entry before assigning the next ID.
  source: "Synclips trio render session, 2026-09-04 (RULING-007 at 220a70e found already landed)"
  applies_to:
    - .forge/rulings.yaml (W-002 write-when-made appends)
    - master/RENDER_PROCEDURE.md (step 0 concurrency question)
- id: GOTCHA-005
  date: 2026-09-05
  summary: "On Surface 12 `op whoami` reports 'not signed in' while every 1Password data command works — use `op vault list` as the readiness check; secrets piped from `op read` need .Trim()"
  detail: |
    The 1Password CLI's whoami lies on Matt's Surface 12 (reports no session while op read /
    op item edit / op vault list all succeed). A prompt that gates on whoami stalls for
    nothing. Also: `op read` emits a trailing newline, and `gh secret set` stores it — the
    working install line is
      (op read "op://Chromasmith Keys/CLAUDE_CODE_OAUTH_TOKEN/credential").Trim() | gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo chromasmith/<repo>
    Never use the vault's ANTHROPIC_API_KEY for the dispatch harness (per-token billing);
    the harness wants the subscription token (sk-ant-oat*) created by `claude setup-token`.
  source: "secrets install for the v1.1.0 rollout, 2026-09-05 (Claude Code run SETUP-TOKEN; RENDER_PROCEDURE step 0b @ ab19c0e)"
  applies_to:
    - master/RENDER_PROCEDURE.md (step 0b)
    - master/PROPAGATION_PROCEDURE.md (step 2b)
- id: GOTCHA-006
  date: 2026-09-05
  summary: "The GitHub connector's push_files JSON-escapes backslashes — it doubled every backslash in render.py (38af6dc); the repair is 43146f8"
  detail: |
    push_files landed master/render.py (38af6dc) with `\\n` where the source had `\n`, so the first
    v1.1.0 code commit shipped a renderer (38af6dc) that ran but produced wrong output. Caught only
    because the sandbox blob SHA was compared to GitHub's after the push. Lesson: prefer
    create_or_update_file (one file per call) for any file containing backslashes, and ALWAYS
    prove a landing by `git hash-object <sandbox file>` == the blob SHA GitHub returns —
    never by "the commit exists". Large text sets that will not fit the connector at all go
    through ONE Claude Code prompt carrying a gzip+base64 patch and a blob-SHA table
    (b421783 landed seven master files that way).
  source: "master v1.1.0 landing, 2026-09-05 (38af6dc broken, 43146f8 repaired, b421783 patch route)"
  applies_to:
    - master/render.py
    - master/RENDER_PROCEDURE.md (landing step)
- id: GOTCHA-007
  date: 2026-09-05
  summary: "A landed master change (e.g. b421783) updates NOTHING any repo reads until that repo is re-rendered; and the renderer's 'DISPATCH OFF - harness not installed' line is a correct message, not a failure"
  detail: |
    After b421783 every rendered repo still carried v1.0.0 text until its own re-render
    landed (forgeflow e60eff5..f9b8d33 was the first); a session that reads the new master and then a rendered protocol sees a mismatch
    that is expected. Report protocol behaviour as changed only for repos whose registry row
    says v1.1.0. Separately: rendering a repo whose tree has no .github/workflows/claude.yml
    prints "DISPATCH OFF - harness not installed" on stderr and renders S-092 — that is the
    v1.1.0 design (FFD-001), not a broken renderer; the fix is Matt installing the workflow
    file, never a config override.
  source: "FF-V110-MASTER inbox reflections + the four re-renders, 2026-09-05"
  applies_to:
    - master/PROPAGATION_PROCEDURE.md
    - master/render.py (dispatch detection)
- id: GOTCHA-008
  date: 2026-09-05
  summary: "create_or_update_file can ABORT with no result on a ~80-90 KB file and fails outright near 110 KB — retry, then prove by blob SHA; a start protocol that renders above ~100 KB needs a Claude Code prompt to land"
  detail: |
    seogeo's 78 KB start protocol aborted once mid-call with no tool result, then landed (a94d846) on
    the identical retry; an earlier ~110 KB attempt failed outright, which is why
    v1.1.0's text half went through a Claude Code patch (GOTCHA-006). The call is idempotent
    (same content, same target SHA), so a retry is safe; the landing (e.g. a94d846) is proven by comparing
    the returned blob SHA to git hash-object of the sandbox file. Today's largest rendered
    file was saas-starter's 93 KB start protocol (f3110b0) — repos with more subsystems
    (synclips-platform with the monorepo + companion blocks) may cross the line; check
    `wc -c` on the render output before choosing the landing route.
  source: "seogeo and saas-starter re-renders, 2026-09-05 (a94d846, f3110b0)"
  applies_to:
    - master/RENDER_PROCEDURE.md (landing step)
- id: GOTCHA-009
  date: 2026-09-06
  summary: "A base64/gzip blob pasted inside a Claude Web reply arrives CORRUPTED — never transport a master change that way; push a self-verifying apply script to a temporary branch through the connector and let Claude Code fetch it"
  detail: |
    The first v1.2.0 landing prompt carried the master change as a 31 KB gzip+base64 block for
    Claude Code to decode. It arrived with multi-character damage (SHA-256 mismatch; the recovered
    payload was the right LENGTH, 70,425 bytes, but failed the gzip CRC; git apply --check rejected
    it at line 351; an exhaustive single-character repair search found no fix). The cause is the
    transport itself: a token model cannot emit tens of KB of opaque base64 reliably, and the
    encoding has no redundancy, so one slip is fatal and invisible until decode. Nothing was applied
    — the run's SHA-256 guard caught it before a byte touched the repo. The route that worked, first
    try: write the change as a PYTHON APPLY SCRIPT of exact-match replacements (each asserts its
    target text exists exactly once, so a wrong start state or a transcription slip fails loudly
    before saving) that ends by printing git hash-object of every file it wrote against the expected
    blob SHA; push that script through the connector to a temporary branch (tmp/<name>; prose
    survives the connector, and the returned blob SHA proves the landing); have Claude Code
    `git fetch origin tmp/<name>:refs/remotes/origin/tmp/<name>`, `git restore
    --source=origin/tmp/<name> -- <script>`, prove the script's blob SHA, run it, delete the scratch
    file, then commit the named files. Prove the whole route from a fresh clone in the sandbox BEFORE
    handing the prompt over. Side lesson from the failed run: when a gzip payload fails its CRC,
    gzip.decompress discards everything; decompressing as raw deflate (skip the 10-byte header and the
    null-terminated name, then zlib.decompressobj(-15)) recovers the damaged bytes for diagnosis.
  source: "v1.2.0 landing, 2026-09-06 (halted run reported in chat — no inbox file; successful run FF-V120-MASTER @ 54c1293 / 8ec708c via branch tmp/v120-apply blob 82288e6)"
  applies_to:
    - master/RENDER_PROCEDURE.md (landing step — anything the connector cannot carry directly)
    - master/PROPAGATION_PROCEDURE.md (step 5)
    - .forge/handoff.yaml (watch_out_for)
- id: GOTCHA-010
  date: 2026-09-06
  summary: "Matt's Surface 12 has a main-only pre-push guard that also blocks branch DELETIONS — a transport branch is deleted in the GitHub browser UI, never by Claude Code and never with --no-verify"
  detail: |
    C:\Users\chrom\.config\git\hooks\main-only-guard.sh (a global pre-push hook) rejects any push
    whose target is not main, and a `git push origin --delete <branch>` counts as a push to that
    branch: "MAIN-ONLY GUARD: Push rejected. Attempted branch: tmp/v120-apply". Claude Code correctly
    stopped instead of skipping the guard. The connector has no branch-delete tool either (it can
    create a branch and write files on it, not remove it). So a prompt that creates or uses a
    transport branch must NOT ask Claude Code to delete it; it ends with a one-line Matt action:
    https://github.com/chromasmith/<repo>/branches, trash icon. Note the branches page lists the same
    branch under "Your branches" and "Active branches" — one delete removes both; the second row is a
    stale render of the page, not a second branch (verify with the connector's list_branches).
    Dispatched runners are unaffected (they push from the runner, not this machine).
  source: "FF-V120-MASTER run report, 2026-09-06; branch confirmed gone via list_branches"
  applies_to:
    - master/RENDER_PROCEDURE.md (landing step)
    - master/PROPAGATION_PROCEDURE.md (step 5)
    - prompts that use a tmp/ transport branch
- id: GOTCHA-011
  date: 2026-09-06
  summary: "Claude Code on Surface 12 runs PowerShell / Git Bash, not cmd.exe — the master's STEP 0 and completion steps still emit cmd syntax, which every run must translate (FF-011)"
  detail: |
    S-032 / S-036 emit `cd /d`, `if not exist ... mkdir`, and prompts inherit `del`, `copy /Y`,
    `rmdir /S /Q` and backslash paths; S-036 even says the cmd forms are "safe there". The
    FF-V120-MASTER run reported that the session had PowerShell and Git Bash only, and translated
    every command to its Git Bash equivalent (`cd`, `mkdir -p`, `rm -f`, `cp -f`, `rm -rf`, forward
    slashes) — correctly, but that is a per-run tax and an invitation to a slip. Until FF-011 lands
    in the master, write prompt commands for this machine in Git Bash syntax, and treat PowerShell
    redirection (`>`) as suspect for file content (it re-encodes output; use git restore/show
    --output or a Python one-liner instead). Cosmetic: the Windows console renders the em-dash in
    render.py's and the apply script's success lines as a stray "?" — it is not corruption; the blob
    SHA is the proof.
  source: "FF-V120-MASTER inbox reflections, 2026-09-06"
  applies_to:
    - master/start-protocol.master.yaml (S-032, S-036, S-043)
    - master/end-protocol.master.yaml (E-021)
    - every local Claude Code prompt written for Surface 12
