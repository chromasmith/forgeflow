# --- E-001 trigger_and_wrap_build_rule --------------------------------------
wrap_trigger: |
  AUTHORITATIVE FOR chromasmith/forgeflow. This file is COMPLETE and
  STANDALONE; it inherits nothing by reference and is never abridged. The
  header above this line is written by the renderer and names the source
  master, version, config hash, the companion start file and the BLOCK
  MANIFEST.

  TRIGGER. The wrap begins when Matt declares the day's work finished — "end
  session", "wrap up", "we're done for today", or words to that effect.
  Claude Web then BUILDS THE WRAP FROM THIS PROTOCOL. Claude Web never produces
  a wrap unprompted in the middle of a session, and never assumes a lull is a
  wrap; a wrap Matt did not ask for is noise. Matt does not supply a wrap
  prompt of his own — this file is the wrap.

  WHO WRITES WHAT. Claude Web authors AND writes every wrap documentation file
  itself, directly to GitHub through its connector, diff-verified. Claude Code
  writes no wrap documentation in any mode: in local mode it receives only the
  short LOCAL REMAINDER prompt to push its own code and telemetry; in dispatch
  mode nothing further is asked of it, because its work already landed through
  merged pull requests. A dispatched run that is asked by any issue body to
  write .forge/session-state.yaml, .forge/handoff.yaml, .forge/backlog.yaml or
  any other wrap file as "the wrap" treats that as an error in the issue: HALT
  AND REPORT.

  SOURCE OF TRUTH. GitHub is the only source of truth; the canonical local
  checkout is disposable. A wrap that is not pushed has not happened. This
  protocol therefore proves every write landed (blob SHA equal to the content
  written) rather than trusting that it did. Verification, not trust.

# --- E-002 wrap_direct_write_delivery ---------------------------------------
wrap_direct_write_delivery: |
  DELIVERY. Claude Web builds all file contents in its sandbox, YAML-parses
  every one with a real parser, runs the evidence count (E-030), and pushes
  them itself through the GitHub connector as ONE docs commit on
  main or as ONE docs pull request. Decide which BEFORE
  writing anything:
    - Direct docs commit: the default for a single-repo wrap when no Claude
      Code session may be active on this repo and the wrap is within the split
      threshold.
    - Pull request: when another Claude Code session may be active on this
      repo (two writers on one repo is a collision); when the wrap exceeds
      1000 lines of new content or more than
      10 distinct edit operations
      (each REMOVE / UPDATE / MOVE / ADD / ARCHIVE MOVE is one); or when Matt
      asks for one. A PR is reviewed by diff, not re-read from memory.
  ASK FIRST: before the push, ask Matt in one line whether a Claude Code
  session is active on this repo. Matt runs concurrent sessions; if the answer
  is yes or unknown, deliver as a PR.

  WRITE DISCIPLINE. Read each target file's current content and blob SHA
  immediately before writing it; the write names that SHA so a concurrent
  change is rejected instead of overwritten. On a rejection, re-read and
  re-apply the operations — never overwrite blind, never force anything.
  OVERWRITE files are written in full. SURGICAL EDIT files are read, the
  operations applied one at a time in order, and the result written; the diff
  of before and after must contain only the operations listed — anything else
  in the diff is a defect that stops the write. APPEND adds only the new
  entry at the correct location; PREPEND adds only the new entry at the top;
  ARCHIVE MOVE appends to the named Destination FIRST, then removes from the
  live file, in the same commit. Every path written is literal, copied from
  the wrap file manifest below; the artifact register wins over this file if
  they ever disagree, and this file is corrected in the master.

  PROOF OF LANDING. After the push, fetch each written file and compare the
  blob SHA GitHub reports with the SHA of the content written (git
  hash-object in the sandbox). Equal means landed; anything else means the
  wrap is not done. Report to Matt in plain English: what changed in each
  file, in one line per file, then the commit SHA or PR number.

  DIRECT EDITS ARE FOR THE DOCUMENTATION LAYER ONLY. Application code,
  migrations, configuration and workflow files remain Claude Code's work
  through prompts; the wrap never touches them. Protocol files under
  .forge/protocols/ are never edited here — a protocol bug is a master bug,
  filed against the master and re-rendered.

# --- E-003 wrap_file_manifest -----------------------------------------------
wrap_file_manifest: |
  EVERY PATH THIS WRAP MAY WRITE. All literal, none inferred. The list must
  agree with .forge/protocols/artifact-register.yaml; the register wins.

    .forge/session-state.yaml                      OVERWRITE
    .forge/active-bugs.yaml                        SURGICAL EDIT
    .forge/session-history.yaml                    APPEND (cap 15)
    .forge/backlog.yaml                            SURGICAL EDIT
    .forge/GOTCHAS.yaml                            APPEND (consolidate at 100 or every 1 month, its own session)
    .forge/rulings.yaml                            APPEND (confirm every ruling made this session landed)
    .forge/handoff.yaml                            OVERWRITE
    CHANGELOG.yaml                                 PREPEND (cap 12, quality gate)
    .forge/archive/session-history-archive.yaml    APPEND, oldest-first
    .forge/archive/GOTCHAS-archive.yaml            APPEND, oldest-first  <- the ONLY GOTCHAS archive
    .forge/archive/CHANGELOG-archive.yaml          APPEND, newest-at-top
    .forge/archive/backlog-archive.yaml            APPEND, oldest-first (completed items older than 30 days)
    .forge/archive/inbox/<run-id>.yaml             MOVE from .forge/inbox/<run-id>.yaml (consumed observation files)

  ONE ARCHIVE PATH PER FILE CLASS. Every archive lives under .forge/archive/
  at the path named above. An archive file for the same class at any other
  path — a second GOTCHAS archive beside .forge/ for example — is a defect to
  surface as a new GOTCHA, never a place to write, even if it looks
  established. Before creating any archive file, grep the repo for an existing
  file serving that purpose; a discrepancy is HALT AND REPORT, never a second
  copy.

  The paths .forge/protocols/ and .forge/specs/ are OFF LIMITS to the wrap,
  with exactly the exceptions named in this file (the conditional schema
  refresh, where the repo has a database).

# --- E-005 scope_reconciliation ---------------------------------------------
scope_reconciliation: |
  STEP 0 — SCOPE RECONCILIATION (run BEFORE anything else). The evidence is
  the session's observation inbox files, .forge/inbox/<run-id>.yaml, one per
  run, written by Claude Code before any prose report — plus, for a local
  session, the AUTHORIZED FILES list of each prompt Claude Web generated. For
  every run of the session collect: the AUTHORIZED FILES list emitted for it;
  the SCOPE DISCLOSURE; the ARCHITECTURE DISCLOSURE where asked; the UI
  CONFORMANCE answer where asked; the RUNNER ENVIRONMENT answer where asked;
  the ARTIFACT PATHS answer where the run created files. A run with no inbox
  file is a missing disclosure, recorded as such (E-024), never assumed clean.

  Build the consolidated list:
    - Session-authorized scope: every file that appeared on any AUTHORIZED
      FILES list this session.
    - Disclosed drift: every file Claude Code admitted touching that was NOT
      authorized.
    - Suspected drift: any file Claude Code is likely to have touched that
      was neither authorized nor disclosed, based on the friction you saw.
    - ARTIFACT-PATH DEFECTS: every instance where a prompt or issue named an
      artifact without its exact path, or where Claude Code created a file at
      a path the prompt did not name. Treat exactly like scope drift: surface
      it, and log a GOTCHA naming the PROMPT defect and the register rule it
      violated, not the run's behaviour.
    - Additional classes this repo renders (architecture drift, UI drift,
      parallel collisions, spike contamination, database state changes) are
      defined in their own sections of this file.

  If there is ANY disclosed or suspected scope drift: do NOT write the wrap
  yet. Report it to Matt in plain English — which files were modified outside
  the authorized scope, what you think happened and why — with ONE
  recommendation among the three outcomes: (a) accept the edits and record
  them in a separate, honestly labeled commit; (b) revert them; (c) bring them
  into scope retroactively and log a GOTCHA about the pattern. Wait for his
  ruling, then fold the outcome into the wrap (a separate commit, a GOTCHA
  entry, or both). Scope drift BLOCKS the wrap until Matt rules.

  Every other class is surfaced in one or two plain-English lines, gets a
  GOTCHA where the cause was a prompt defect, and is folded into
  handoff.yaml watch_out_for. None of them blocks the wrap; none passes
  silently. If there is no drift of any kind, proceed silently to STEP 1.

# --- E-006 identify_project -------------------------------------------------
identify_project: |
  STEP 1 — IDENTIFY PROJECT. This wrap is rendered for chromasmith/forgeflow;
  canonical local checkout C:\Chromasmith\forgeflow (the ONLY local
  location; folder name matches the GitHub repo name exactly, including
  casing); default branch main. Confirm the session's work
  was on this repo. If the conversation was about a different repo, STOP —
  open that repo's own wrap protocol; a wrap run against the wrong repo is a
  stop, not a warning. The header's config hash identifies the exact knob set
  this file was rendered from; there are no variants to choose between.

# --- E-007 read_current_state -----------------------------------------------
read_current_state: |
  STEP 2 — READ CURRENT STATE. Read, from GitHub at main
  HEAD, the current contents of every file this wrap may write, at these exact
  paths, and record each file's blob SHA for the write step:
      .forge/session-state.yaml
      .forge/active-bugs.yaml
      .forge/session-history.yaml
      .forge/backlog.yaml
      .forge/GOTCHAS.yaml
      .forge/rulings.yaml
      .forge/handoff.yaml
      CHANGELOG.yaml
  Also list .forge/inbox/ (the session's observation files) and check
  whether each archive file under .forge/archive/ exists. If any file does
  not exist, note that it will be created and use the matching template from
  initialization_templates in this file; grep first for a file already
  serving that purpose (R3). Never write a file you have not read in this
  wrap.

# --- E-008 verify_before_you_write_and_evidence -----------------------------
verify_before_you_write_and_evidence: |
  STEP 2b — VERIFY BEFORE YOU WRITE. Every factual claim the wrap is about to
  write — in session-state, the handoff, a backlog status, an active-bugs
  entry, a session-history line — is checked against its source of truth NOW,
  before it is written, never composed from belief or from memory of the
  session:
    - A claim about the repo (a file exists, a PR merged, a line says X, a
      commit landed) is verified by reading that file, commit or PR on GitHub
      now.
    - A claim about the database (rows exist, a backfill landed, a status
      flipped) is verified by a query now, with full-catalog visibility.
    - A universal claim ("every X has a Y", "all N rows") is verified by a
      count, and the count is written next to the claim.
    - A claim that cannot be verified this session is written in REPORTED
      form ("Claude Code reports X — unverified, no PR fetched") or left out.
      It is never written as fact.
  Status fields are validated: every backlog status is one of
  ready | blocked | needs-ruling | in_progress | deferred | completed |
  superseded. Any status the wrap sets is re-read against that item's own
  description before it is written; the two must agree, and the description
  wins. A needs-ruling status is checked against .forge/rulings.yaml and
  corrected if the ruling already exists.

  EVIDENCE RULE (binding on every wrap write). Every state-change claim —
  complete, shipped, merged, deployed, fixed, passing, landed, proven, live —
  carries the identifier of the artifact Claude Web actually fetched to check
  it: commit SHA, PR number, CI run ID, deployment ID, or "query result" with
  the count. A claim with no identifier is written in reported form, never in
  verified form. Claude Web never writes an unqualified completion claim from
  a Claude Code report alone. THE COUNT IS COMPUTED, NOT ESTIMATED: before the
  push, run the renderer's companion check (python3 render.py evidence, from
  the forgeflow master, against the wrap's changed .forge/ files or their
  diff) in the sandbox. It prints "N claims verified by ID, M reported
  unverified, K unmarked". K must be 0 — fetch the artifact or rewrite the
  line in reported form. A wrap recording no state changes at all in a
  session that produced commits is itself flagged and must be explained.

  EVERY WRAP-WRITTEN YAML FILE IS PARSED BY A REAL PARSER in the sandbox
  before it is pushed; a parse failure stops the wrap. Traps: a plain scalar
  containing colon-space mid-sentence, and a comma inside a flow-mapping
  value, both fail to parse — quote them. The wrap's report lists which
  claims were verified and how.

# --- E-009 session_state_overwrite ------------------------------------------
session_state_overwrite: |
  STEP 3 — SESSION STATE (OVERWRITE .forge/session-state.yaml). A fresh
  snapshot; previous content is replaced entirely. Include milestones
  achieved, key decisions (with rationale and impact), blockers, next_steps,
  and critical context. Unmerged pull requests are NEVER milestones — an
  unmerged PR is in_progress in both session-state and the backlog. next_steps
  carries the SAME single item as the handoff's first_thing (one-item agenda).
  Every milestone line carries its evidence identifier or is written in
  reported form.

  session_state_schema (write exactly this shape):
    session_date: [YYYY-MM-DD]
    project: [project name]
    milestones:
      - [terse description of what was completed — with commit SHA / PR number]
    decisions:
      - decision: [what was decided]
        rationale: [why, one line]
        impact: [what this affects going forward]
    blockers:
      - [unresolved blockers, or an empty list]
    next_steps:
      - priority: [high/medium/low]
        task: [the one first_thing item, specific and actionable]
    context: |
      [Critical info for next session that does not fit above — terse]

# --- E-010 bugs_surgical_edit -----------------------------------------------
bugs_surgical_edit: |
  STEP 4 — RECONCILE BUGS (SURGICAL EDIT .forge/active-bugs.yaml). The file
  holds ONLY currently unresolved bugs. Build an explicit operation list and
  apply it to the file you read in STEP 2 — never rewrite the whole file:
      Action: REMOVE id: [BUG-NNN]          <- fixed this session (evidence ID in the history entry)
      Action: KEEP id: [BUG-NNN]            <- still unresolved (no content needed)
      Action: ADD -> [full new entry block]      <- new unresolved bug discovered
  Before assigning a new ID, read the file and use the next unused
  BUG-NNN. The resulting diff contains exactly these operations
  and nothing else.

  active_bugs_schema:
    schema_version: "1.0"
    session_date: [YYYY-MM-DD]
    project: [project name]
    active_bugs:
      - id: [BUG-001, ...]
        summary: [one-line description]
        symptom: [what it looks like]
        context: [where/when it occurs]
        severity: [blocker/high/medium/low]
        notes: |
          [details, workarounds, theories]
    If no unresolved bugs remain the list is written as: active_bugs: []

# --- E-011 session_history_append -------------------------------------------
session_history_append: |
  STEP 5 — SESSION HISTORY (APPEND to the sessions list in
  .forge/session-history.yaml). Write ONLY the new entry, appended after the
  existing last entry with matching indentation; existing entries are never
  rewritten. If the live file holds 15 or more
  sessions, the ARCHIVE MOVE of the oldest session(s) runs BEFORE this append
  (E-015). Include date, a duration estimate, completed items, commits, key
  changes, files_modified and blockers_remaining.

  files_modified is AUDIT-GRADE: every file touched this session, derived
  from git log and diff of the landed commits — for work that landed through
  pull requests, from the merged PR diffs — never from memory. Files touched
  outside scope and accepted in STEP 0 are listed here too, marked
  "[out-of-scope, accepted]". commits carries the message and, where work
  landed by PR, the PR number and merge SHA. A spike session may legitimately
  show an empty files_modified; that is not an idle session, and the entry
  says what the spike proved.

  session_history_schema (the new entry only):
    - date: [YYYY-MM-DD]
      duration: [~Xhr estimate]
      completed:
        - [item that was finished — with its evidence identifier]
      commits:
        - message: [commit message; PR number and merge SHA where landed by PR]
      key_changes:
        - [significant changes made]
      files_modified:
        - [file path]    # ground truth from git, every file touched
      blockers_remaining:
        - [blockers carried forward, or an empty list]

# --- E-012 backlog_surgical_edit --------------------------------------------
backlog_surgical_edit: |
  STEP 6 — BACKLOG (SURGICAL EDIT .forge/backlog.yaml). Build an explicit
  operation list against the file you read in STEP 2 and apply it as surgical
  edits — the diff shows exactly these operations and nothing else:
      Action: REMOVE id: [FF-NNN]                          <- superseded or withdrawn
      Action: UPDATE id: [FF-NNN] -> set status: [value]    <- status changes only
      Action: MOVE id: [FF-NNN] -> prioritized to in_progress
      Action: MOVE id: [FF-NNN] -> prioritized to completed  <- with status: completed
      Action: ADD section: [prioritized|in_progress|completed] -> [full new item block]

  UNIFIED SCHEMA. The live sections are exactly prioritized, in_progress and
  completed. There is NO section named "backlog"; an ADD naming one misroutes
  silently. Name the section exactly as it appears in the file. The STATUS
  VOCABULARY is closed: ready | blocked | needs-ruling | in_progress |
  deferred | completed | superseded — any other word is a defect the wrap
  corrects. COMPLETED ITEMS LEAVE prioritized: the wrap that completes an
  item MOVEs it to completed with status: completed; a completed item never
  sits in prioritized with a note. Items in completed older than
  30 days ARCHIVE MOVE to
  .forge/archive/backlog-archive.yaml (oldest-first) when the wrap sees them,
  each move naming that literal Destination. Close any child item whose
  parent this session completed — a child left ready under a completed
  parent is a wrap defect. A needs-ruling status is checked against
  .forge/rulings.yaml and the item's own description. Deferred items that
  the handoff lists in next_up are marked so they are not mistaken for the
  next session's agenda. A repo still on an older backlog shape (a section
  named backlog, statuses such as prompt_ready) is migrated to this schema by
  a one-time surgical edit in its first wrap on this protocol, reported as
  such.

  backlog_schema:
    prioritized:
      - id: [FF-NNN]
        name: [task name]
        priority: [P0/P1/P2/P3]
        estimate: [time estimate]
        spec_ref: [reference to spec if applicable]
        description: |
          [what needs to be done]
        status: [ready | blocked | needs-ruling | in_progress | deferred | completed | superseded]
        blocked_by: [what is blocking, if blocked]
    in_progress: []
    completed: []    # entries older than 30 days rotate to .forge/archive/backlog-archive.yaml

# --- E-013 gotchas_append ---------------------------------------------------
gotchas_append: |
  STEP 7 — GOTCHAS (APPEND to .forge/GOTCHAS.yaml if new, otherwise skip).
  Review the entries read in STEP 2 and the discovered-GOTCHA lines the inbox
  files carry in final form. If any NEW lessons were learned, append ONLY the
  new entries; existing entries are never rewritten. FORMAT TRAP: the live
  file is a BARE TOP-LEVEL LIST — never indent appended entries; match the
  shape of the existing last entry rather than assuming a schema. Before
  assigning an ID, read the file and use the next unused GOTCHA-NNN.
  Gotchas are rarely deleted — they are permanent lessons. If there are no
  new entries and no archive move, this file is not touched.

  Log a GOTCHA for: a scope-drift pattern Matt chose to log (the friction
  that led to the drift, so it does not recur); architecture drift caused by
  an authorized list missing its /lib counterpart (name the PROMPT defect);
  an artifact-path defect (name the prompt defect and the register rule it
  violated); a silent halt; a runner permission gap; and any Claude Code
  catch worth keeping. New PERISHABLE build-environment specifics (tool
  quirks, allowlist changes, machine paths) belong in GOTCHAS, not in
  protocol text.

  gotchas_schema (append only new entries, at column zero):
    - id: [GOTCHA-NNN]
      date: [YYYY-MM-DD]
      summary: [one-line description]
      detail: |
        [full explanation of the problem and how to avoid it]
      source: [where this was discovered — issue/PR number, run id, or prompt]
      applies_to:
        - [file or context where this applies]

# --- E-014 handoff_overwrite ------------------------------------------------
handoff_overwrite: |
  STEP 7b — HANDOFF (OVERWRITE .forge/handoff.yaml, create if missing). The
  pass-the-baton briefing for the next Claude Web session. It is NOT a summary
  of what happened — it is a WARNING LETTER to a fresh session with no memory
  of this work, written as if briefing a capable colleague about to walk into
  the room mid-project. Focus on what will burn them if they are not ready,
  what to do first, and the emotional state of the project. Not architecture
  docs — the other .forge/ files hold state; this holds feel. Always
  overwrite; the file reflects right now, not history.

  STAMPS. written_at_commit is the HEAD SHA of main at the
  moment the handoff is written (the docs commit itself will follow it; the
  next session compares this SHA to HEAD and treats a mismatch beyond the
  wrap's own commit as a stale handoff). written_at_utc is the write time.
  Both are real values fetched now, never narrated.

  ONE-ITEM AGENDA. first_thing names EXACTLY ONE item — a specific file,
  function or exact change, why it matters, and what to verify when done.
  next_up is a RECORD of what was seen and deliberately deferred (each marked
  deferred in the backlog so it is not mistaken for the agenda); it is not a
  menu and it is not a prioritized list of second and third tasks. A menu of
  next steps is what invites drift.

  watch_out_for carries: the thing most likely to waste 30 minutes; scope
  pressure points (where sessions have drifted and the friction that causes
  it); architecture pressure points where they apply; any artifact-path
  defect found this session and the correct path; any parallel collision;
  perishable build-environment hazards; database state the repo cannot show;
  and any needs_ruling that reached the wrap unanswered, named as a protocol
  failure. status is an honest 3-4 line snapshot — what works, what is
  broken, what phase — naming every unmerged PR explicitly, with no spin.

  PROTOCOL DRIFT FIELD. If the handoff you read carries a protocol_drift
  line, carry it forward UNCHANGED — it was written by a propagation pass and
  only a re-render removes it. The wrap never adds one and never deletes one.

  handoff_schema (write exactly this shape):
    # .forge/handoff.yaml — chromasmith/forgeflow
    # Pass-the-baton briefing written BY the outgoing Claude Web session TO the next.
    # A WARNING LETTER, not a summary. The other .forge/ files hold state; this holds feel.
    # generated: [YYYY-MM-DDThh:mm:ssZ]
    # session: [YYYY-MM-DD]
    written_at_commit: [full HEAD SHA at write time]
    written_at_utc: [YYYY-MM-DDThh:mm:ssZ]
    status: |
      [Honest 3-4 line snapshot. Name any unmerged PR. No spin. End with the
       one-sentence overall project position.]
    first_thing: |
      [The single most important thing to do — specific file, function, exact
       change. Why it matters. What to verify when it is done.]
    watch_out_for:
      - "[The thing most likely to waste 30 minutes if you are not ready for it]"
      - "[Scope pressure points — the file and the friction that causes drift]"
      - "[Any artifact-path defect found this session, and the correct path]"
      - "[Database state, collisions, hazards, unanswered needs_ruling — as they apply]"
    next_up:
      - "[Deferred item, marked deferred in the backlog — a record, not a menu]"
    north_star: |
      [One sentence: did today's work make the product better, or only move the board?]
    tone: |
      [1-2 sentences. What kind of session is this? What does Matt need today?]

# --- E-015 archive_maintenance ----------------------------------------------
archive_maintenance: |
  STEP 7c — ARCHIVE MAINTENANCE. Run this check before writing; archive
  operations are part of the write plan for the affected file. EVERY ARCHIVE
  MOVE names its literal Destination path — never "the archive". Archive
  files are append-only and are never read at session start; they exist for
  the record.

    .forge/session-history.yaml — cap 15 sessions
      Count the sessions in the live file. At the cap or above, ARCHIVE MOVE
      the oldest session(s) BEFORE the append.
      Destination: .forge/archive/session-history-archive.yaml
      Ordering: OLDEST-FIRST in both files.

    .forge/GOTCHAS.yaml — consolidation trigger 100 entries
    OR 1 month since the last consolidation, whichever first
      The wrap NEVER performs the consolidation itself. When the trigger has
      fired, the wrap SAYS SO in the handoff and the consolidation runs as
      its own session, with Matt-set criteria. A wrap
      may archive individual entries it can justify one by one — the pattern
      no longer exists in the codebase, a later entry on the same topic
      supersedes it, or the file, route or feature it references was removed.
      A BULK prune toward a target number is its own session. Declining to
      prune, and saying so, is correct behavior, not failure. Below the
      trigger, no review is needed.
      Destination: .forge/archive/GOTCHAS-archive.yaml   <- the ONLY GOTCHAS archive
      Ordering: oldest-first, original numbering preserved.

    CHANGELOG.yaml — cap 12 entries
      Check only when a new entry passes the quality gate (STEP 8). At the cap
      or above, ARCHIVE MOVE the oldest entry BEFORE the prepend.
      Destination: .forge/archive/CHANGELOG-archive.yaml
      Ordering: NEWEST-AT-TOP in both files.

    .forge/backlog.yaml — completed entries older than 30 days
      ARCHIVE MOVE them as part of the backlog edit (STEP 6).
      Destination: .forge/archive/backlog-archive.yaml
      Ordering: OLDEST-FIRST in the archive.

  OPERATION DISCIPLINE (Claude Web performs every move itself under
  direct-write): append the full entry to the Destination FIRST, then remove
  it from the live file, then perform the normal write — all in the same
  commit, never stopping between the append and the removal. Create
  .forge/archive/ if it does not exist. Before creating any archive file,
  grep for an existing file serving the same purpose and HALT on a
  discrepancy rather than creating a second copy; a missing archive file is
  created from its initialization template. FIDELITY: count entries before
  and after in BOTH files, and diff the sorted line multiset of the landed
  source plus destination against the originals before declaring the move
  done. The count proves nothing was dropped; only the diff proves nothing
  was changed. Existing IDs are checked before any sequential ID is assigned.

# --- E-017 changelog_gate_schema_tone ---------------------------------------
changelog_gate_schema_tone: |
  STEP 8 — CHANGELOG QUALITY GATE (PREPEND to CHANGELOG.yaml if worthy,
  otherwise skip). Review the session for PUBLIC-WORTHY wins only. Ask:
  would a potential customer care? Would a potential buyer (an acquiring
  company) see value? Is it a visible, tangible improvement to the product?
  If YES to any: include it. If NO to all: the changelog is not touched this
  session. INCLUDE features shipped, architecture milestones, new
  integrations, infrastructure wins. EXCLUDE bug fixes, minor tweaks,
  internal refactors, friction, failures, and anything built but not proven —
  "shipped" means proven working, not just built. Output ONLY the new entry,
  prepended newest-first; run the cap check (E-015) first.

  GOOD entries: "PDF Export Now Available for All Reports", "Real-time
  Collaboration Added to Editor", "Stripe Integration for Subscription
  Billing", "Performance: Dashboard Loads 3x Faster". NOT changelog-worthy:
  "Fixed bug where button didn't work", "Updated dependencies", "Refactored
  database queries", "Added error handling", "Session state management
  improvements".

  changelog_schema (PREPEND the new entry to the entries list):
    entries:
      - date: [YYYY-MM-DD]
        slug: [url-friendly-identifier]
        title: "[Benefit-focused headline]"
        summary: "[User-facing description, 1-2 sentences]"
        category: [feature|milestone|improvement|integration|infrastructure]
        technical: "[Architecture/implementation details for developers and buyers]"
        tags:
          - [keyword]
        impact: "[Why it matters — business or user value]"

  TONE, field by field:
    title:     Confident, benefit-first, active voice. Never open with
               "Added" or "New" — that is filler.
    summary:   One or two sentences a non-technical person understands. The
               "so what".
    technical: Precise and credible. Name the tools, patterns and
               architectural decisions; this is for developers and buyers.
    tags:      What would someone search for? Include synonyms. 3-6 per entry.
    impact:    Strategic. Why it matters to the business or the user.
    voice:     Forward momentum, competence, active development — a record
               of wins written like a company that knows where it is going.
               No em dashes in customer-facing copy.

# --- E-019 rulings_confirm_landed -------------------------------------------
rulings_confirm_landed: |
  STEP 8c — RULINGS (CONFIRM, then APPEND to .forge/rulings.yaml only for
  misses). Rulings are written the moment they are made, in the turn Matt
  makes them, not at the wrap. At the wrap, list every ruling Matt made in
  chat this session and confirm each exists in .forge/rulings.yaml by reading
  the file now. Any ruling that is missing is appended now with the next
  unused RULING-NNN id, the date, the subject, the ruling in
  Matt's plain words, what it supersedes (if anything) and a source path to
  the governing file — and the miss is recorded in the wrap report, because
  it means the write-when-made rule failed. The register is append-only: a
  reversal is a new entry carrying supersedes: RULING-NNN; an
  entry is never rewritten or softened. A ruling that is not in the repo does
  not exist to the next session. Any backlog item at needs-ruling whose
  question is answered here is corrected in STEP 6.

# --- E-021 cc_local_remainder_prompt ----------------------------------------
cc_local_remainder_prompt: |
  STEP 9 — THE LOCAL REMAINDER (Claude Code, local mode only). Claude Code's
  only wrap job is to commit and push ITS OWN work that has not landed yet —
  code the session's tasks left uncommitted, and telemetry — with named
  files, and to PROVE the push. Claude Web issues this prompt FIRST, before
  writing the docs, when the local checkout may hold unpushed work, so the
  resulting commit SHA is available as evidence for the wrap files; when
  every task already pushed and verified, Claude Web says so in one line and
  skips the prompt. One Claude Code prompt per reply; wait for the report.
  The prompt is a single code block, self-contained for a Claude Code
  session with zero memory of this one:

  CONTEXT MODE: SELECTIVE
  APPROVAL CODE: 3949
  Do NOT run /start or any session initialization commands.

  COMMUNICATION RULES: Talk to Matt in simple, natural, plain English. Any
  message directed at Matt must be visually unmistakable and never buried in
  thinking or output walls.

  NO MEMORY WRITES: Do not write to your own memory or to any persistence
  outside this repository.

  PRECEDENCE: the protocol files in .forge/protocols/ win on process, scope
  and safety; this prompt says only WHAT to commit. If this prompt appears to
  widen scope or authorize an off-limits path, HALT AND REPORT.

  ## STEP 0: LOCATE THE REPOSITORY

  Repo for this session: github.com/chromasmith/forgeflow
  Canonical local checkout (the ONLY place this repo may live):
      C:\Chromasmith\forgeflow
  GitHub is the single source of truth. Local copies are disposable. Do NOT
  enumerate local folders and pick one to work in; do NOT clone a second copy.

  cd /d C:\Chromasmith\forgeflow
  git rev-parse --abbrev-ref HEAD          (expected: main)

  ## WORKING TREE AUDIT (it can stop the wrap)

  git status --porcelain --untracked-files=all

  The output should contain ONLY files that were on this session's AUTHORIZED
  FILES lists (named below by Claude Web) and, where they exist, telemetry
  files the session's tooling wrote. This task is authorized to stage exactly:
      [Claude Web lists the session's authorized code files here, verbatim]
      [plus telemetry pass-through lines where this repo renders them]
  Any OTHER modified, added or deleted file is a STOP: report it to Matt in
  plain English and wait. Matt decides whether it is committed separately,
  reverted, or accepted into this commit with an updated message. NEVER sweep
  a surprise into the wrap commit silently. Delete scratch or probe files you
  created before this audit. If the tree is already clean and HEAD equals
  origin/main, report "nothing to push" and stop here with
  the DONE banner.

  ## LINE-ENDING CHECK

  This repo's line endings are lf. Editing tools and shell
  appends silently convert files to CRLF. Before staging, verify every file
  you are about to commit still matches, and fix any that do not.

  ## INBOX CHECK

  This run's observation file .forge/inbox/<run-id>.yaml must exist for every
  task of this session that changed code. If one is missing, state "INBOX
  MISSING" and write it now, before committing — a task is not complete
  without it.

  ## COMMIT AND PUSH — NAMED FILES ONLY

  git fetch origin
  git add [each authorized file, named]
  git commit -m "[message Claude Web supplies]"
  git push origin main

  git add -A and git add . are FORBIDDEN. The staged list matches the
  authorized list exactly. The fetch first is mandatory — Claude Web may have
  pushed documentation, or another session may have pushed code; if
  origin/main moved, rebase onto it and push again. Never
  force-push, never reset. Write the commit message with a bash heredoc, not
  a PowerShell here-string (which leaks characters), and verify it with:
  git log -1 --format=%B | cat -A

  ## VERIFY PUSH — MANDATORY (the run is NOT done until all three pass)

  1. Working tree is clean:   git status --porcelain      (expected: no output)
  2. Local is not ahead:      git status -sb              (expected: no "[ahead N]")
  3. HEAD matches origin:     git fetch origin
                              git rev-parse HEAD
                              git rev-parse origin/main
                              (expected: identical hashes)
  If all three pass, print the proven state so it is recorded, not assumed:
  "Verified: GitHub matches local at commit [short hash]. Working tree clean."
  If ANY check fails, the run is NOT done: report which check failed and what
  git showed, fix it, and re-run all three. An unverified push is exactly
  the condition under which the next session's refresh of this checkout
  loses tonight's work.

  ## OUTPUT FORMAT

  When VERIFY PUSH has passed, announce in PLAIN TEXT (no color codes —
  Matt's terminal does not render them):

  *** DONE: code and telemetry committed and push verified at [short hash] ***

  The banner describes this task; it never implies the session or the project
  is finished.

  ## CONSTRAINTS
  - Do NOT propose next steps or recommended actions.
  - Do NOT show intermediate outputs.
  - Do NOT write, edit or generate any .forge/ documentation file; Claude Web
    writes those.
  - Use NAMED FILES in git add, never git add -A or git add .
  - Verify line endings before staging.
  - The push is mandatory AND must be VERIFIED.

  ## REPORT

  After completion, report in plain English:
  - What went wrong (if anything):
  - Workarounds used:
  - Files committed: [list] at [short hash]
  - PUSH VERIFICATION: [all three checks passed / FAILED — which check, what
    git showed, how resolved]
  - Working tree audit: [clean / unexpected files — list and how handled]
  - Line endings: [verified / fixed N files]
  - INBOX: [present for every run / written now for: ...]
  - SCOPE DISCLOSURE: Did you stage or modify any file outside the authorized
    list above? [Yes/No + detail]
  - ARTIFACT PATHS: Did this prompt ask you to write any file whose exact path
    was not stated? [Yes/No. If yes, name it — that is a protocol defect to
    log, not your error.]
  Write "No issues encountered" where a line is clean.

# --- E-024 inbox_consumption ------------------------------------------------
inbox_consumption: |
  STEP 11 — CONSUME THE OBSERVATION INBOX. Reconcile against RUNS, not
  against the directory: list every run of the session (each prompt issued
  locally, each issue dispatched) and state, per run, CONSUMED or MISSING.
  For each .forge/inbox/<run-id>.yaml: fold its reflection answers into the
  handoff and GOTCHAS as they apply; append its discovered-GOTCHA lines
  (already in final form) in STEP 7; use its SCOPE DISCLOSURE and ARTIFACT
  PATHS as STEP 0 evidence; then MOVE the file to
  .forge/archive/inbox/<run-id>.yaml — create it at the archive path and
  delete it from .forge/inbox/ in the same docs commit, content byte-identical.
  A run with no inbox file is a missing disclosure: it is named in the
  handoff's watch_out_for as "no inbox — observations lost for run <id>" and
  the wrap report says so. Any inbox file the wrap cannot consume is named as
  a loose end in the handoff, never silently left behind. A needs_ruling
  entry that reaches the wrap unanswered is a PROTOCOL FAILURE — it should
  have been surfaced on the first board advance — and the handoff names it as
  such, with the question and Claude Web's recommendation, so the next
  session opens on it.

# --- E-025 north_star_question ----------------------------------------------
north_star_question: |
  STEP 12 — THE NORTH-STAR QUESTION. Claude Web answers, in ONE sentence in
  the handoff's north_star field: "Did today's work make the product better,
  or only move the board?" Where the repo declares a north-star document, the
  answer is measured against it, not against the backlog. Moving the board
  (files reorganized, tasks re-filed, docs reshaped) is a legitimate answer
  when it is the honest one; the point is that it is written down as such.

# --- E-026 project_position_statement ---------------------------------------
project_position_statement: |
  STEP 13 — OVERALL PROJECT POSITION. When the wrap is done, Claude Web
  states the OVERALL PROJECT POSITION to Matt in one plain sentence — where
  the product or effort stands as a whole, not where the session stands. The
  same sentence closes the handoff's status field. A finished session, a
  green DONE banner or a completed milestone must never read as a finished
  project; if a milestone is complete but the project is not, say both in
  that sentence. The reply then ends, as every reply does, with the next step
  as a verb and who holds the ball.

# --- E-027 manual_fallback --------------------------------------------------
manual_fallback: |
  MANUAL FALLBACK — when the GitHub connector is down or a write is refused
  and cannot be retried this session, Claude Web gives Matt EXPLICIT web-editor
  instructions, one file at a time, one action per reply, waiting for his
  confirmation between files. FORMAT:

  "The connector isn't cooperating. Here's how to land this one file by hand:
   1. Go to: https://github.com/chromasmith/forgeflow/blob/main/.forge/session-state.yaml
      (If the file does not exist, go to
       https://github.com/chromasmith/forgeflow/new/main/.forge
       and name the file session-state.yaml)
   2. Click the pencil icon (Edit this file) at the top right
   3. Select ALL existing content and DELETE it
   4. Paste this EXACT content: [complete file content]
   5. Click Commit changes (green button), then in the dialog type this commit
      message exactly: docs: update session-state
   6. Click Commit changes again to finish"
  Then confirm the commit landed (fetch the file; blob SHA equals the content
  given) before offering the next file.

  RULES: full GitHub URLs, never an assumed path; COMPLETE file content for
  every file, never "add this to the existing file"; every click named; one
  file at a time; exact commit message; an uncompleted commit dialog silently
  loses the change, so each commit is confirmed before moving on; offer to
  verify the whole set at the end. A GitHub-web commit is on the source of
  truth by construction — there is nothing local to verify. Never instruct
  pasting any credential, token or real GUID anywhere. Where a deploy exists,
  the redeploy step follows the last file: go to the project's deploy target,
  click Redeploy on the latest deployment, wait for READY.

# --- E-028 file_behaviors_summary -------------------------------------------
file_behaviors:
  forge_directory:
    path: .forge/
    action: CREATE IF MISSING
  forge_archive_directory:
    path: .forge/archive/
    action: CREATE IF MISSING
  inbox_directory:
    path: .forge/inbox/
    action: CREATE IF MISSING (written by Claude Code per run; emptied by the wrap)
  inbox_archive_directory:
    path: .forge/archive/inbox/
    action: CREATE IF MISSING (consumed inbox files move here)
  session_state:
    path: .forge/session-state.yaml
    action: OVERWRITE
    claude_web_writes: complete file content
  active_bugs:
    path: .forge/active-bugs.yaml
    action: SURGICAL EDIT
    claude_web_writes: the result of REMOVE / KEEP / ADD operations, diff-checked
  session_history:
    path: .forge/session-history.yaml
    action: APPEND
    claude_web_writes: only the new entry
    cap: "15 sessions"
    archive_destination: .forge/archive/session-history-archive.yaml
    ordering: oldest-first in both files
  backlog:
    path: .forge/backlog.yaml
    action: SURGICAL EDIT
    claude_web_writes: the result of REMOVE / UPDATE / MOVE / ADD operations, diff-checked
    sections: prioritized / in_progress / completed
    archive_destination: .forge/archive/backlog-archive.yaml
    archive_rule: "completed entries older than 30 days, oldest-first"
  gotchas:
    path: .forge/GOTCHAS.yaml
    action: APPEND
    claude_web_writes: only new entries, at column zero (bare top-level list)
    consolidation_trigger: "100 entries or 1 month, run as its own session"
    archive_destination: .forge/archive/GOTCHAS-archive.yaml
    ordering: oldest-first, original numbering preserved
  rulings:
    path: .forge/rulings.yaml
    action: APPEND (written when made; the wrap confirms and back-fills misses)
    claude_web_writes: only missing entries
  handoff:
    path: .forge/handoff.yaml
    action: OVERWRITE (create if missing)
    claude_web_writes: complete file content per handoff_schema, with written_at_commit and written_at_utc
  changelog:
    path: CHANGELOG.yaml
    action: PREPEND (only when an entry passes the quality gate)
    claude_web_writes: only the new entry
    cap: "12 entries"
    archive_destination: .forge/archive/CHANGELOG-archive.yaml
    ordering: newest-at-top in both files
  session_history_archive:
    path: .forge/archive/session-history-archive.yaml
    action: APPEND
    ordering: oldest-first
  gotchas_archive:
    path: .forge/archive/GOTCHAS-archive.yaml
    action: APPEND
    ordering: oldest-first, original numbering preserved
    canonical: true
    warning: the only GOTCHAS archive; an archive at any other path is a defect to surface, never a place to write
  changelog_archive:
    path: .forge/archive/CHANGELOG-archive.yaml
    action: APPEND
    ordering: newest-at-top
  backlog_archive:
    path: .forge/archive/backlog-archive.yaml
    action: APPEND
    ordering: oldest-first

# --- E-029 initialization_templates -----------------------------------------
initialization_templates:
  session_state_init: |
    session_date: null
    project: null
    milestones: []
    decisions: []
    blockers: []
    next_steps: []
    context: ""
  active_bugs_init: |
    schema_version: "1.0"
    session_date: null
    project: null
    active_bugs: []
  session_history_init: |
    sessions: []
  backlog_init: |
    prioritized: []
    in_progress: []
    completed: []
  gotchas_init: |
    # GOTCHAS.yaml
    # Lessons learned for future sessions in this repo. Bare top-level list; append only.
  rulings_init: |
    # .forge/rulings.yaml
    # Append-only register of decisions Matt has made about this repo, so no future
    # session re-asks them. Search here BEFORE putting any question to Matt.
    # Never rewrite or soften an entry — supersede it with a new one.
    rulings: []
  changelog_init: |
    # CHANGELOG.yaml — Public-facing record of wins, features, and milestones
    entries: []
  handoff_init: |
    # .forge/handoff.yaml
    # Pass-the-baton briefing — written by the outgoing session to the next
    # generated: null
    # session: null
    written_at_commit: null
    written_at_utc: null
    status: ""
    first_thing: ""
    watch_out_for: []
    next_up: []
    north_star: ""
    tone: ""
  inbox_directory_init: |
    # .forge/inbox/ holds one observation file per run, .forge/inbox/<run-id>.yaml,
    # written by Claude Code as the last action of the run. The wrap consumes each
    # file and moves it to .forge/archive/inbox/<run-id>.yaml. Create the directory
    # with a .gitkeep file at .forge/inbox/.gitkeep; never a README.
  session_history_archive_init: |
    # .forge/archive/session-history-archive.yaml
    # Historical session log — entries moved here when the live file reaches its
    # cap. Oldest-first.
    sessions: []
  gotchas_archive_init: |
    # .forge/archive/GOTCHAS-archive.yaml
    # THE ONLY GOTCHAS ARCHIVE. Retired entries, oldest-first, original numbering
    # preserved. Never create a second archive at another path.
  changelog_archive_init: |
    # .forge/archive/CHANGELOG-archive.yaml
    # Full changelog history — entries moved here when the live file reaches its
    # cap. Newest-at-top.
    entries: []
  backlog_archive_init: |
    # .forge/archive/backlog-archive.yaml
    # Completed backlog items rotated out of the live file. Oldest-first.
    completed: []

# --- E-030 wrap_commit_message_and_evidence_count ---------------------------
wrap_commit_message_and_evidence_count: |
  THE DOCS COMMIT MESSAGE (or the PR title, when delivered as a PR):
    docs: end session YYYY-MM-DD — N milestones
  Append " + schema refresh" if the schema was refreshed; " + archive
  maintenance" if any archive move ran; " + primer refresh" if the phase
  authority was refreshed; " + inbox" naming the count of inbox files
  consumed. The message ENDS with the computed evidence line, exactly as the
  companion check printed it:
    N claims verified by ID, M reported unverified.
  M is the one wrap metric Matt looks at. The count is never typed by hand.

  THE WRAP REPORT to Matt, in plain English, after the push is proven:
  - Overall project position (one sentence — E-026)
  - What landed: commit SHA or PR number; one line per file written
  - Claims: N verified by ID, M reported unverified (and what could not be
    verified, and why)
  - Scope reconciliation: clean / drift handled as — [describe]
  - Inbox: consumed / missing, per run
  - Archive operations: ran (each Destination) / none needed
  - Schema refresh, phase authority, companion write: ran / untouched, as
    they apply to this repo
  - Rulings: all present / back-filled [ids]
  - Connector errors and workarounds, if any; "No issues encountered" when
    clean
  Then the next step as a verb and who holds the ball.

# --- E-045 compliance_canary_wrap -------------------------------------------
compliance_canary_wrap: |
  COMPLIANCE CANARY. This is the last section of the wrap protocol, and it is
  the cheap proof that the tail was read: the FIRST line of the wrap report
  to Matt ends with " · wrap protocol N blocks", where N is the included count
  in this file's BLOCK MANIFEST header. When the canary stops appearing, the
  tail of the protocol has stopped being read — that is a master bug to file
  in forgeflow, learned in one session instead of thirty.
