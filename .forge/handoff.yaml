  but git refuses to rebase on a DIRTY tree, and convergible is always dirty after a push
  (its ChromaQA gate appends to .chromaqa/CQA-debt.jsonl). Add the third case — no local
  commits plus a dirty tree means git merge --ff-only — to S-033, and one matching line to
  W-005. It rides the NEXT master change: do not cut a release for it alone, and do not
  re-render nine repos over two sentences. Verify by rendering the maximum fixture
  (master/tests/fixtures/config-tools-max.yaml with tree-tools-max) and reading S-033 in the
  output.

