# .forge/rulings.yaml — chromasmith/forgeflow
# Append-only register of decisions Matt has made about the ForgeFlow Master effort,
# so no future session re-asks them. Search here BEFORE putting any question to Matt.
# Format: one entry per ruling; never rewrite or soften an entry — supersede it with a new one.

rulings:
  - id: RULING-001
    date: 2026-09-04
    subject: Rollout order and stop point for the ForgeFlow Master effort
    ruling: >-
      The rollout has no fixed repo order. The blueprint's step 4 onward becomes
      "render one repo at a time, the repo and the moment chosen by Matt, each its
      own session and its own go." The Convergible FINAL repo is cloned from the
      rendered saas-starter, so it is never rendered before saas-starter. The stop
      point for THIS effort is the end of step 3 — both master protocol files
      written and a byte-stable render proven inside forgeflow. No repo is rendered
      until Matt names it.
    supersedes: BLUEPRINT.yaml v1.2 Section 11 steps 4-9 and rollout_rule (amended to v1.3 in the same commit)
    stated_by: Matt, in chat, at the step-3a session close
  - id: RULING-002
    date: 2026-09-04
    subject: First repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/seogeo is the FIRST repo rendered from the master, in its own
      fresh session with its own go. It was chosen as the lowest-risk pilot (small
      docs-plus-scripts repo, no build, deploy, database or dispatch, no concurrent
      Claude Code sessions). chromaqa is the likely second, in a later session of
      its own; when it is rendered its config must override subsystems.chromaqa to
      false, because render.py would otherwise detect the tool's own script at the
      repo root as a repo running ChromaQA. The housekeeping bundle deferred by
      RULING-001 (PROPAGATION_PROCEDURE.md, registered-repos.yaml, legacy banners,
      README repoint, CHANGELOG v1.0.0) lands in the seogeo render session.
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, at the close of the SEO/GEO master-change session ("I will start with SEO/GEO, per your recommendation")
  - id: RULING-003
    date: 2026-09-04
    subject: Second repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/chromasmith-saas-starter — the house SaaS template — is the SECOND repo
      rendered from the master, in its own session with its own go ("Let's install this in
      our new template"). Matt confirmed no Claude Code session was active on it before
      the push. This satisfies RULING-001's constraint that the Convergible final repo is
      never rendered before saas-starter: the final repo may now be cloned from the
      rendered template. A project spawned from the template re-renders the protocols with
      its own config (repo.name; build.deploy override dropped once linked to Vercel).
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, opening the render session (recorded at the wrap, not in the turn it was made — a W-002 miss)
  - id: RULING-004
    date: 2026-09-04
    subject: Third repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/forgeflow ITSELF — the home of the master — is the THIRD repo rendered
      from the master, in its own session with its own go ("lets begin installing it on the
      same repo"). Docs-only profile. There is no loop: master/ is the source and
      .forge/protocols/ the output; a render never reads .forge/protocols/. Matt confirmed
      the only other activity on forgeflow was a Claude Web session READING master/ to
      render another repo, and the render waited until that session's wrap commit
      (827dba9) had landed, because a wrap writes forgeflow's own .forge/ docs.
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, opening the render session (recorded in the turn it was made, per the RULING-003 W-002 lesson)
  - id: RULING-005
    date: 2026-09-04
    subject: Fourth repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/chromaqa — the ChromaQA quality-gate tool's own repo — is the FOURTH
      repo rendered from the master, in its own session with its own go ("I would like to
      install our protocol prompt system into the ChromaQA repo"). Per RULING-002 its
      config MUST override subsystems.chromaqa to false, because render.py would otherwise
      detect the tool's own chromaqa-check.sh at the repo root as a repo running the gate.
      Matt stated the only other active session is on chromasmith-saas-starter (installing
      the SEO/GEO tool there) — no Claude Code session on chromaqa, and no other Claude Web
      session mid-render, so no forgeflow wrap collision (GOTCHA-002).
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, opening the render session (recorded in the turn it was made, per W-002)
  - id: RULING-006
    date: 2026-09-04
    subject: chromaqa renders WITH the ChromaQA blocks (subsystems.chromaqa true)
    ruling: >-
      The "override subsystems.chromaqa to false" clause of RULING-002 (repeated in
      RULING-005) is WITHDRAWN. Its premise was wrong: chromasmith/chromaqa genuinely runs
      ChromaQA on itself — .github/workflows/quality-gate.yml, a live .chromaqa/CQA-debt.jsonl,
      and the CLAUDE.md decision of 2026-09-03 (closing CQA-042) saying "this repo runs
      ChromaQA on itself". Detection is therefore correct, not a mis-detection, and the
      ChromaQA start/wrap blocks (debt check, push-gate rule, CI reading) render IN. The
      rest of RULING-005 stands. Profile docs-only; backlog prefix CQA-; north_star_doc =
      .forge/plans/chromaqa-modernization-plan.yaml (BRIEF.yaml is superseded). Recorded as
      Claude Web's error: the override was filed before the repo was inspected.
    supersedes: the subsystems.chromaqa override clause of RULING-002 and RULING-005 (repo choice and concurrency statements unchanged)
    stated_by: Matt, in chat ("go" on the corrected plan, opening the chromaqa render)
  - id: RULING-007
    date: 2026-09-04
    subject: Fifth repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/synclips-platform — the Synclips system's main repo — is the FIFTH repo
      rendered from the master, in its own session with its own go ("synclips-platform
      please"). It is the first Synclips-system repo and the first repo with a declared
      companion (synclips-relay, role relay, governing doc PROTOCOL.md, per blueprint
      Section 10 variant_mapping); the relay stays as-is. Tree inspected BEFORE this ruling
      (GOTCHA-003): pnpm/turbo monorepo (apps/admin, apps/marketplace, packages/), root
      package.json, supabase/ present, .chromaqa/ + chromaqa-check.sh + quality-gate.yml
      (this repo runs the gate on itself), vercel.json in apps/admin, no
      .forge/protocols/, no .forge/rulings.yaml, no artifact register, GOTCHAS.yaml at
      140 KB. No subsystem override is filed in this ruling; the config is written from
      what render.py detects on the real tree, and any override lands in the config
      commit with its reason. Matt's answer on concurrent Claude Code / Claude Web sessions
      is taken before any push and recorded in the session notes.
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, in this session ("synclips-platform please"), recorded in the turn it was made per W-002
