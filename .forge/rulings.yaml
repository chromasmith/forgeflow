# .forge/rulings.yaml — chromasmith/forgeflow
# Append-only register of decisions Matt has made about the ForgeFlow Master effort,
# so no future session re-asks them. Search here BEFORE putting any question to Matt.
# Format: one entry per ruling; never rewrite or soften an entry — supersede it with a new one.

rulings:
  - id: RULING-001
    date: 2026-09-04
    subject: Rollout order and stop point for the ForgeFlow Master effort
    ruling: >-
      The rollout has no fixed repo order. The blueprint's step 4 onward becomes
      "render one repo at a time, the repo and the moment chosen by Matt, each its
      own session and its own go." The Convergible FINAL repo is cloned from the
      rendered saas-starter, so it is never rendered before saas-starter. The stop
      point for THIS effort is the end of step 3 — both master protocol files
      written and a byte-stable render proven inside forgeflow. No repo is rendered
      until Matt names it.
    supersedes: BLUEPRINT.yaml v1.2 Section 11 steps 4-9 and rollout_rule (amended to v1.3 in the same commit)
    stated_by: Matt, in chat, at the step-3a session close
  - id: RULING-002
    date: 2026-09-04
    subject: First repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/seogeo is the FIRST repo rendered from the master, in its own
      fresh session with its own go. It was chosen as the lowest-risk pilot (small
      docs-plus-scripts repo, no build, deploy, database or dispatch, no concurrent
      Claude Code sessions). chromaqa is the likely second, in a later session of
      its own; when it is rendered its config must override subsystems.chromaqa to
      false, because render.py would otherwise detect the tool's own script at the
      repo root as a repo running ChromaQA. The housekeeping bundle deferred by
      RULING-001 (PROPAGATION_PROCEDURE.md, registered-repos.yaml, legacy banners,
      README repoint, CHANGELOG v1.0.0) lands in the seogeo render session.
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, at the close of the SEO/GEO master-change session ("I will start with SEO/GEO, per your recommendation")
  - id: RULING-003
    date: 2026-09-04
    subject: Second repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/chromasmith-saas-starter — the house SaaS template — is the SECOND repo
      rendered from the master, in its own session with its own go ("Let's install this in
      our new template"). Matt confirmed no Claude Code session was active on it before
      the push. This satisfies RULING-001's constraint that the Convergible final repo is
      never rendered before saas-starter: the final repo may now be cloned from the
      rendered template. A project spawned from the template re-renders the protocols with
      its own config (repo.name; build.deploy override dropped once linked to Vercel).
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, opening the render session (recorded at the wrap, not in the turn it was made — a W-002 miss)
  - id: RULING-004
    date: 2026-09-04
    subject: Third repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/forgeflow ITSELF — the home of the master — is the THIRD repo rendered
      from the master, in its own session with its own go ("lets begin installing it on the
      same repo"). Docs-only profile. There is no loop: master/ is the source and
      .forge/protocols/ the output; a render never reads .forge/protocols/. Matt confirmed
      the only other activity on forgeflow was a Claude Web session READING master/ to
      render another repo, and the render waited until that session's wrap commit
      (827dba9) had landed, because a wrap writes forgeflow's own .forge/ docs.
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, opening the render session (recorded in the turn it was made, per the RULING-003 W-002 lesson)
  - id: RULING-005
    date: 2026-09-04
    subject: Fourth repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/chromaqa — the ChromaQA quality-gate tool's own repo — is the FOURTH
      repo rendered from the master, in its own session with its own go ("I would like to
      install our protocol prompt system into the ChromaQA repo"). Per RULING-002 its
      config MUST override subsystems.chromaqa to false, because render.py would otherwise
      detect the tool's own chromaqa-check.sh at the repo root as a repo running the gate.
      Matt stated the only other active session is on chromasmith-saas-starter (installing
      the SEO/GEO tool there) — no Claude Code session on chromaqa, and no other Claude Web
      session mid-render, so no forgeflow wrap collision (GOTCHA-002).
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, opening the render session (recorded in the turn it was made, per W-002)
  - id: RULING-006
    date: 2026-09-04
    subject: chromaqa renders WITH the ChromaQA blocks (subsystems.chromaqa true)
    ruling: >-
      The "override subsystems.chromaqa to false" clause of RULING-002 (repeated in
      RULING-005) is WITHDRAWN. Its premise was wrong: chromasmith/chromaqa genuinely runs
      ChromaQA on itself — .github/workflows/quality-gate.yml, a live .chromaqa/CQA-debt.jsonl,
      and the CLAUDE.md decision of 2026-09-03 (closing CQA-042) saying "this repo runs
      ChromaQA on itself". Detection is therefore correct, not a mis-detection, and the
      ChromaQA start/wrap blocks (debt check, push-gate rule, CI reading) render IN. The
      rest of RULING-005 stands. Profile docs-only; backlog prefix CQA-; north_star_doc =
      .forge/plans/chromaqa-modernization-plan.yaml (BRIEF.yaml is superseded). Recorded as
      Claude Web's error: the override was filed before the repo was inspected.
    supersedes: the subsystems.chromaqa override clause of RULING-002 and RULING-005 (repo choice and concurrency statements unchanged)
    stated_by: Matt, in chat ("go" on the corrected plan, opening the chromaqa render)
  - id: RULING-007
    date: 2026-09-04
    subject: Fifth repo to render from the ForgeFlow Master
    ruling: >-
      chromasmith/synclips-platform — the Synclips system's main repo — is the FIFTH repo
      rendered from the master, in its own session with its own go ("synclips-platform
      please"). It is the first Synclips-system repo and the first repo with a declared
      companion (synclips-relay, role relay, governing doc PROTOCOL.md, per blueprint
      Section 10 variant_mapping); the relay stays as-is. Tree inspected BEFORE this ruling
      (GOTCHA-003): pnpm/turbo monorepo (apps/admin, apps/marketplace, packages/), root
      package.json, supabase/ present, .chromaqa/ + chromaqa-check.sh + quality-gate.yml
      (this repo runs the gate on itself), vercel.json in apps/admin, no
      .forge/protocols/, no .forge/rulings.yaml, no artifact register, GOTCHAS.yaml at
      140 KB. No subsystem override is filed in this ruling; the config is written from
      what render.py detects on the real tree, and any override lands in the config
      commit with its reason. Matt's answer on concurrent Claude Code / Claude Web sessions
      is taken before any push and recorded in the session notes.
    supersedes: nothing — RULING-001 said Matt names the repo; this is him naming it
    stated_by: Matt, in chat, in this session ("synclips-platform please"), recorded in the turn it was made per W-002
  - id: RULING-008
    date: 2026-09-04
    subject: Sixth and seventh repos to render; the "one render per session" clause relaxed for the Synclips trio
    ruling: >-
      After synclips-platform landed (registry 56978f9), Matt asked whether the other
      Synclips-system repos must each be rendered individually; the answer is yes (each has
      its own tree, config and companion knob; the relay itself is never rendered). He then
      agreed to render them BACK-TO-BACK IN THIS SESSION ("i agree. go"): chromasmith/chromasync
      is the SIXTH repo rendered from the master and chromasmith/dv-captain the SEVENTH, in
      that order, each still with its own tree inspection, config, render, proof and go, but
      without a fresh chat between them. This relaxes only the "each its own session" wording
      of RULING-001 for these two repos; "one repo at a time" and "Matt names the repo" are
      unchanged, and no further repo is rendered after dv-captain until he names it. Both are
      Synclips-system repos, so each config declares synclips-relay (role relay, PROTOCOL.md)
      as its companion. Concurrency (Matt, this session): he has not opened any Synclips repo
      in several days; his only other Claude chats are the SEO/GEO install into
      chromasmith-saas-starter and a GoDaddy-to-Cloudflare DNS transfer — no Claude Code
      session on chromasync or dv-captain, no other Claude Web session mid-render.
      Profile, knobs and every override are written from what the tree shows at render time
      (GOTCHA-003), never from this ruling.
    supersedes: the "each its own session" clause of RULING-001, for chromasync and dv-captain only
    stated_by: Matt, in chat, in this session ("i agree. go"), recorded in the turn it was made per W-002
  - id: RULING-009
    date: 2026-09-05
    subject: Master v1.0.0 is FLAWED — confirmed repair list, order, and rollout rule (the "fix session")
    ruling: >-
      Matt confirmed the FORGEFLOW MASTER DEFECT REPORT (raised 2026-09-05 in the saas-starter
      session) and closed debate on it: ALL FOUR defects are repaired in the master, plus two
      QC findings from this session and the three open backlog items, in ONE master change.
      (1) FFD-001 dispatch harness never rolled out: none of the seven rendered repos has
      .github/workflows/claude.yml, so every rendered protocol is dispatch-off. Matt's
      requirement, in his words: all three ways of working — Claude Web direct, a pasted Claude
      Code prompt, and dispatch incl. parallel runs — must be available at his discretion in ANY
      repo at any time. Correction to the report: execution.dispatch.enabled is a DECLARED knob
      (default false in all three profiles), not derived; the root cause is that every render
      accepted the profile default without asking him or installing the harness. Fix: ship a
      generic claude.yml as a master asset, default dispatch ON in the profiles, renderer says
      loudly when dispatch is off because the harness is absent, harness install becomes a named
      rollout step. (2) FFD-002 S-006/S-007 boundary redrawn around RISK, not folder (Matt:
      a misspelling needs no prompt ceremony) — Matt still owes the ruling on the exact test and
      on copy-only edits inside compiled files (.tsx). (3) FFD-003 the start protocol read is
      not enforced and the S-075 canary cannot catch a session that never started: Session
      Context Summary becomes mandatory before any work, with a stop-and-restart rule.
      (4) FFD-004 no working method is offered that the repo cannot do or the protocol forbids;
      verify from the rendered header, never memory. QC findings accepted as work: (5) the
      schema's allowed_tools promise ("copied from claude.yml at render time; renderer warns on
      mismatch") is NOT implemented in render.py; (6) S-072 (branch protection = the dispatch
      switch) collides with E-002 (wrap pushes docs directly to main) — Matt owes the design
      ruling; dispatch-available must not mean protection permanently on. Riding along:
      FF-001, FF-003, FF-004. FF-002 is already closed (afce4c9). ORDER: FFD-003 -> FFD-004 ->
      FFD-002 -> FFD-001 (with 5 and 6), one master change, version bump, byte-stable fixture
      proof. ROLLOUT RULE: the master is fixed and proven FIRST; no rendered repo is touched
      until then; then CLAUDE_CODE_OAUTH_TOKEN is installed per repo (chromasmith is a personal
      account — no org secrets; preferred route: one Claude Code prompt using `op read` +
      `gh secret set` across all seven repos so Matt never handles the token; fallback: one
      "New secret" link per repo, interview style); Matt creates claude.yml per repo via the web
      editor (connector cannot write workflows); then the seven repos re-render one at a time.
      The token is NEVER committed into a repo. Concurrency at this ruling: Matt's only other
      session is the SEO/GEO install into chromasmith-saas-starter (no Claude Code on
      forgeflow) — saas-starter is re-rendered LAST, after that install is finished.
    supersedes: the "WAIT" first_thing of the 2026-09-05 handoff; RULING-001's stop point (the effort is reopened for this repair); the profile default execution.dispatch.enabled false
    stated_by: Matt, in chat, in this session ("This is now our confirmed list of duties"; "There is no question that I want my Claude Web sessions to be able to dispatch work"), recorded in the turn per W-002
  - id: RULING-010
    date: 2026-09-05
    subject: Claude Web's direct-edit boundary is drawn around RISK, not folder (FFD-002)
    ruling: >-
      S-006/S-007 are redrawn. The purpose of the role boundary is verification: Claude Web
      cannot run a build, so it must not touch anything whose breakage a build would catch.
      The test is therefore about risk, not file category. Claude Web may edit a repo file
      DIRECTLY through the GitHub connector only when ALL of these hold: (a) the file is not
      compiled, imported, executed or type-checked by the build; (b) it is not a dependency
      manifest or lockfile; (c) it is not under .github/workflows/ (Matt-only, unchanged);
      (d) it holds no credentials or identity material (never_touch_paths, unchanged); (e) it
      is not a rendered protocol file under .forge/protocols/ (master-only, unchanged); and
      (f) the change is a single spot, not a restructure. This PERMITS direct edits to README,
      LICENSE, docs/*.md, the .forge/ documentation layer, comment-only changes, and copy or
      link fixes in files the build does not compile. It still FORBIDS direct edits to any
      .ts/.tsx/.js/.py source, package.json, lockfiles, migrations, workflows and anything
      .env — including a copy-only change inside a compiled file such as a footer href in a
      .tsx: the file is compiled, so it stays prompt-only; the bright line is worth more than
      the convenience. Claude Code remains the main build flow; direct edits are for changes
      where the prompt ceremony is not worth it (Matt: "perhaps there was something misspelled
      somewhere"). The master text of S-006 and S-007 is rewritten to this test in the v1.1.0
      master change.
    supersedes: the folder/category wording of S-006 ("never edits repo APPLICATION files") and S-007 ("Application code, migrations, config and workflows remain prompt-only") — the risk test replaces it; the .github/workflows/, secrets and rendered-protocol prohibitions are unchanged
    stated_by: Matt, in chat, in this session ("go" on Claude's recommended test), recorded in the turn per W-002
  - id: RULING-011
    date: 2026-09-05
    subject: Branch protection is a guard against runners, not the dispatch switch (S-072 / E-002 collision)
    ruling: >-
      Dispatch availability is decoupled from branch protection. A repo's dispatch is "on"
      when the harness is installed — .github/workflows/claude.yml present and the
      CLAUDE_CODE_OAUTH_TOKEN Actions secret set — and the config knob says so; "branch
      protection on main" is REMOVED from execution.dispatch.requires and S-072 no longer
      calls protection "the pipeline's switch". Branch protection on the default branch stays
      ON permanently in every repo that carries the harness, configured so that repository
      administrators bypass it: Matt is the owner, and both his local Claude Code pushes and
      Claude Web's connector pushes act as Matt, so wraps, rulings and direct edits keep
      landing on main exactly as today, while a runner's token cannot push main and must go
      through a PR that Claude Web opens and Matt approves. The collision with E-002 (wrap
      pushes docs directly to main) is therefore resolved by configuration, and E-002 gains
      one fallback line: if a direct docs push is ever rejected by protection, deliver the
      same content as a PR — no ceremony, no re-planning. Per-repo step at rollout: after
      Matt turns protection on (a GitHub web action), Claude Web proves the bypass with a
      one-line docs commit before any dispatch; a rejection means "include administrators"
      is ticked and Matt unticks it. Matt's plain-English summary he approved: dispatch is
      simply on once the harness is installed; main stays locked only against the robots;
      nothing changes in how he works.
    supersedes: S-072 "Branch protection is the pipeline's switch" framing; the "branch protection on main" entry in execution.dispatch.requires; the 2026-09-05 defect-report caution that protection is its own separate decision (it is now a fixed part of harness install)
    stated_by: Matt, in chat, in this session ("go" on the simplified version), recorded in the turn per W-002
  - id: RULING-012
    date: 2026-09-05
    subject: Rollout order for the v1.1.0 re-renders (and convergible-sandbox named)
    ruling: >-
      After seogeo, the order is chromasmith/chromasmith-saas-starter NEXT, then
      chromasmith/convergible-sandbox, then the remaining repos in the order Claude Web sees
      fit (synclips-platform, chromasync, dv-captain). This supersedes the RULING-009 clause
      that saas-starter goes LAST; the concurrency check still applies — before saas-starter
      is touched, Matt confirms in one line that the SEO/GEO install session there has
      finished. convergible-sandbox is a FIRST render, not a re-render: it is the lineage
      source of the dispatch blocks, it already carries the harness (claude.yml, secret,
      branch protection) and the old four-file protocol set, and it is not in the registry.
      Matt naming it here satisfies RULING-001; its step-4 prerequisites recorded in the
      forgeflow handoff (repo-rules.yaml for the DOC-FOLD-1 items, CC-reports to .forge/inbox
      rename) are checked against the tree before its config is written (GOTCHA-003), and
      any override lands in the config commit with its reason. Its claude.yml carries the
      Convergible overlay (PG env, psql, bunx) and is NOT replaced by the generic asset.
    supersedes: the "saas-starter LAST" ordering clause of RULING-009 (its concurrency condition stands)
    stated_by: Matt, in chat, in this session ("lets do the sass starter repo next followed by convergible sandbox, then continue as you see fit"), recorded in the turn per W-002
