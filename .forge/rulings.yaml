      session ("Continue" on Claude Web's recommendation): the ceilings are re-measured on the
      real convergible knob set and raised to start 2000 / end 1700 by the same documented
      method (about 15 percent headroom, rounded up to the nearest 50); the dispatch ceilings
      (650 / 150) are untouched and were never close. P11's replace-to-add discipline is
